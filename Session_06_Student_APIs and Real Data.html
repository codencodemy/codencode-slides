pan>,\n            <span class=\"st\">\"home_goals_per_game\"</span>, <span class=\"st\">\"away_goals_per_game\"</span>]\nX = matches[features]\ny = matches[<span class=\"st\">\"result\"</span>]   <span class=\"cm\"># H / D / A</span>\n\nX_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=<span class=\"nm\">0.25</span>, random_state=<span class=\"nm\">42</span>, stratify=y)\n\nrf = RandomForestClassifier(n_estimators=<span class=\"nm\">200</span>, random_state=<span class=\"nm\">42</span>)\nrf.fit(X_train, y_train)\n\npred = rf.predict(X_test)\n<span class=\"fn\">print</span>(classification_report(y_test, pred,\n      target_names=[<span class=\"st\">\"Away Win\"</span>,<span class=\"st\">\"Draw\"</span>,<span class=\"st\">\"Home Win\"</span>]))\n\n<span class=\"cm\"># ── Feature importance ────────────────────────────────────</span>\nimp = pd.Series(rf.feature_importances_, index=features).sort_values()\nimp.plot(kind=<span class=\"st\">\"barh\"</span>, color=<span class=\"st\">\"#4facfe\"</span>)\nplt.title(<span class=\"st\">\"What drives match outcomes?\"</span>); plt.tight_layout()\nplt.show()</pre>\n    <div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Engineers features from match data (goal diff, possession gap), trains RandomForest to predict match outcome.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">get_dummies()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ one-hot encodes team names — converts strings to numbers for the ML model</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">train_test_split()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ splits matches into train (group stage) and test (knockouts) sets</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">fit()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ trains the RandomForest classifier on match features and outcome labels</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">predict()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ predicts H (home win) / D (draw) / A (away win) for each test match</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">classification_report()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ shows precision, recall, F1 for each class — Home Win / Draw / Away Win</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">feature_importances_()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ shows which features most influenced the model's predictions</span></div></div></div>\n  </div>\n</div>"}, {"label": "Common Mistakes", "html": "<div class=\"section-tag\">Watch Out!</div><div class=\"slide-heading\">Common API Mistakes ⚠️</div><div class=\"e-list\"><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Parsing before checking status code</strong><br><code>data = response.json()</code> on an error response gives you an error message dict, not your data.<br>✅ Fix: Always check <code>response.status_code == 200</code> or call <code>response.raise_for_status()</code></div></div><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Hardcoding API keys in source code</strong><br>Pushed to GitHub = compromised key, possible billing charges on your account.<br>✅ Fix: Always use <code>.env</code> + <code>python-dotenv</code> and add <code>.env</code> to <code>.gitignore</code> before first commit.</div></div><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>No timeout on requests</strong><br>If server is unreachable, your program hangs forever — looks like a crash.<br>✅ Fix: <code>requests.get(url, timeout=10)</code></div></div><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Hammering the API with a fast loop</strong><br>Looping 1000 requests with no delay gets you rate-limited or banned.<br>✅ Fix: <code>import time; time.sleep(0.5)</code> between calls.</div></div></div>"}, {"label": "Quiz — Session 6", "html": "<div class=\"section-tag\">Knowledge Check</div>\n<h2 class=\"slide-heading\">🧠 Quick Quiz — Session 6</h2>\n<div style=\"display:flex;flex-direction:column;gap:14px;flex:1;\">\n\n  <!-- Q1 -->\n  <div style=\"background:var(--card);border-radius:12px;padding:14px 16px;border:1px solid rgba(255,255,255,0.08);\">\n    <div style=\"font-size:13px;font-weight:700;color:#fff;margin-bottom:10px;\">\n      Q1 &nbsp;What does <code style=\"color:#d2a8ff;font-family:monospace;\">requests.get(url)</code> return?\n    </div>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:7px;\" class=\"s6-opts\">\n      <div onclick=\"s6q(this,0)\" style=\"cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);font-size:12px;color:#aaa;transition:all .2s;\">A &nbsp; A Python dictionary</div>\n      <div onclick=\"s6q(this,1)\" style=\"cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);font-size:12px;color:#aaa;transition:all .2s;\">B &nbsp; A <code style=\"color:#d2a8ff;font-family:monospace;\">Response</code> object ✓</div>\n      <div onclick=\"s6q(this,0)\" style=\"cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);font-size:12px;color:#aaa;transition:all .2s;\">C &nbsp; A JSON file saved to disk</div>\n      <div onclick=\"s6q(this,0)\" style=\"cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);font-size:12px;color:#aaa;transition:all .2s;\">D &nbsp; A list of HTTP headers</div>\n    </div>\n    <div class=\"s6-explain\" style=\"display:none;margin-top:8px;padding:7px 11px;background:rgba(67,233,123,0.1);border-radius:7px;font-size:11.5px;color:#43e97b;border-left:3px solid #43e97b;\">\n      ✅ <strong>B is correct.</strong> <code style=\"color:#d2a8ff;font-family:monospace;\">requests.get()</code> returns a <code style=\"color:#d2a8ff;font-family:monospace;\">Response</code> object. Call <code style=\"color:#d2a8ff;font-family:monospace;\">.json()</code> to parse the body, <code style=\"color:#d2a8ff;font-family:monospace;\">.text</code> for raw string, <code style=\"color:#d2a8ff;font-family:monospace;\">.status_code</code> to check success.\n    </div>\n  </div>\n\n  <!-- Q2 -->\n  <div style=\"background:var(--card);border-radius:12px;padding:14px 16px;border:1px solid rgba(255,255,255,0.08);\">\n    <div style=\"font-size:13px;font-weight:700;color:#fff;margin-bottom:10px;\">\n      Q2 &nbsp;You want to rank FIFA 2026 teams by total goals scored. Best pandas approach?\n    </div>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:7px;\" class=\"s6-opts\">\n      <div onclick=\"s6q(this,0)\" style=\"cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);font-size:12px;color:#aaa;transition:all .2s;\">A &nbsp; <code style=\"color:#d2a8ff;font-family:monospace;\">filter() then sum()</code></div>\n      <div onclick=\"s6q(this,1)\" style=\"cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);font-size:12px;color:#aaa;transition:all .2s;\">B &nbsp; <code style=\"color:#d2a8ff;font-family:monospace;\">groupby() → agg() → sort_values()</code> ✓</div>\n      <div onclick=\"s6q(this,0)\" style=\"cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);font-size:12px;color:#aaa;transition:all .2s;\">C &nbsp; <code style=\"color:#d2a8ff;font-family:monospace;\">merge() → drop_duplicates()</code></div>\n      <div onclick=\"s6q(this,0)\" style=\"cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);font-size:12px;color:#aaa;transition:all .2s;\">D &nbsp; <code style=\"color:#d2a8ff;font-family:monospace;\">apply(lambda) → head()</code></div>\n    </div>\n    <div class=\"s6-explain\" style=\"display:none;margin-top:8px;padding:7px 11px;background:rgba(67,233,123,0.1);border-radius:7px;font-size:11.5px;color:#43e97b;border-left:3px solid #43e97b;\">\n      ✅ <strong>B is correct.</strong> <code style=\"color:#d2a8ff;font-family:monospace;\">groupby(\"team\").agg({\"goals\":\"sum\"}).sort_values(\"goals\", ascending=False)</code> — group → aggregate → sort. Clean 3-step pipeline.\n    </div>\n  </div>\n\n  <!-- Q3 -->\n  <div style=\"background:var(--card);border-radius:12px;padding:14px 16px;border:1px solid rgba(255,255,255,0.08);\">\n    <div style=\"font-size:13px;font-weight:700;color:#fff;margin-bottom:10px;\">\n      Q3 &nbsp;Why store API keys in a <code style=\"color:#d2a8ff;font-family:monospace;\">.env</code> file instead of hardcoding them?\n    </div>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:7px;\" class=\"s6-opts\">\n      <div onclick=\"s6q(this,0)\" style=\"cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);font-size:12px;color:#aaa;transition:all .2s;\">A &nbsp; .env files run faster than strings</div>\n      <div onclick=\"s6q(this,0)\" style=\"cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);font-size:12px;color:#aaa;transition:all .2s;\">B &nbsp; Python cannot read strings with special chars</div>\n      <div onclick=\"s6q(this,1)\" style=\"cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);font-size:12px;color:#aaa;transition:all .2s;\">C &nbsp; Keeps secrets out of code — won't leak to GitHub ✓</div>\n      <div onclick=\"s6q(this,0)\" style=\"cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);font-size:12px;color:#aaa;transition:all .2s;\">D &nbsp; .env files are auto-encrypted</div>\n    </div>\n    <div class=\"s6-explain\" style=\"display:none;margin-top:8px;padding:7px 11px;background:rgba(67,233,123,0.1);border-radius:7px;font-size:11.5px;color:#43e97b;border-left:3px solid #43e97b;\">\n      ✅ <strong>C is correct.</strong> Hardcoded keys get committed to GitHub and scraped by bots in minutes. <code style=\"color:#d2a8ff;font-family:monospace;\">.env</code> + <code style=\"color:#d2a8ff;font-family:monospace;\">.gitignore</code> keeps them private. Use <code style=\"color:#d2a8ff;font-family:monospace;\">python-dotenv</code> + <code style=\"color:#d2a8ff;font-family:monospace;\">os.getenv(\"KEY\")</code>.\n    </div>\n  </div>\n\n</div>"}, {"label": "Session Recap", "html": "<div class=\"section-tag\">Session Recap</div><div class=\"slide-heading\">What You've Learned 🎉</div><div class=\"recap-grid\"><div class=\"recap-item\"><div class=\"recap-icon\">🌐</div><div class=\"recap-text\"><h4>APIs</h4><p>GET request → JSON response → DataFrame. Status codes: 200=OK, 401=bad key, 429=rate limited.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📦</div><div class=\"recap-text\"><h4>JSON</h4><p>json.loads() to parse, json.dump() to save. Use .get(\"key\", default) for safe access. json_normalize() for nested.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🔌</div><div class=\"recap-text\"><h4>requests</h4><p>requests.get(url, params={}, headers={}, timeout=10). Always check status. Use raise_for_status() and try/except.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📈</div><div class=\"recap-text\"><h4>yfinance</h4><p>yf.download(tickers, period). pct_change() for returns. cumprod() for cumulative. Normalise to 100 for comparison.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🔑</div><div class=\"recap-text\"><h4>API Security</h4><p>.env + python-dotenv. Never hardcode keys. .gitignore before first commit. Rotate compromised keys immediately.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📚</div><div class=\"recap-text\"><h4>Data Sources</h4><p>Kaggle, data.gov.sg, Open-Meteo (free/no key), seaborn built-ins, yfinance — all free, all great for projects.</p></div></div></div><div class=\"highlight\" style=\"margin-top:auto;\">🚀 <strong>Next:</strong> Session 7 — Statistics &amp; Probability: understand what your numbers are truly telling you</div>"}];







let cur=0;
const wrap=document.getElementById('slides-wrap');
const dotsEl=document.getElementById('dots');

function s6q(el, correct) {
  var grid = el.parentElement;
  var opts = grid.querySelectorAll("div");
  var explain = grid.parentElement.querySelector(".s6-explain");
  opts.forEach(function(o){ o.style.pointerEvents="none"; });
  if (correct) {
    el.style.background="rgba(67,233,123,0.18)"; el.style.borderColor="#43e97b"; el.style.color="#43e97b";
  } else {
    el.style.background="rgba(245,87,108,0.18)"; el.style.borderColor="#f5576c"; el.style.color="#f5576c";
    opts.forEach(function(o){
      if(o.getAttribute("onclick") && o.getAttribute("onclick").indexOf(",1)")!==-1){
        o.style.background="rgba(67,233,123,0.18)"; o.style.borderColor="#43e97b"; o.style.color="#43e97b";
      }
    });
  }
  if(explain) explain.style.display="block";
}
function renderSlides(){
  wrap.innerHTML='';dotsEl.innerHTML='';
  SLIDES_DATA.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===0?' active':'');
    div.innerHTML=s.html;
    wrap.appendChild(div);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>jump(i);
    dotsEl.appendChild(dot);
  });
  updateUI();
}
function updateUI(){
  const t=SLIDES_DATA.length;
  document.getElementById('counter').textContent=(cur+1)+' / '+t;
  document.getElementById('progress-bar').style.width=((cur+1)/t*100)+'%';
  document.getElementById('slide-title-bar').textContent=SLIDES_DATA[cur].label||'';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===t-1;
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===cur));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===cur));
}
function go(d){jump(cur+d);}
function jump(i){if(i<0||i>=SLIDES_DATA.length)return;cur=i;updateUI();document.querySelectorAll('.slide')[cur].scrollTop=0;}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='Home')jump(0);
  if(e.key==='End')jump(SLIDES_DATA.length-1);
});
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

let _tx=0;
document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>50){go(dx<0?1:-1);}
},{passive:true});
renderSlides();
</script></body></html>
