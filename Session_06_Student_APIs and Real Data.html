<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Session 06 — APIs & Real Data</title><style>
:root{--accent:#f97583;--bg:#0f0f1a;--text:#e8e8f0;--muted:#8888aa;--code-bg:#0d1117;--card:#1e2240;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;}
#deck{width:100%;height:100vh;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;gap:12px;}
#session-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;white-space:nowrap;}
#slide-title-bar{font-size:12px;color:var(--muted);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topbar-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}
#counter{font-size:12px;color:var(--muted);white-space:nowrap;}
.btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--text);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all 0.15s;}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#000;}
#progress-wrap{height:3px;background:rgba(255,255,255,0.05);flex-shrink:0;}
#progress-bar{height:100%;background:var(--accent);transition:width 0.3s ease;}
#slides-wrap{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:22px 44px 18px;overflow-y:auto;animation:fadeIn 0.25s ease;}
.slide.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
#nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 24px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.06);}
.nav-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:7px 26px;border-radius:8px;font-size:14px;cursor:pointer;transition:all 0.15s;}
.nav-btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#000;}
.nav-btn:disabled{opacity:0.3;cursor:default;}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:600px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.2s;}
.dot.active{background:var(--accent);transform:scale(1.5);}
.slide-title{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1e2a4a 0%,#0f0f1a 70%);}
.session-badge{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:20px;padding:5px 16px;border:1px solid var(--accent);border-radius:20px;display:inline-block;}
.slide-title h1{font-size:clamp(26px,3.4vw,46px);font-weight:800;line-height:1.15;margin-bottom:16px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:pre-line;}
.slide-title .sub{font-size:14px;color:var(--muted);max-width:580px;line-height:1.6;margin-bottom:28px;}
.academy-tag{font-size:12px;color:var(--muted);letter-spacing:1px;}
.section-tag{font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.slide-heading{font-size:clamp(17px,2.2vw,28px);font-weight:700;margin-bottom:14px;line-height:1.25;}
.cards{display:grid;gap:11px;}
.cards-2{grid-template-columns:1fr 1fr;}
.cards-3{grid-template-columns:1fr 1fr 1fr;}
.cards-4{grid-template-columns:1fr 1fr 1fr 1fr;}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:14px 16px;}
.card-accent{border-left:3px solid var(--accent);}
.card-icon{font-size:22px;margin-bottom:6px;}
.card h3{font-size:13px;font-weight:700;margin-bottom:4px;color:#fff;}
.card p{font-size:11.5px;color:var(--muted);line-height:1.55;}
.steps{display:flex;flex-direction:column;gap:9px;}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:10px;padding:11px 14px;border:1px solid rgba(255,255,255,0.06);}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-body h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.step-body p{font-size:12px;color:var(--muted);line-height:1.5;}
.code-wrap{flex:1;display:flex;flex-direction:column;min-height:100px;background:var(--code-bg);border-radius:10px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;margin:8px 0;}
.code-header{background:rgba(255,255,255,0.05);padding:5px 13px;font-size:11px;color:var(--muted);font-family:monospace;display:flex;justify-content:space-between;align-items:center;}
pre{padding:9px 13px;overflow-x:auto;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:13.5px;line-height:1.75;color:#c9d1d9;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.cm{color:#8b949e;font-style:italic;}.nm{color:#79c0ff;}.op{color:#ff9e64;}
.highlight{background:rgba(255,255,255,0.04);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;font-size:13px;line-height:1.6;}
.highlight strong{color:var(--accent);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;flex:1;}
.warn{background:rgba(255,100,50,0.1);border:1px solid rgba(255,100,50,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.tip{background:rgba(80,220,100,0.1);border:1px solid rgba(80,220,100,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.roadmap-item{background:var(--card);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.06);display:flex;gap:9px;align-items:flex-start;}
.rm-num{font-size:18px;font-weight:900;color:var(--accent);opacity:0.4;line-height:1;flex-shrink:0;width:22px;}
.rm-icon{font-size:17px;flex-shrink:0;}
.rm-text h4{font-size:12px;font-weight:700;margin-bottom:2px;}
.rm-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;}
.recap-item{background:var(--card);border-radius:10px;padding:12px;border-left:3px solid var(--accent);display:flex;gap:8px;align-items:flex-start;}
.recap-icon{font-size:17px;flex-shrink:0;}
.recap-text h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.recap-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.e-list{display:flex;flex-direction:column;gap:8px;}
.e-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.55;}
.e-icon{font-size:15px;flex-shrink:0;}
table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0;}
th{background:rgba(255,255,255,0.06);padding:7px 10px;text-align:left;font-weight:700;color:var(--accent);}
td{padding:6px 10px;border-top:1px solid rgba(255,255,255,0.05);color:var(--muted);}
.slide::-webkit-scrollbar{width:4px;}
.slide::-webkit-scrollbar-track{background:transparent;}
.slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;margin:2px;}
.tag-green{background:rgba(80,200,80,0.2);color:#50c850;border:1px solid rgba(80,200,80,0.3);}
.tag-blue{background:rgba(80,150,255,0.2);color:#79c0ff;border:1px solid rgba(80,150,255,0.3);}
.tag-orange{background:rgba(255,150,50,0.2);color:#ff9e64;border:1px solid rgba(255,150,50,0.3);}
.big-concept{background:linear-gradient(135deg,#1e2a4a,#1e2240);border:1px solid rgba(249,117,131,0.3);border-radius:14px;padding:20px 24px;margin:10px 0;text-align:center;}
.big-concept .bc-emoji{font-size:36px;margin-bottom:8px;}
.big-concept h2{font-size:20px;font-weight:800;color:#fff;margin-bottom:6px;}
.big-concept p{font-size:13px;color:var(--muted);line-height:1.6;}

@media(max-width:768px){
  body{overflow:auto;}
  #deck{height:auto;min-height:100vh;}
  #slides-wrap{height:auto;min-height:50vh;}
  .slide{position:relative;inset:auto;display:none;padding:12px 14px 10px;overflow-y:auto;}
  .slide.active{display:flex;}

  /* ── Force ALL inline CSS grids to single column ── */
  div[style*="grid-template-columns"]{grid-template-columns:1fr !important;}
  div[style*="display:grid"]{grid-template-columns:1fr !important;}

  /* ── Stack all named grid layouts ── */
  .cards-2,.cards-3,.cards-4,.two-col,.roadmap,.recap-grid{grid-template-columns:1fr !important;}

  /* ── Code blocks — readable, scrollable ── */
  pre{font-size:11.5px !important;line-height:1.65 !important;overflow-x:auto;white-space:pre;}
  .code-wrap{max-height:320px;overflow:auto !important;}
  .code-header{font-size:10px;}

  /* ── Context strip & breakdown — wrap cleanly ── */
  div[style*="color:#4facfe"]{flex-direction:column !important;gap:5px !important;}
  div[style*="🔍 What this block"]{font-size:10.5px !important;}
  div[style*="color:#d2a8ff"]{font-size:10px !important;}

  /* ── Slide text ── */
  .slide-heading{font-size:17px !important;margin-bottom:8px;}
  .section-tag{font-size:9px;}
  .card h3{font-size:12px;}
  .card p,.card-p,.card{font-size:11px;}
  .highlight,.tip,.warn{font-size:11px;padding:8px 10px;}
  .step-body h4{font-size:12px;}
  .step-body p{font-size:11px;}
  table{font-size:10px;}
  th,td{padding:4px 6px;}

  /* ── SVGs — cap height so they don't eat the screen ── */
  svg{max-height:220px !important;width:100% !important;}

  /* ── Navigation ── */
  #topbar{padding:8px 10px;gap:6px;}
  #session-label{display:none;}
  #slide-title-bar{font-size:10px;}
  #nav{padding:8px 10px;gap:8px;}
  .nav-btn{padding:8px 18px;font-size:14px;}
  #dots{max-width:100%;flex-wrap:wrap;}
  .dot{width:5px;height:5px;}

  /* ── Remove flex constraints that cause clipping ── */
  .code-wrap{min-height:unset !important;flex:unset !important;}
  pre{flex:unset !important;}

  /* ── Inline style overrides for padding/margin ── */
  div[style*="padding:32px"]{padding:12px 14px !important;}
  div[style*="padding:20px 44px"]{padding:10px 12px !important;}
  div[style*="padding:16px 44px"]{padding:10px 12px !important;}
  div[style*="padding:14px 40px"]{padding:10px 12px !important;}
}
.code-wrap pre{flex:1;overflow:auto;min-height:160px;} .code-wrap>div:last-child{overflow-y:auto;max-height:220px;} .code-wrap *,.code-wrap,.code-wrap{user-select:text !important;-webkit-user-select:text !important;}
</style></head><body>
<div id="deck">
<div id="topbar"><div id="session-label">Session 06 · codencode Academy</div><div id="slide-title-bar"></div><div id="topbar-right"><span id="counter"></span><button class="btn" onclick="toggleFS()">⛶ Fullscreen</button></div></div>
<div id="progress-wrap"><div id="progress-bar"></div></div>
<div id="slides-wrap"></div>
<div id="nav"><button class="nav-btn" id="prev-btn" onclick="go(-1)">← Prev</button><div id="dots"></div><button class="nav-btn" id="next-btn" onclick="go(1)">Next →</button></div>
</div><script>
const SLIDES_DATA = [{"label": "Title", "html": "<div class=\"slide-title\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;\"><div class=\"session-badge\">Session 06 of 15</div><div style=\"font-size:48px;margin-bottom:12px;\">🌐</div><h1>APIs &amp; Real Data</h1><p class=\"sub\">Pull live data from any web service — stocks, weather, nutrition, crypto, government datasets — straight into Python</p><div style=\"display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap;\"><span class=\"tag tag-blue\">REST APIs</span><span class=\"tag tag-green\">JSON</span><span class=\"tag tag-orange\">requests</span><span class=\"tag tag-blue\">yfinance</span><span class=\"tag tag-green\">Kaggle</span></div><div class=\"academy-tag\" style=\"margin-top:20px;\">codencode Academy · Python + Data Science</div></div>"}, {"label": "Today's Roadmap", "html": "<div class=\"section-tag\">Roadmap</div><div class=\"slide-heading\">What We'll Cover Today 🗺️</div><div class=\"roadmap\"><div class=\"roadmap-item\"><div class=\"rm-num\">01</div><div class=\"rm-icon\">🌐</div><div class=\"rm-text\"><h4>What is an API?</h4><p>HTTP request-response cycle, JSON format, status codes</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">02</div><div class=\"rm-icon\">📦</div><div class=\"rm-text\"><h4>JSON Deep Dive</h4><p>Parse nested JSON, convert to DataFrame, safe key access</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">03</div><div class=\"rm-icon\">🔌</div><div class=\"rm-text\"><h4>requests Library</h4><p>GET requests, params, headers, error handling, timeouts</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">04</div><div class=\"rm-icon\">📈</div><div class=\"rm-text\"><h4>yfinance — Stock Data</h4><p>Pull stock history, returns, and comparisons with one line</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">05</div><div class=\"rm-icon\">🔑</div><div class=\"rm-text\"><h4>API Keys &amp; Security</h4><p>Store secrets safely using .env — never hardcode keys</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">06</div><div class=\"rm-icon\">💻</div><div class=\"rm-text\"><h4>Code Labs</h4><p>Nutrition API + FAANG stock comparison project</p></div></div></div>"}, {"label": "What is an API?", "html": "<div class=\"section-tag\">Fundamentals</div><div class=\"slide-heading\">What is an API? 🌐</div><div class=\"big-concept\"><div class=\"bc-emoji\">🌐</div><h2>API = Application Programming Interface — a contract for data exchange</h2><p>Your Python code sends a structured request to a server. The server returns structured data (JSON). You turn it into a DataFrame and analyse it. No web scraping, no browser.</p></div><div class=\"steps\"><div class=\"step\"><div class=\"step-num\">1</div><div class=\"step-body\"><h4>Client sends HTTP GET Request</h4><p>Your code requests <code>api.open-meteo.com/v1/forecast?latitude=1.29&amp;longitude=103.85</code></p></div></div><div class=\"step\"><div class=\"step-num\">2</div><div class=\"step-body\"><h4>Server processes and responds</h4><p>Server validates API key (if required), queries database, formats response</p></div></div><div class=\"step\"><div class=\"step-num\">3</div><div class=\"step-body\"><h4>You receive JSON data</h4><p>Nested dictionary/list structure — map it to a DataFrame for analysis</p></div></div></div><div class=\"cards cards-3\" style=\"margin-top:8px;\"><div class=\"card card-accent\"><h3>Status Codes</h3><p>200=OK ✅ · 400=Bad request · 401=Unauthorised (bad key) · 404=Not found · 429=Rate limited · 500=Server error</p></div><div class=\"card card-accent\"><h3>GET vs POST</h3><p>GET = read data (most data science APIs). POST = send data. For data science: almost always GET.</p></div><div class=\"card card-accent\"><h3>Rate Limits</h3><p>Free APIs cap requests per minute/day. Add <code>time.sleep(0.5)</code> between calls when looping over many items.</p></div></div>"}, {"label": "API Call Flow", "html": "<div class=\"section-tag\">How It Works</div><div class=\"slide-heading\">API Calling — Step by Step 🔄</div><svg viewBox=\"0 0 560 240\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:6px auto;\">\n  <rect width=\"560\" height=\"240\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"280\" y=\"22\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" font-family=\"monospace\">How an API Call Works</text>\n  <!-- Step boxes -->\n  <!-- 1: Your Code -->\n  <rect x=\"12\" y=\"90\" width=\"90\" height=\"60\" fill=\"rgba(79,172,254,0.15)\" stroke=\"#4facfe\" stroke-width=\"1.5\" rx=\"8\"/>\n  <text x=\"57\" y=\"116\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">Your Code</text>\n  <text x=\"57\" y=\"130\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"9\" font-family=\"monospace\">(Python)</text>\n  <text x=\"57\" y=\"143\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.6)\" font-size=\"9\" font-family=\"monospace\">requests.get()</text>\n  <!-- Arrow 1 -->\n  <line x1=\"103\" y1=\"120\" x2=\"135\" y2=\"120\" stroke=\"#ccc\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n  <!-- 2: HTTP Request box -->\n  <rect x=\"136\" y=\"80\" width=\"88\" height=\"80\" fill=\"rgba(255,209,102,0.12)\" stroke=\"#FFD166\" stroke-width=\"1.5\" rx=\"8\"/>\n  <text x=\"180\" y=\"106\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">HTTP</text>\n  <text x=\"180\" y=\"119\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Request</text>\n  <text x=\"180\" y=\"134\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.7)\" font-size=\"8.5\" font-family=\"monospace\">GET /data</text>\n  <text x=\"180\" y=\"147\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.7)\" font-size=\"8.5\" font-family=\"monospace\">?symbol=AAPL</text>\n  <!-- Arrow 2 -->\n  <line x1=\"225\" y1=\"120\" x2=\"257\" y2=\"120\" stroke=\"#ccc\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n  <!-- 3: API Server -->\n  <rect x=\"258\" y=\"80\" width=\"88\" height=\"80\" fill=\"rgba(139,92,246,0.15)\" stroke=\"#8B5CF6\" stroke-width=\"1.5\" rx=\"8\"/>\n  <text x=\"302\" y=\"106\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">API Server</text>\n  <text x=\"302\" y=\"120\" text-anchor=\"middle\" fill=\"rgba(196,181,253,0.7)\" font-size=\"8.5\" font-family=\"monospace\">validates key</text>\n  <text x=\"302\" y=\"133\" text-anchor=\"middle\" fill=\"rgba(196,181,253,0.7)\" font-size=\"8.5\" font-family=\"monospace\">queries DB</text>\n  <text x=\"302\" y=\"146\" text-anchor=\"middle\" fill=\"rgba(196,181,253,0.7)\" font-size=\"8.5\" font-family=\"monospace\">builds response</text>\n  <!-- Arrow 3 -->\n  <line x1=\"347\" y1=\"120\" x2=\"379\" y2=\"120\" stroke=\"#ccc\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n  <!-- 4: JSON Response -->\n  <rect x=\"380\" y=\"80\" width=\"88\" height=\"80\" fill=\"rgba(67,233,123,0.12)\" stroke=\"#43e97b\" stroke-width=\"1.5\" rx=\"8\"/>\n  <text x=\"424\" y=\"106\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">JSON</text>\n  <text x=\"424\" y=\"119\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Response</text>\n  <text x=\"424\" y=\"134\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.7)\" font-size=\"8.5\" font-family=\"monospace\">{\"price\":182.5</text>\n  <text x=\"424\" y=\"147\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.7)\" font-size=\"8.5\" font-family=\"monospace\"> \"symbol\":\"AAPL\"}</text>\n  <!-- Arrow 4 -->\n  <line x1=\"469\" y1=\"120\" x2=\"501\" y2=\"120\" stroke=\"#ccc\" stroke-width=\"1.5\" marker-end=\"url(#arr)\"/>\n  <!-- 5: Your Data -->\n  <rect x=\"502\" y=\"90\" width=\"48\" height=\"60\" fill=\"rgba(79,172,254,0.15)\" stroke=\"#4facfe\" stroke-width=\"1.5\" rx=\"8\"/>\n  <text x=\"526\" y=\"118\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Your</text>\n  <text x=\"526\" y=\"131\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Data</text>\n  <text x=\"526\" y=\"144\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.6)\" font-size=\"8\" font-family=\"monospace\">dict</text>\n  <!-- Step labels below -->\n  <text x=\"57\"  y=\"175\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">① Write code</text>\n  <text x=\"180\" y=\"175\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">② Send over</text>\n  <text x=\"180\" y=\"185\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">the internet</text>\n  <text x=\"302\" y=\"175\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">③ Server</text>\n  <text x=\"302\" y=\"185\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">processes</text>\n  <text x=\"424\" y=\"175\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">④ Returns</text>\n  <text x=\"424\" y=\"185\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">JSON data</text>\n  <text x=\"526\" y=\"175\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.4)\" font-size=\"9\" font-family=\"monospace\">⑤ Use it!</text>\n  <!-- Status codes -->\n  <text x=\"280\" y=\"215\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"10\" font-family=\"monospace\">HTTP Status:  200 = OK  ✅    401 = No API key  ❌    404 = Not found  ❌    429 = Too many requests  ⚠️</text>\n  <!-- Arrow marker -->\n  <defs><marker id=\"arr\" markerWidth=\"8\" markerHeight=\"6\" refX=\"8\" refY=\"3\" orient=\"auto\"><polygon points=\"0 0,8 3,0 6\" fill=\"#ccc\"/></marker></defs>\n</svg><div class=\"cards cards-3\" style=\"margin-top:8px;\"><div class=\"card card-accent\"><h3>GET request</h3><p>Read data from the server. Most common. No body needed — just URL + params. <code>requests.get(url, params={\"symbol\":\"AAPL\"})</code></p></div><div class=\"card card-accent\"><h3>POST request</h3><p>Send data to the server (login, submit form). Has a request body. <code>requests.post(url, json={\"key\":\"val\"})</code></p></div><div class=\"card card-accent\"><h3>Response object</h3><p><code>.status_code</code> = 200 means success. <code>.json()</code> = parse response as dict. <code>.text</code> = raw string.</p></div></div>"}, {"label": "JSON — Visual Guide", "html": "<div class=\"section-tag\">Data Format</div><div class=\"slide-heading\">JSON — Every Data Type Explained 📦</div><svg viewBox=\"0 0 560 280\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:6px auto;\">\n  <rect width=\"560\" height=\"280\" fill=\"rgba(0,0,0,0.5)\" rx=\"10\"/>\n  <text x=\"280\" y=\"22\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" font-family=\"monospace\">JSON Structure — Every Type Explained</text>\n  <!-- Left: formatted JSON -->\n  <rect x=\"12\" y=\"32\" width=\"270\" height=\"235\" fill=\"rgba(255,255,255,0.03)\" stroke=\"rgba(255,255,255,0.1)\" rx=\"8\"/>\n  <text x=\"22\" y=\"54\" fill=\"rgba(255,255,255,0.5)\" font-size=\"11\" font-family=\"monospace\">{</text>\n  <text x=\"32\" y=\"72\" fill=\"#FFD166\" font-size=\"11\" font-family=\"monospace\">\"symbol\"</text><text x=\"107\" y=\"72\" fill=\"#ccc\" font-size=\"11\" font-family=\"monospace\">:</text><text x=\"115\" y=\"72\" fill=\"#98C379\" font-size=\"11\" font-family=\"monospace\">\"AAPL\"</text><text x=\"168\" y=\"72\" fill=\"rgba(255,255,255,0.3)\" font-size=\"10\" font-family=\"monospace\">← string</text>\n  <text x=\"32\" y=\"90\" fill=\"#FFD166\" font-size=\"11\" font-family=\"monospace\">\"price\"</text><text x=\"99\" y=\"90\" fill=\"#ccc\" font-size=\"11\" font-family=\"monospace\">:</text><text x=\"107\" y=\"90\" fill=\"#D19A66\" font-size=\"11\" font-family=\"monospace\">182.50</text><text x=\"162\" y=\"90\" fill=\"rgba(255,255,255,0.3)\" font-size=\"10\" font-family=\"monospace\">← number</text>\n  <text x=\"32\" y=\"108\" fill=\"#FFD166\" font-size=\"11\" font-family=\"monospace\">\"volume\"</text><text x=\"107\" y=\"108\" fill=\"#ccc\" font-size=\"11\" font-family=\"monospace\">:</text><text x=\"115\" y=\"108\" fill=\"#D19A66\" font-size=\"11\" font-family=\"monospace\">54230000</text><text x=\"192\" y=\"108\" fill=\"rgba(255,255,255,0.3)\" font-size=\"10\" font-family=\"monospace\">← int</text>\n  <text x=\"32\" y=\"126\" fill=\"#FFD166\" font-size=\"11\" font-family=\"monospace\">\"market_open\"</text><text x=\"131\" y=\"126\" fill=\"#ccc\" font-size=\"11\" font-family=\"monospace\">:</text><text x=\"139\" y=\"126\" fill=\"#56B6C2\" font-size=\"11\" font-family=\"monospace\">true</text><text x=\"180\" y=\"126\" fill=\"rgba(255,255,255,0.3)\" font-size=\"10\" font-family=\"monospace\">← boolean</text>\n  <text x=\"32\" y=\"144\" fill=\"#FFD166\" font-size=\"11\" font-family=\"monospace\">\"error\"</text><text x=\"91\" y=\"144\" fill=\"#ccc\" font-size=\"11\" font-family=\"monospace\">:</text><text x=\"99\" y=\"144\" fill=\"#E06C75\" font-size=\"11\" font-family=\"monospace\">null</text><text x=\"135\" y=\"144\" fill=\"rgba(255,255,255,0.3)\" font-size=\"10\" font-family=\"monospace\">← null (nothing)</text>\n  <text x=\"32\" y=\"162\" fill=\"#FFD166\" font-size=\"11\" font-family=\"monospace\">\"history\"</text><text x=\"107\" y=\"162\" fill=\"#ccc\" font-size=\"11\" font-family=\"monospace\">: [</text><text x=\"130\" y=\"162\" fill=\"rgba(255,255,255,0.3)\" font-size=\"10\" font-family=\"monospace\">← array [...]</text>\n  <text x=\"48\" y=\"180\" fill=\"#D19A66\" font-size=\"11\" font-family=\"monospace\">181.2</text><text x=\"91\" y=\"180\" fill=\"#ccc\" font-size=\"11\" font-family=\"monospace\">,</text>\n  <text x=\"48\" y=\"196\" fill=\"#D19A66\" font-size=\"11\" font-family=\"monospace\">179.8</text><text x=\"91\" y=\"196\" fill=\"#ccc\" font-size=\"11\" font-family=\"monospace\">,</text>\n  <text x=\"48\" y=\"212\" fill=\"#D19A66\" font-size=\"11\" font-family=\"monospace\">182.5</text>\n  <text x=\"32\" y=\"228\" fill=\"rgba(255,255,255,0.5)\" font-size=\"11\" font-family=\"monospace\">]</text><text x=\"48\" y=\"228\" fill=\"rgba(255,255,255,0.3)\" font-size=\"10\" font-family=\"monospace\">← 3 prices in array</text>\n  <text x=\"22\" y=\"256\" fill=\"rgba(255,255,255,0.5)\" font-size=\"11\" font-family=\"monospace\">}</text>\n  <!-- Right: type legend -->\n  <rect x=\"292\" y=\"32\" width=\"256\" height=\"235\" fill=\"rgba(255,255,255,0.03)\" stroke=\"rgba(255,255,255,0.1)\" rx=\"8\"/>\n  <text x=\"420\" y=\"52\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.7)\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">How to read in Python</text>\n  <!-- string -->\n  <rect x=\"302\" y=\"60\" width=\"236\" height=\"32\" fill=\"rgba(152,195,121,0.1)\" stroke=\"rgba(152,195,121,0.25)\" rx=\"5\"/>\n  <text x=\"312\" y=\"72\" fill=\"#98C379\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">STRING</text>\n  <text x=\"312\" y=\"84\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">data[\"symbol\"]  →  \"AAPL\"  (str)</text>\n  <!-- number -->\n  <rect x=\"302\" y=\"97\" width=\"236\" height=\"32\" fill=\"rgba(209,154,102,0.1)\" stroke=\"rgba(209,154,102,0.25)\" rx=\"5\"/>\n  <text x=\"312\" y=\"109\" fill=\"#D19A66\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">NUMBER</text>\n  <text x=\"312\" y=\"121\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">data[\"price\"]  →  182.5  (float)</text>\n  <!-- boolean -->\n  <rect x=\"302\" y=\"134\" width=\"236\" height=\"32\" fill=\"rgba(86,182,194,0.1)\" stroke=\"rgba(86,182,194,0.25)\" rx=\"5\"/>\n  <text x=\"312\" y=\"146\" fill=\"#56B6C2\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">BOOLEAN</text>\n  <text x=\"312\" y=\"158\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">data[\"market_open\"]  →  True  (bool)</text>\n  <!-- null -->\n  <rect x=\"302\" y=\"171\" width=\"236\" height=\"32\" fill=\"rgba(224,108,117,0.1)\" stroke=\"rgba(224,108,117,0.25)\" rx=\"5\"/>\n  <text x=\"312\" y=\"183\" fill=\"#E06C75\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">NULL</text>\n  <text x=\"312\" y=\"195\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">data[\"error\"]  →  None  (NoneType)</text>\n  <!-- array -->\n  <rect x=\"302\" y=\"208\" width=\"236\" height=\"48\" fill=\"rgba(197,120,221,0.1)\" stroke=\"rgba(197,120,221,0.25)\" rx=\"5\"/>\n  <text x=\"312\" y=\"220\" fill=\"#C678DD\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">ARRAY</text>\n  <text x=\"312\" y=\"232\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">data[\"history\"]  →  [181.2, 179.8, 182.5]</text>\n  <text x=\"312\" y=\"248\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">data[\"history\"][0]  →  181.2</text>\n</svg><div class=\"code-wrap\" style=\"margin-top:8px;\"><div class=\"code-header\"><span>parse_json.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">consuming any REST API — all modern APIs return JSON</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">Python dicts and JSON are almost identical — easy to navigate</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">print(list(data.keys())) to explore top-level structure first</span></span></div><pre><span class=\"kw\">import</span> requests\n\nresponse = requests.get(<span class=\"st\">\"https://query1.finance.yahoo.com/v8/finance/chart/AAPL\"</span>)\ndata = response.json()                     <span class=\"cm\"># dict</span>\n\n<span class=\"cm\"># Navigate nested JSON with keys and indices</span>\nprice = data[<span class=\"st\">\"chart\"</span>][<span class=\"st\">\"result\"</span>][<span class=\"nm\">0</span>][<span class=\"st\">\"meta\"</span>][<span class=\"st\">\"regularMarketPrice\"</span>]\n<span class=\"fn\">print</span>(<span class=\"st\">f\"AAPL price: ${price}\"</span>)\n\n<span class=\"cm\"># Safely access a key that might not exist</span>\nerr = data.get(<span class=\"st\">\"error\"</span>, <span class=\"kw\">None</span>)             <span class=\"cm\"># returns None instead of crash</span>\n<span class=\"kw\">if</span> err:\n    <span class=\"fn\">print</span>(<span class=\"st\">f\"API error: {err}\"</span>)</pre>\n<div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Fetches AAPL stock data from Yahoo Finance API and navigates the nested JSON response.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">requestsget()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ sends an HTTP GET request to a URL and returns the server's response object</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">json()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ parses the API response body from JSON text into a Python dict/list</span></div></div></div></div><div class=\"tip\">💡 Always use <code>.get(\"key\", default)</code> instead of <code>[\"key\"]</code> when navigating JSON from external APIs — keys may be missing if the API returns an error.</div>"}, {"label": "JSON Deep Dive", "html": "<div class=\"section-tag\">Data Format</div><div class=\"slide-heading\">JSON — Parsing Nested Data 📦</div><div class=\"code-wrap\"><div class=\"code-header\"><span>json_parsing.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">parsing nested or complex API responses</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">real APIs have deeply nested data — learn to navigate it</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">json.dumps(data, indent=2) — pretty-print any JSON for inspection</span></span></div><pre><span class=\"kw\">import</span> json\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\n<span class=\"cm\"># JSON string → Python dict  (json.loads = load string)</span>\nraw = <span class=\"st\">'{\"status\":\"ok\",\"data\":{\"temp\":28,\"city\":\"Singapore\"}}'</span>\ndata = json.loads(raw)\n<span class=\"fn\">print</span>(data[<span class=\"st\">\"status\"</span>])             <span class=\"cm\"># \"ok\"</span>\n<span class=\"fn\">print</span>(data[<span class=\"st\">\"data\"</span>][<span class=\"st\">\"temp\"</span>])    <span class=\"cm\"># 28</span>\n\n<span class=\"cm\"># List of dicts → DataFrame (most common API shape)</span>\nresponse = {\n    <span class=\"st\">\"items\"</span>: [\n        {<span class=\"st\">\"name\"</span>: <span class=\"st\">\"Big Mac\"</span>, <span class=\"st\">\"calories\"</span>: <span class=\"nm\">563</span>},\n        {<span class=\"st\">\"name\"</span>: <span class=\"st\">\"McFlurry\"</span>, <span class=\"st\">\"calories\"</span>: <span class=\"nm\">340</span>},\n    ]\n}\ndf = pd.DataFrame(response[<span class=\"st\">\"items\"</span>])\n\n<span class=\"cm\"># Deeply nested: flatten with json_normalize</span>\nfrom pandas <span class=\"kw\">import</span> json_normalize\nflat_df = json_normalize(response, record_path=<span class=\"st\">\"items\"</span>)\n\n<span class=\"cm\"># Safe access — .get() with default avoids KeyError</span>\ncity = data.get(<span class=\"st\">\"data\"</span>, {}).get(<span class=\"st\">\"city\"</span>, <span class=\"st\">\"Unknown\"</span>)\n\n<span class=\"cm\"># Save / load JSON files</span>\nwith <span class=\"fn\">open</span>(<span class=\"st\">\"data.json\"</span>, <span class=\"st\">\"w\"</span>) <span class=\"kw\">as</span> f:\n    json.dump(response, f, indent=<span class=\"nm\">2</span>)\nwith <span class=\"fn\">open</span>(<span class=\"st\">\"data.json\"</span>) <span class=\"kw\">as</span> f:\n    loaded = json.load(f)</pre>\n<div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Fetches AAPL stock data from Yahoo Finance API and navigates the nested JSON response.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">jsonloads()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ parses a JSON string into a Python dict/list — loads = \"load from string\"</span></div></div></div></div><div class=\"tip\">💡 <strong>Always use .get() with a default</strong> when parsing API responses — APIs omit keys for missing data and direct dict access raises KeyError.</div>"}, {"label": "requests Library", "html": "<div class=\"section-tag\">Core Tool</div><div class=\"slide-heading\">requests — Make HTTP Calls in Python 🔌</div><div class=\"code-wrap\"><div class=\"code-header\"><span>requests_demo.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">fetching data from any web API — weather, stocks, government data</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">simplest HTTP library in Python; add params as a dict not URL string</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">change latitude/longitude to 3.1390/101.6869 for Kuala Lumpur</span></span></div><pre><span class=\"kw\">import</span> requests\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\n<span class=\"cm\"># ── Basic GET request ─────────────────────────────────────</span>\nurl = <span class=\"st\">\"https://api.open-meteo.com/v1/forecast\"</span>\nparams = {\n    <span class=\"st\">\"latitude\"</span>: <span class=\"nm\">1.29</span>, <span class=\"st\">\"longitude\"</span>: <span class=\"nm\">103.85</span>,  <span class=\"cm\"># Singapore</span>\n    <span class=\"st\">\"hourly\"</span>: <span class=\"st\">\"temperature_2m\"</span>,\n    <span class=\"st\">\"forecast_days\"</span>: <span class=\"nm\">3</span>\n}\nresponse = requests.get(url, params=params, timeout=<span class=\"nm\">10</span>)\n\n<span class=\"cm\"># ── Always check status ───────────────────────────────────</span>\n<span class=\"kw\">if</span> response.status_code == <span class=\"nm\">200</span>:\n    data = response.json()\n    df = pd.DataFrame(data[<span class=\"st\">\"hourly\"</span>])\n    <span class=\"fn\">print</span>(df.head())\n<span class=\"kw\">else</span>:\n    <span class=\"fn\">print</span>(<span class=\"st\">f\"Error {response.status_code}: {response.text}\"</span>)\n\n<span class=\"cm\"># ── With API key in header ────────────────────────────────</span>\nheaders = {<span class=\"st\">\"X-API-Key\"</span>: <span class=\"st\">\"your_key_here\"</span>}\nresponse = requests.get(url, headers=headers, timeout=<span class=\"nm\">10</span>)\n\n<span class=\"cm\"># ── Error handling (best practice) ───────────────────────</span>\n<span class=\"kw\">try</span>:\n    response = requests.get(url, timeout=<span class=\"nm\">10</span>)\n    response.raise_for_status()   <span class=\"cm\"># raises on 4xx / 5xx</span>\n    data = response.json()\n<span class=\"kw\">except</span> requests.exceptions.Timeout:\n    <span class=\"fn\">print</span>(<span class=\"st\">\"Request timed out\"</span>)\n<span class=\"kw\">except</span> requests.exceptions.HTTPError <span class=\"kw\">as</span> e:\n    <span class=\"fn\">print</span>(<span class=\"st\">f\"HTTP error: {e}\"</span>)</pre>\n<div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Fetches real-time weather data from Open-Meteo API using query parameters.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">requestsget()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ sends an HTTP GET request to a URL and returns the server's response object</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">json()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ parses the API response body from JSON text into a Python dict/list</span></div></div></div></div><div class=\"tip\">💡 <strong>Always pass <code>timeout=10</code></strong> — without it your code hangs forever if the server is down.</div>"}, {"label": "yfinance — Stock Data", "html": "<div class=\"section-tag\">Data Source</div><div class=\"slide-heading\">yfinance — Stock Data in One Line 📈</div><div class=\"code-wrap\"><div class=\"code-header\"><span>yfinance_demo.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">free stock, ETF, or crypto price data — no API key needed</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">reliable, fast, and returns pandas DataFrames directly</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">change 'AAPL' to 'TSLA', 'NVDA', or '0700.HK' for Tencent</span></span></div><pre><span class=\"kw\">import</span> yfinance <span class=\"kw\">as</span> yf\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\n<span class=\"cm\"># ── Single ticker ─────────────────────────────────────────</span>\nticker = yf.Ticker(<span class=\"st\">\"AAPL\"</span>)\ndf = ticker.history(period=<span class=\"st\">\"1y\"</span>)   <span class=\"cm\"># 1d, 5d, 1mo, 3mo, 1y, 2y, 5y</span>\n<span class=\"fn\">print</span>(df.columns)    <span class=\"cm\"># Open, High, Low, Close, Volume, Dividends</span>\n\n<span class=\"cm\"># ── Multiple tickers at once ──────────────────────────────</span>\ntickers = [<span class=\"st\">\"AAPL\"</span>, <span class=\"st\">\"GOOGL\"</span>, <span class=\"st\">\"MSFT\"</span>, <span class=\"st\">\"META\"</span>]\ndata = yf.download(tickers, period=<span class=\"st\">\"6mo\"</span>)[<span class=\"st\">\"Close\"</span>]\n\n<span class=\"cm\"># ── Normalise to 100 for fair comparison ──────────────────</span>\nnorm = (data / data.iloc[<span class=\"nm\">0</span>]) * <span class=\"nm\">100</span>\n\nfig, ax = plt.subplots(figsize=(<span class=\"nm\">12</span>,<span class=\"nm\">5</span>))\nnorm.plot(ax=ax, linewidth=<span class=\"nm\">2</span>)\nax.set_title(<span class=\"st\">\"FAANG Performance (Normalised to 100)\"</span>)\nax.set_ylabel(<span class=\"st\">\"Indexed Price\"</span>)\nax.axhline(<span class=\"nm\">100</span>, color=<span class=\"st\">\"white\"</span>, linestyle=<span class=\"st\">\"--\"</span>, alpha=<span class=\"nm\">0.5</span>)\nax.grid(<span class=\"kw\">True</span>, alpha=<span class=\"nm\">0.3</span>)\nplt.tight_layout(); plt.show()\n\n<span class=\"cm\"># ── Company metadata ──────────────────────────────────────</span>\ninfo = ticker.info\n<span class=\"fn\">print</span>(info.get(<span class=\"st\">\"marketCap\"</span>), info.get(<span class=\"st\">\"sector\"</span>))</pre>\n<div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Downloads AAPL historical OHLCV prices and plots the closing price trend.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">yfdownload()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ downloads OHLCV stock price data from Yahoo Finance — returns a pandas DataFrame directly</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">yfTicker()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ creates a Ticker object for one stock — access .history(), .info(), .dividends, etc.</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">pltsubplots()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ creates a figure with multiple subplot panels — returns (fig, axes) tuple</span></div></div></div></div><div class=\"tip\">💡 Normalising to 100 lets you fairly compare stocks with very different price levels — you see % gain/loss from the start date, not raw price.</div>"}, {"label": "API Keys Best Practices", "html": "<div class=\"section-tag\">Security</div><div class=\"slide-heading\">API Keys — Store Safely, Never Hardcode 🔑</div><div class=\"warn\">⚠️ <strong>NEVER do this:</strong> <code>API_KEY = \"sk-abc123def456\"</code> in your Python file. Push to GitHub and bots harvest it within minutes.</div><div class=\"code-wrap\"><div class=\"code-header\"><span>safe_keys.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">any API that requires authentication — OpenAI, Alpha Vantage, Stripe</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">hardcoding keys in code = security risk; .env file = safe</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">print(os.environ.get('MY_KEY', 'not set')) to test your .env</span></span></div><pre><span class=\"cm\"># ── Method 1: .env file (recommended) ────────────────────</span>\n<span class=\"cm\"># 1. pip install python-dotenv</span>\n<span class=\"cm\"># 2. Create .env file (add to .gitignore FIRST!)</span>\n<span class=\"cm\">#    OPENAI_KEY=sk-abc123</span>\n<span class=\"cm\">#    ALPHA_VANTAGE_KEY=XYZ789</span>\n<span class=\"cm\"># 3. Load in Python:</span>\nfrom dotenv <span class=\"kw\">import</span> load_dotenv\n<span class=\"kw\">import</span> os\nload_dotenv()\napi_key = os.getenv(<span class=\"st\">\"OPENAI_KEY\"</span>)\n\n<span class=\"cm\"># ── Method 2: Environment variable (terminal) ─────────────</span>\n<span class=\"cm\"># In terminal: export OPENAI_KEY=\"sk-abc123\"</span>\napi_key = os.environ.get(<span class=\"st\">\"OPENAI_KEY\"</span>)\n\n<span class=\"cm\"># ── Method 3: Google Colab Secrets ───────────────────────</span>\n<span class=\"cm\"># Left panel → 🔑 Secrets → Add key → name your key</span>\nfrom google.colab <span class=\"kw\">import</span> userdata\napi_key = userdata.get(<span class=\"st\">\"OPENAI_KEY\"</span>)\n\n<span class=\"cm\"># ── Use the key in request header ─────────────────────────</span>\nheaders = {<span class=\"st\">\"Authorization\"</span>: <span class=\"st\">f\"Bearer {api_key}\"</span>}\nresponse = requests.get(url, headers=headers)</pre>\n<div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Stores API keys in a .env file and reads them securely with os.environ — never hardcode keys.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">requestsget()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ sends an HTTP GET request to a URL and returns the server's response object</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">osenviron()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ reads environment variables set in your shell or .env file — safe way to load API keys</span></div></div></div></div><div class=\"tip\">💡 <strong>Golden rule:</strong> Add <code>.env</code> to your <code>.gitignore</code> before the very first commit. Once a secret is in git history, you must rotate it — deleting the file doesn't help.</div>"}, {"label": "Where to Get Data", "html": "<div class=\"section-tag\">Data Sources</div><div class=\"slide-heading\">Free Data Sources for Every Project 📚</div><table><tr><th>Source</th><th>What You Get</th><th>How to Access</th></tr><tr><td>yfinance</td><td>Stocks, fundamentals, options</td><td><code>pip install yfinance</code></td></tr><tr><td>data.gov.sg</td><td>Singapore government open data</td><td>Direct CSV or API</td></tr><tr><td>Kaggle</td><td>1000s of competition datasets</td><td><code>kaggle datasets download</code></td></tr><tr><td>Open-Meteo</td><td>Weather forecasts, no API key</td><td><code>requests.get()</code></td></tr><tr><td>REST Countries</td><td>Country info, population, GDP</td><td>No key: <code>restcountries.com/v3</code></td></tr><tr><td>CoinGecko</td><td>Crypto prices and market data</td><td>Free public API</td></tr><tr><td>sklearn datasets</td><td>Classic ML datasets built-in</td><td><code>from sklearn.datasets import load_iris</code></td></tr><tr><td>seaborn datasets</td><td>Practice datasets built-in</td><td><code>sns.load_dataset(\"titanic\")</code></td></tr></table><div class=\"tip\">💡 Start with seaborn built-ins and Kaggle. Once comfortable, pull live API data — that's what impresses employers.</div>"}, {"label": "Code Lab — Stock Comparison", "html": "<div class=\"section-tag\">Hands-On</div><div class=\"slide-heading\">Code Lab — FAANG Stock Analyser 📈</div><div class=\"code-wrap\"><div class=\"code-header\"><span>lab_06_stocks.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">real financial analysis combining API + pandas + visualisation</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">end-to-end workflow: download → analyse → visualise</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">add 'NVDA' or '1155.KL' (Maybank) to the tickers list</span></span></div><pre><span class=\"kw\">import</span> yfinance <span class=\"kw\">as</span> yf\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span class=\"kw\">import</span> seaborn <span class=\"kw\">as</span> sns\n\ntickers = [<span class=\"st\">\"AAPL\"</span>, <span class=\"st\">\"MSFT\"</span>, <span class=\"st\">\"GOOGL\"</span>, <span class=\"st\">\"META\"</span>, <span class=\"st\">\"AMZN\"</span>]\ndf = yf.download(tickers, period=<span class=\"st\">\"1y\"</span>)[<span class=\"st\">\"Close\"</span>]\n\n<span class=\"cm\"># Daily % returns</span>\nreturns = df.pct_change().dropna()\n\n<span class=\"cm\"># Cumulative returns (growth of $1 invested)</span>\ncum = (<span class=\"nm\">1</span> + returns).cumprod()\n\n<span class=\"cm\"># 30-day rolling volatility (annualised std dev)</span>\nvol = returns.rolling(<span class=\"nm\">30</span>).std() * (<span class=\"nm\">252</span> ** <span class=\"nm\">0.5</span>)\n\nfig, axes = plt.subplots(<span class=\"nm\">2</span>, <span class=\"nm\">2</span>, figsize=(<span class=\"nm\">16</span>, <span class=\"nm\">10</span>))\nfig.suptitle(<span class=\"st\">\"FAANG Stock Analysis (1 Year)\"</span>, fontsize=<span class=\"nm\">18</span>)\n\ncum.plot(ax=axes[<span class=\"nm\">0</span>,<span class=\"nm\">0</span>], title=<span class=\"st\">\"Cumulative Return\"</span>)\nvol.plot(ax=axes[<span class=\"nm\">0</span>,<span class=\"nm\">1</span>], title=<span class=\"st\">\"Annualised Volatility\"</span>)\n\ncorr = returns.corr()\nsns.heatmap(corr, annot=<span class=\"kw\">True</span>, ax=axes[<span class=\"nm\">1</span>,<span class=\"nm\">0</span>], cmap=<span class=\"st\">\"coolwarm\"</span>)\naxes[<span class=\"nm\">1</span>,<span class=\"nm\">0</span>].set_title(<span class=\"st\">\"Return Correlation\"</span>)\n\nsns.boxplot(data=returns * <span class=\"nm\">100</span>, ax=axes[<span class=\"nm\">1</span>,<span class=\"nm\">1</span>])\naxes[<span class=\"nm\">1</span>,<span class=\"nm\">1</span>].set_title(<span class=\"st\">\"Daily Return % Distribution\"</span>)\n\n<span class=\"cm\"># Sharpe Ratio (higher = better risk-adjusted return)</span>\nsharpe = (returns.mean() / returns.std()) * (<span class=\"nm\">252</span> ** <span class=\"nm\">0.5</span>)\n<span class=\"fn\">print</span>(<span class=\"st\">\"Sharpe Ratios:\"</span>)\n<span class=\"fn\">print</span>(sharpe.sort_values(ascending=<span class=\"kw\">False</span>))\n\nplt.tight_layout(); plt.show()</pre>\n<div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Downloads 5 major tech stocks, normalises them to 100, and plots relative performance.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">dropna()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ removes any row that contains at least one NaN; use subset=[\"col\"] to only check specific columns</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">corr()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ computes Pearson correlation (-1 to +1) between every pair of numeric columns</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">heatmap()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ draws a colour-coded grid — darker/brighter = stronger value; use for correlation matrices</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">snsboxplot()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ shows median (line), IQR (box), whiskers (range), and outliers (dots) for each group</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">snsheatmap()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ colour-coded matrix chart — essential for visualising correlation tables</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">rolling()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ computes a statistic (mean, std) over a sliding window of n rows — creates moving averages</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">sort_values()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ sorts DataFrame rows by one or more columns — essential before time-series operations</span></div></div></div></div><div class=\"tip\">🚀 <strong>Challenge:</strong> Add the Straits Times Index (STI) <code>\"^STI\"</code> to compare Singapore vs US tech performance.</div>"}, {"label": "FIFA 2026 — The Dataset", "html": "<div class=\"section-tag\">Real World Data — FIFA 2026</div>\n<h2 class=\"slide-heading\">⚽ FIFA World Cup 2026 — 3 Datasets Worth Analysing</h2>\n<div style=\"margin-bottom:10px;\"><svg viewBox='0 0 680 200' xmlns='http://www.w3.org/2000/svg' style='width:100%;max-height:200px;'>\n  <rect width='680' height='200' rx='12' fill='rgba(0,0,0,0.45)'/>\n  <text x='340' y='24' text-anchor='middle' fill='#FFD166' font-size='13' font-weight='bold'>FIFA 2026 — 3 Datasets You Can Download</text>\n  <!-- Matches box -->\n  <rect x='18' y='38' width='200' height='148' rx='10' fill='rgba(79,172,254,0.12)' stroke='#4facfe' stroke-width='1.5'/>\n  <text x='118' y='60' text-anchor='middle' fill='#4facfe' font-size='13' font-weight='bold'>⚽ Matches</text>\n  <text x='28' y='80'  fill='#aaa' font-size='10'>date</text>\n  <text x='28' y='95'  fill='#aaa' font-size='10'>home_team · away_team</text>\n  <text x='28' y='110' fill='#aaa' font-size='10'>home_goals · away_goals</text>\n  <text x='28' y='125' fill='#aaa' font-size='10'>stage (Group / QF / SF / F)</text>\n  <text x='28' y='140' fill='#aaa' font-size='10'>venue · attendance</text>\n  <text x='28' y='155' fill='#aaa' font-size='10'>result (H / D / A)</text>\n  <text x='28' y='170' fill='#aaa' font-size='10'>extra_time · penalties</text>\n  <text x='118' y='185' text-anchor='middle' fill='#4facfe' font-size='9'>~104 rows (64 WC + hosts)</text>\n  <!-- Players box -->\n  <rect x='238' y='38' width='200' height='148' rx='10' fill='rgba(67,233,123,0.1)' stroke='#43e97b' stroke-width='1.5'/>\n  <text x='338' y='60' text-anchor='middle' fill='#43e97b' font-size='13' font-weight='bold'>🧑 Players</text>\n  <text x='248' y='80'  fill='#aaa' font-size='10'>player_name · team</text>\n  <text x='248' y='95'  fill='#aaa' font-size='10'>position (GK/DEF/MID/FWD)</text>\n  <text x='248' y='110' fill='#aaa' font-size='10'>goals · assists · minutes</text>\n  <text x='248' y='125' fill='#aaa' font-size='10'>shots · shots_on_target</text>\n  <text x='248' y='140' fill='#aaa' font-size='10'>passes · pass_accuracy %</text>\n  <text x='248' y='155' fill='#aaa' font-size='10'>yellow_cards · red_cards</text>\n  <text x='248' y='170' fill='#aaa' font-size='10'>age · club · market_value</text>\n  <text x='338' y='185' text-anchor='middle' fill='#43e97b' font-size='9'>~736 rows (32 teams × 23)</text>\n  <!-- Teams box -->\n  <rect x='458' y='38' width='202' height='148' rx='10' fill='rgba(255,209,102,0.1)' stroke='#FFD166' stroke-width='1.5'/>\n  <text x='559' y='60' text-anchor='middle' fill='#FFD166' font-size='13' font-weight='bold'>🏆 Teams</text>\n  <text x='468' y='80'  fill='#aaa' font-size='10'>team · group</text>\n  <text x='468' y='95'  fill='#aaa' font-size='10'>played · won · drawn · lost</text>\n  <text x='468' y='110' fill='#aaa' font-size='10'>goals_for · goals_against</text>\n  <text x='468' y='125' fill='#aaa' font-size='10'>goal_diff · points</text>\n  <text x='468' y='140' fill='#aaa' font-size='10'>stage_reached</text>\n  <text x='468' y='155' fill='#aaa' font-size='10'>avg_possession %</text>\n  <text x='468' y='170' fill='#aaa' font-size='10'>confederation (UEFA/CONM…)</text>\n  <text x='559' y='185' text-anchor='middle' fill='#FFD166' font-size='9'>~32 rows (1 per team)</text>\n</svg></div>\n<div class=\"cards cards-2\" style=\"margin-bottom:10px;\">\n  <div class=\"card card-accent\" style=\"--accent:#4facfe;\">\n    <h3>📥 Where to download</h3>\n    <p><strong>Kaggle:</strong> search \"FIFA World Cup 2026 dataset\" — multiple versions available<br>\n    <strong>football-data.org</strong> — free API with 2026 WC match results<br>\n    <strong>GitHub: jfjelstul/worldcup</strong> — clean structured CSVs<br>\n    <strong>FBref.com</strong> — deep player stats (scrape-friendly)</p>\n  </div>\n  <div class=\"card card-accent\" style=\"--accent:#43e97b;\">\n    <h3>🔬 What you can do with it</h3>\n    <p>Find top scorers and most-assisted players · Compare team attacking vs defensive strength · \n    Predict match outcomes using group stage data · Analyse which confederation dominates · \n    Build a \"Golden Boot\" leaderboard · EDA on possession vs win rate</p>\n  </div>\n</div>\n<div class=\"tip\">💡 <strong>Why FIFA 2026?</strong> 48 teams for the first time (expanded from 32) — 104 matches total. More data, new host pattern (USA/Canada/Mexico), and massive global interest make it a perfect real-world dataset for EDA and ML projects.</div>"}, {"label": "FIFA 2026 — Match & Team Analysis", "html": "<div class=\"section-tag\">Real World Data — FIFA 2026</div>\n<h2 class=\"slide-heading\">📊 Exploring FIFA 2026 Match & Team Data</h2>\n<div class=\"code-wrap\">\n  <div class=\"code-header\"><span>fifa_matches.py</span><span>python</span></div>\n  <div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">analysing tournament match results and team standings</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">groupby + sort gives instant leaderboards from raw match data</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">change 'goals_for' to 'goal_diff' or filter stage == 'Final'</span></span></div>\n  <pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span class=\"kw\">import</span> seaborn <span class=\"kw\">as</span> sns\n\n<span class=\"cm\"># ── Load datasets ────────────────────────────────────────</span>\nmatches = pd.read_csv(<span class=\"st\">\"fifa_2026_matches.csv\"</span>)\nteams   = pd.read_csv(<span class=\"st\">\"fifa_2026_teams.csv\"</span>)\n\n<span class=\"cm\"># ── Quick overview ───────────────────────────────────────</span>\n<span class=\"fn\">print</span>(matches.shape)          <span class=\"cm\"># (104, 12)</span>\n<span class=\"fn\">print</span>(matches.columns.tolist())\n<span class=\"fn\">print</span>(matches.isnull().sum())  <span class=\"cm\"># check for missing values</span>\n\n<span class=\"cm\"># ── Top goal-scoring teams (group stage) ─────────────────</span>\ngroup = matches[matches[<span class=\"st\">\"stage\"</span>] == <span class=\"st\">\"Group\"</span>]\nteam_goals = (\n    group.groupby(<span class=\"st\">\"home_team\"</span>)[<span class=\"st\">\"home_goals\"</span>].sum()\n    .add(group.groupby(<span class=\"st\">\"away_team\"</span>)[<span class=\"st\">\"away_goals\"</span>].sum(), fill_value=<span class=\"nm\">0</span>)\n    .sort_values(ascending=<span class=\"kw\">False</span>)\n    .head(<span class=\"nm\">10</span>)\n    .reset_index()\n)\nteam_goals.columns = [<span class=\"st\">\"team\"</span>, <span class=\"st\">\"goals\"</span>]\n\n<span class=\"cm\"># ── Plot top scorers by team ──────────────────────────────</span>\nfig, axes = plt.subplots(<span class=\"nm\">1</span>, <span class=\"nm\">2</span>, figsize=(<span class=\"nm\">14</span>, <span class=\"nm\">5</span>))\nsns.barplot(data=team_goals, y=<span class=\"st\">\"team\"</span>, x=<span class=\"st\">\"goals\"</span>,\n            palette=<span class=\"st\">\"YlOrRd\"</span>, ax=axes[<span class=\"nm\">0</span>])\naxes[<span class=\"nm\">0</span>].set_title(<span class=\"st\">\"Top 10 — Goals Scored (Group Stage)\"</span>)\n\n<span class=\"cm\"># ── Result distribution: Home / Draw / Away ───────────────</span>\nresult_counts = matches[<span class=\"st\">\"result\"</span>].value_counts()\naxes[<span class=\"nm\">1</span>].pie(result_counts, labels=[<span class=\"st\">\"Home Win\"</span>,<span class=\"st\">\"Away Win\"</span>,<span class=\"st\">\"Draw\"</span>],\n           autopct=<span class=\"st\">\"%1.1f%%\"</span>, colors=[<span class=\"st\">\"#4facfe\"</span>,<span class=\"st\">\"#f5576c\"</span>,<span class=\"st\">\"#FFD166\"</span>])\naxes[<span class=\"nm\">1</span>].set_title(<span class=\"st\">\"Match Result Distribution\"</span>)\nplt.tight_layout(); plt.show()\n\n<span class=\"cm\"># ── Team standings: sort by points then goal diff ─────────</span>\nstandings = teams.sort_values([<span class=\"st\">\"points\"</span>, <span class=\"st\">\"goal_diff\"</span>],\n                               ascending=<span class=\"kw\">False</span>)\n<span class=\"fn\">print</span>(standings[[<span class=\"st\">\"team\"</span>,<span class=\"st\">\"points\"</span>,<span class=\"st\">\"goals_for\"</span>,<span class=\"st\">\"goals_against\"</span>,<span class=\"st\">\"stage_reached\"</span>]].head(<span class=\"nm\">10</span>))</pre>\n  <div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Loads FIFA 2026 match CSV, cleans it, computes team goal totals, plots top-scoring teams and group standings.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">read_csv()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ loads the match CSV file into a pandas DataFrame</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">groupby()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ groups all matches by team name to aggregate stats per team</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">agg()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ computes sum of goals_for and goals_against per team in one call</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">sort_values()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ sorts teams by goals_for descending — top scorers first</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">head()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ returns the top N rows — here the top 10 goal-scoring teams</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">sns.barplot()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ draws horizontal bars for each team's goal count</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">value_counts()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ counts how many matches ended H / D / A — result distribution</span></div></div></div>\n</div>"}, {"label": "FIFA 2026 — Player Stats Analysis", "html": "<div class=\"section-tag\">Real World Data — FIFA 2026</div>\n<h2 class=\"slide-heading\">🧑 FIFA 2026 Player Stats — Golden Boot & Best XI</h2>\n<div class=\"code-wrap\">\n  <div class=\"code-header\"><span>fifa_players.py</span><span>python</span></div>\n  <div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">analysing individual player performance — golden boot, best XI</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">filtering + sorting + scatter reveals patterns invisible in raw tables</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">change 'goals' to 'assists' or filter position == 'MID' for midfielders</span></span></div>\n  <pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n<span class=\"kw\">import</span> seaborn <span class=\"kw\">as</span> sns\n\nplayers = pd.read_csv(<span class=\"st\">\"fifa_2026_players.csv\"</span>)\n<span class=\"fn\">print</span>(players.head())\n<span class=\"fn\">print</span>(players.dtypes)\n\n<span class=\"cm\"># ── Golden Boot: top 10 scorers ───────────────────────────</span>\ntop_scorers = players.nlargest(<span class=\"nm\">10</span>, <span class=\"st\">\"goals\"</span>)[\n    [<span class=\"st\">\"player_name\"</span>, <span class=\"st\">\"team\"</span>, <span class=\"st\">\"goals\"</span>, <span class=\"st\">\"assists\"</span>, <span class=\"st\">\"minutes\"</span>]\n]\n<span class=\"fn\">print</span>(<span class=\"st\">\"🥇 Golden Boot Race:\"</span>)\n<span class=\"fn\">print</span>(top_scorers.to_string(index=<span class=\"kw\">False</span>))\n\n<span class=\"cm\"># ── Top assisters ─────────────────────────────────────────</span>\ntop_assists = players.nlargest(<span class=\"nm\">5</span>, <span class=\"st\">\"assists\"</span>)[[<span class=\"st\">\"player_name\"</span>,<span class=\"st\">\"team\"</span>,<span class=\"st\">\"assists\"</span>]]\n<span class=\"fn\">print</span>(<span class=\"st\">\"\n🎯 Most Assists:\"</span>, top_assists.to_string(index=<span class=\"kw\">False</span>))\n\n<span class=\"cm\"># ── Goals vs Assists scatter — colour by position ─────────</span>\nfig, axes = plt.subplots(<span class=\"nm\">1</span>, <span class=\"nm\">2</span>, figsize=(<span class=\"nm\">14</span>, <span class=\"nm\">5</span>))\n\nsns.scatterplot(data=players, x=<span class=\"st\">\"goals\"</span>, y=<span class=\"st\">\"assists\"</span>,\n                hue=<span class=\"st\">\"position\"</span>, palette=<span class=\"st\">\"Set2\"</span>,\n                size=<span class=\"st\">\"minutes\"</span>, sizes=(<span class=\"nm\">30</span>, <span class=\"nm\">250</span>), ax=axes[<span class=\"nm\">0</span>])\naxes[<span class=\"nm\">0</span>].set_title(<span class=\"st\">\"Goals vs Assists by Position\"</span>)\n<span class=\"cm\"># Label the top scorer on the chart</span>\ntop = players.nlargest(<span class=\"nm\">1</span>, <span class=\"st\">\"goals\"</span>).iloc[<span class=\"nm\">0</span>]\naxes[<span class=\"nm\">0</span>].annotate(top[<span class=\"st\">\"player_name\"</span>],\n                  xy=(top[<span class=\"st\">\"goals\"</span>], top[<span class=\"st\">\"assists\"</span>]),\n                  xytext=(<span class=\"nm\">5</span>, <span class=\"nm\">5</span>), textcoords=<span class=\"st\">\"offset points\"</span>,\n                  color=<span class=\"st\">\"#FFD166\"</span>, fontsize=<span class=\"nm\">9</span>)\n\n<span class=\"cm\"># ── Avg goals per position ────────────────────────────────</span>\npos_goals = players.groupby(<span class=\"st\">\"position\"</span>)[<span class=\"st\">\"goals\"</span>].mean().sort_values(ascending=<span class=\"kw\">False</span>)\npos_goals.plot(kind=<span class=\"st\">\"bar\"</span>, ax=axes[<span class=\"nm\">1</span>], color=[<span class=\"st\">\"#f5576c\"</span>,<span class=\"st\">\"#4facfe\"</span>,<span class=\"st\">\"#43e97b\"</span>,<span class=\"st\">\"#FFD166\"</span>])\naxes[<span class=\"nm\">1</span>].set_title(<span class=\"st\">\"Avg Goals by Position\"</span>); axes[<span class=\"nm\">1</span>].tick_params(rotation=<span class=\"nm\">0</span>)\nplt.tight_layout(); plt.show()</pre>\n  <div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Loads player stats, finds top scorers and assisters, plots goals vs assists scatter coloured by position.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">read_csv()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ loads player CSV — each row is one player's tournament stats</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">nlargest()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ returns N rows with the highest value in a column — faster than sort + head</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">query()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ filters rows using a readable string expression — like SQL WHERE</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">sns.scatterplot()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ plots goals vs assists, coloured by position — reveals all-round contributors</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">annotate()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ adds a text label at a specific (x,y) position — labels key players on chart</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">groupby()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ groups by position to compare FWD vs MID vs DEF goal contributions</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">value_counts()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ counts players per team — checks squad size consistency</span></div></div></div>\n</div>"}, {"label": "FIFA 2026 — Predict Match Outcomes", "html": "<div class=\"section-tag\">Real World Data — FIFA 2026</div>\n<h2 class=\"slide-heading\">🤖 Can We Predict FIFA 2026 Match Outcomes?</h2>\n<div class=\"two-col\" style=\"gap:14px;flex:1;min-height:0;\">\n  <div style=\"display:flex;flex-direction:column;gap:8px;\">\n    <div class=\"card card-accent\" style=\"--accent:#4facfe;\">\n      <h3>🎯 The prediction goal</h3>\n      <p>Given pre-match stats (FIFA ranking, avg goals per game, possession %, home advantage), \n      predict whether the result will be <strong>Home Win / Draw / Away Win</strong>. \n      This is a 3-class classification problem.</p>\n    </div>\n    <div class=\"card card-accent\" style=\"--accent:#43e97b;\">\n      <h3>🔧 Features to engineer</h3>\n      <p><code>ranking_diff</code> = home_ranking − away_ranking<br>\n      <code>goals_per_game_h</code> = team's avg goals in group stage<br>\n      <code>form_last3</code> = points in last 3 matches<br>\n      <code>is_knockout</code> = 1 if QF/SF/Final, else 0<br>\n      <code>confederation_match</code> = 1 if both same confederation</p>\n    </div>\n    <div class=\"warn\">⚠️ <strong>Data leakage risk:</strong> never use in-game stats \n    (possession, shots) as features for pre-match prediction — those aren't known before kickoff!</div>\n  </div>\n  <div class=\"code-wrap\" style=\"flex:1;overflow:auto;min-height:0;\">\n    <div class=\"code-header\"><span>fifa_predict.py</span><span>python</span></div>\n    <div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">using FIFA match data to train a win/draw/loss prediction model</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">structured sports data is perfect for classification — real ML use case</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">change RandomForest to XGBClassifier and compare accuracy scores</span></span></div>\n    <pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">from</span> sklearn.ensemble <span class=\"kw\">import</span> RandomForestClassifier\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> train_test_split\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> classification_report\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\nmatches = pd.read_csv(<span class=\"st\">\"fifa_2026_matches.csv\"</span>)\n\n<span class=\"cm\"># ── Feature engineering ───────────────────────────────────</span>\nmatches[<span class=\"st\">\"ranking_diff\"</span>] = (matches[<span class=\"st\">\"home_ranking\"</span>]\n                            - matches[<span class=\"st\">\"away_ranking\"</span>])\nmatches[<span class=\"st\">\"is_knockout\"</span>]  = (matches[<span class=\"st\">\"stage\"</span>] != <span class=\"st\">\"Group\"</span>).astype(int)\nmatches[<span class=\"st\">\"high_scoring\"</span>] = (\n    (matches[<span class=\"st\">\"home_goals\"</span>] + matches[<span class=\"st\">\"away_goals\"</span>]) > <span class=\"nm\">2</span>\n).astype(int)\n\nfeatures = [<span class=\"st\">\"ranking_diff\"</span>, <span class=\"st\">\"is_knockout\"</s
