</div><script>
const SLIDES_DATA = [{"label": "Title", "html": "<div class=\"slide-title\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;\"><div class=\"session-badge\">Session 11 of 15</div><div style=\"font-size:48px;margin-bottom:12px;\">🏷️</div><h1>Classification:<br>Random Forest &amp; Evaluation</h1><p class=\"sub\">Predict categories — spam/ham, churn/stay, disease/healthy, CAPTCHA/not-CAPTCHA — with Logistic Regression, Decision Trees, Random Forest, and SVM</p><div style=\"display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap;\"><span class=\"tag tag-blue\">Logistic Regression</span><span class=\"tag tag-blue\">Decision Trees</span><span class=\"tag tag-green\">Random Forest</span><span class=\"tag tag-orange\">SVM</span><span class=\"tag tag-blue\">Confusion Matrix</span><span class=\"tag tag-green\">F1 Score</span></div><div class=\"academy-tag\" style=\"margin-top:20px;\">codencode Academy · Python + Data Science</div></div>"}, {"label": "What is Classification?", "html": "<div class=\"section-tag\">Fundamentals</div><div class=\"slide-heading\">What is Classification? 🏷️</div><div class=\"big-concept\"><div class=\"bc-emoji\">🏷️</div><h2>Classification = predict which category a data point belongs to</h2><p>Binary (2 classes): spam/not spam, fraud/legit, pass/fail. Multi-class (3+ classes): cat/dog/bird, disease type, product category.</p><p style=\"margin-top:8px;\">Every classifier you meet today — Decision Tree, Random Forest, SVM — is solving the exact same underlying problem: draw a boundary (straight, jagged, or curved) that separates categories in feature space. The difference is only <em>how</em> each algorithm draws that boundary.</p></div><div class=\"cards cards-4\" style=\"margin-top:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">🎯</div><h3>Binary Examples</h3><p>Email spam detection. Credit card fraud. Customer churn prediction. Medical diagnosis (disease/healthy). Default prediction.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🎨</div><h3>Multi-class Examples</h3><p>Image recognition (cat/dog/car). Sentiment (positive/neutral/negative). Product category assignment. Handwriting digit recognition.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🤖<div style=\"margin-top:8px;text-align:center;\"><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/CAPTCHA.png\" alt=\"Real CAPTCHA example\" style=\"max-width:100%;border-radius:6px;border:1px solid rgba(255,255,255,0.15);\"><div style=\"font-size:9px;color:var(--muted);margin-top:3px;\">Real CAPTCHA example · Wikimedia Commons, CC BY-SA 4.0</div></div></div><h3>Everyday Example: CAPTCHA</h3><p>\"Select all squares with traffic lights\" is literally binary classification per tile (traffic light / not). Distorted-letter CAPTCHAs classify each character. This is why CAPTCHA is a classic teaching example for this whole session.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">📏</div><h3>Key Metrics</h3><p>Accuracy (balanced data). Precision (avoid false positives). Recall (avoid false negatives). F1 (imbalanced data). ROC-AUC (probability ranking).</p></div></div>"}, {"label": "Logistic Regression", "html": "<div class=\"section-tag\">Model 1</div><div class=\"slide-heading\">Logistic Regression — The Probability Baseline 📈</div><div class=\"two-col\" style=\"margin-bottom:8px;\"><div><strong>How it works:</strong> despite the name, this is a <em>classifier</em>. It computes a weighted sum of the features, then squashes that score through the <strong>sigmoid function</strong> into a probability between 0 and 1. Probability ≥ threshold (usually 0.5) → predict class 1.<br><br><strong>Strengths:</strong> Very fast to train. Highly interpretable — each coefficient tells you the direction and strength of a feature's effect. Outputs real, calibrated-ish probabilities, not just a label. The standard first baseline before trying anything fancier.</div><div><strong>Weaknesses:</strong> Assumes a roughly <strong>linear</strong> boundary between classes — struggles with curved or complex relationships (that's exactly where Decision Trees, Random Forest, and SVM take over). Sensitive to unscaled features and outliers. Correlated features make coefficients hard to interpret.<br><br><strong>Key parameters:</strong><br>• <code>C</code> — inverse regularisation strength (smaller C = more regularisation, simpler model)<br>• <code>penalty</code> — \"l2\" (default, shrinks coefficients) or \"l1\" (can zero some out — built-in feature selection)<br>• <code>class_weight=\"balanced\"</code> — for imbalanced classes<br>• <code>solver</code> — \"lbfgs\" (default), \"liblinear\" for small/sparse data</div></div><svg viewBox=\"0 0 500 240\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:500px;display:block;margin:4px auto;\">\n  <rect width=\"500\" height=\"240\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"250\" y=\"18\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">The Sigmoid — Squashing Any Score Into a 0-1 Probability</text>\n  <!-- axes -->\n  <line x1=\"60\" y1=\"200\" x2=\"460\" y2=\"200\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <line x1=\"60\" y1=\"200\" x2=\"60\" y2=\"30\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <text x=\"30\" y=\"35\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9\" font-family=\"monospace\">1.0</text>\n  <text x=\"30\" y=\"118\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9\" font-family=\"monospace\">0.5</text>\n  <text x=\"35\" y=\"203\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9\" font-family=\"monospace\">0.0</text>\n  <text x=\"450\" y=\"215\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9\" font-family=\"monospace\">score</text>\n  <!-- threshold line -->\n  <line x1=\"60\" y1=\"115\" x2=\"460\" y2=\"115\" stroke=\"#FFD166\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <text x=\"380\" y=\"110\" fill=\"#FFD166\" font-size=\"9\" font-family=\"monospace\">decision threshold = 0.5</text>\n  <!-- sigmoid curve -->\n  <path d=\"M 70 195 C 150 195, 200 195, 230 160 S 280 40, 350 35 S 420 30, 450 30\" fill=\"none\" stroke=\"#4facfe\" stroke-width=\"2.5\"/>\n  <circle cx=\"260\" cy=\"115\" r=\"5\" fill=\"#43e97b\"/>\n  <text x=\"260\" y=\"135\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"8.5\" font-family=\"monospace\">crosses 0.5 here</text>\n  <text x=\"130\" y=\"220\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">predict class 0</text>\n  <text x=\"390\" y=\"220\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">predict class 1</text>\n</svg><div class=\"highlight\" style=\"margin-top:6px;\"><strong>Real-world example — bot/CAPTCHA risk scoring:</strong> Google's reCAPTCHA v3 returns a score from 0.0 (likely bot) to 1.0 (likely human) instead of a hard yes/no — conceptually identical to <code>predict_proba()</code> from a logistic regression. The site then picks its own threshold: below it, show a challenge (or a CAPTCHA); above it, let the user through. Same idea as tuning the 0.5 cutoff you just saw above.</div><div class=\"code-wrap\" style=\"margin-top:6px;\"><div class=\"code-header\"><span>logistic_regression.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">first model to try on any classification problem — fast, interpretable baseline</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">coefficients are directly explainable — great for stakeholders who ask \"why\"</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">print logreg[-1].coef_ — which features push the risk score up vs down?</span></span></div><pre><span class=\"kw\">from</span> sklearn.linear_model <span class=\"kw\">import</span> LogisticRegression\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> train_test_split\n<span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler\n<span class=\"kw\">from</span> sklearn.pipeline <span class=\"kw\">import</span> make_pipeline\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> classification_report, RocCurveDisplay\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\n<span class=\"cm\"># 1. Fetch dataset</span>\ndf = pd.read_csv(<span class=\"st\">\"login_attempts.csv\"</span>)\nX = df.drop(columns=[<span class=\"st\">\"is_bot\"</span>])\ny = df[<span class=\"st\">\"is_bot\"</span>]\n\n<span class=\"cm\"># 2. Train/test split</span>\nX_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=<span class=\"nm\">0.2</span>, stratify=y, random_state=<span class=\"nm\">42</span>\n)\n\n<span class=\"cm\"># 3. Train the algorithm — scale first, it's distance-sensitive</span>\nlogreg = make_pipeline(\n    StandardScaler(),\n    LogisticRegression(C=<span class=\"nm\">1.0</span>, class_weight=<span class=\"st\">\"balanced\"</span>, max_iter=<span class=\"nm\">1000</span>, random_state=<span class=\"nm\">42</span>)\n)\nlogreg.fit(X_train, y_train)\n\n<span class=\"cm\"># 4. Visualise — ROC curve across every threshold</span>\nRocCurveDisplay.from_estimator(logreg, X_test, y_test)\nplt.title(<span class=\"st\">\"Bot-detection ROC Curve\"</span>); plt.show()\n\n<span class=\"cm\"># 5. Evaluate</span>\n<span class=\"fn\">print</span>(classification_report(y_test, logreg.predict(X_test)))\nbot_score = logreg.predict_proba(X_test)[:, <span class=\"nm\">1</span>]\n<span class=\"fn\">print</span>(<span class=\"st\">f\"First 5 risk scores: {bot_score[:5].round(3)}\"</span>)</pre><div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Loads a real login-attempt dataset, trains Logistic Regression, plots an ROC curve, then evaluates it and prints risk scores.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">read_csv()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ loads the labelled login-attempt data (features + is_bot) into a DataFrame</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">train_test_split()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ randomly splits X and y into training and test sets; stratify=y keeps the bot ratio equal in both</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">StandardScaler()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ rescales every feature to mean 0, variance 1 — essential before any distance/score-based model</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">fit()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ trains the model — it learns patterns from your X_train and y_train data</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">RocCurveDisplay.from_estimator()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ plots how well the model ranks bots above humans across every possible threshold</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">classification_report()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ prints precision, recall, and F1-score for every class — tells you where the model fails</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">predict_proba()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ returns a 0-1 probability per row instead of just the predicted label — the risk score itself</span></div></div></div></div>"}, {"label": "Decision Trees", "html": "<div class=\"section-tag\">Model 2</div><div class=\"slide-heading\">Decision Trees — If/Else Rules the Model Learns Itself 🌳</div><div class=\"two-col\" style=\"margin-bottom:8px;\"><div><strong>How it works:</strong> At each node the tree asks the Yes/No question that <em>best splits</em> the data (reduces Gini impurity or Entropy). Keeps splitting until leaves are pure or depth limit is hit.<br><br><strong>Strengths:</strong> Interpretable — you can see exactly why a prediction was made. No scaling needed. Handles mixed feature types.</div><div><strong>Weaknesses:</strong> <strong>Overfits badly</strong> without constraints — a deep tree can memorise every training row.<br><br><strong>Key parameters:</strong><br>• <code>max_depth</code> — limit tree depth (try 3–6)<br>• <code>min_samples_split</code> — min rows to split<br>• <code>min_samples_leaf</code> — min rows per leaf<br>• <code>criterion</code> — \"gini\" or \"entropy\"<br><br><strong>Where it's used:</strong> Credit scoring (approve/reject), medical triage rules, and as the \"base learner\" inside Random Forest and Gradient Boosting — understanding one tree is the key to understanding every tree ensemble.</div></div><svg viewBox=\"0 0 500 290\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:500px;display:block;margin:4px auto;\">\n  <rect width=\"500\" height=\"290\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"250\" y=\"20\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Decision Tree — How It Splits Data</text>\n  <!-- ROOT -->\n  <rect x=\"175\" y=\"28\" width=\"150\" height=\"30\" fill=\"rgba(79,172,254,0.2)\" stroke=\"#4facfe\" stroke-width=\"2\" rx=\"8\"/>\n  <text x=\"250\" y=\"42\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">age &lt; 30?</text>\n  <text x=\"250\" y=\"54\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.6)\" font-size=\"8.5\" font-family=\"monospace\">Root node — best split</text>\n  <!-- Root branches -->\n  <line x1=\"210\" y1=\"58\" x2=\"140\" y2=\"100\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <line x1=\"290\" y1=\"58\" x2=\"360\" y2=\"100\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <text x=\"158\" y=\"85\" fill=\"#43e97b\" font-size=\"9\" font-family=\"monospace\">Yes</text>\n  <text x=\"328\" y=\"85\" fill=\"#f5576c\" font-size=\"9\" font-family=\"monospace\">No</text>\n  <!-- Level 2 LEFT -->\n  <rect x=\"72\" y=\"100\" width=\"138\" height=\"28\" fill=\"rgba(255,209,102,0.15)\" stroke=\"#FFD166\" stroke-width=\"1.5\" rx=\"7\"/>\n  <text x=\"141\" y=\"112\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"10\" font-family=\"monospace\">income &gt; 40K?</text>\n  <text x=\"141\" y=\"122\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.5)\" font-size=\"8\" font-family=\"monospace\">inner node</text>\n  <!-- Level 2 RIGHT -->\n  <rect x=\"290\" y=\"100\" width=\"138\" height=\"28\" fill=\"rgba(255,209,102,0.15)\" stroke=\"#FFD166\" stroke-width=\"1.5\" rx=\"7\"/>\n  <text x=\"359\" y=\"112\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"10\" font-family=\"monospace\">married?</text>\n  <text x=\"359\" y=\"122\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.5)\" font-size=\"8\" font-family=\"monospace\">inner node</text>\n  <!-- L2 branches -->\n  <line x1=\"115\" y1=\"128\" x2=\"80\"  y2=\"170\" stroke=\"rgba(255,255,255,0.25)\" stroke-width=\"1.5\"/>\n  <line x1=\"167\" y1=\"128\" x2=\"200\" y2=\"170\" stroke=\"rgba(255,255,255,0.25)\" stroke-width=\"1.5\"/>\n  <line x1=\"333\" y1=\"128\" x2=\"300\" y2=\"170\" stroke=\"rgba(255,255,255,0.25)\" stroke-width=\"1.5\"/>\n  <line x1=\"385\" y1=\"128\" x2=\"420\" y2=\"170\" stroke=\"rgba(255,255,255,0.25)\" stroke-width=\"1.5\"/>\n  <text x=\"86\"  y=\"158\" fill=\"#43e97b\" font-size=\"8.5\" font-family=\"monospace\">Yes</text>\n  <text x=\"184\" y=\"158\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">No</text>\n  <text x=\"304\" y=\"158\" fill=\"#43e97b\" font-size=\"8.5\" font-family=\"monospace\">Yes</text>\n  <text x=\"408\" y=\"158\" fill=\"#f5576c\" font-size=\"8.5\" font-family=\"monospace\">No</text>\n  <!-- Leaf nodes -->\n  <rect x=\"45\" y=\"170\" width=\"70\" height=\"30\" fill=\"rgba(67,233,123,0.2)\" stroke=\"#43e97b\" stroke-width=\"1.5\" rx=\"6\"/>\n  <text x=\"80\"  y=\"183\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">APPROVE</text>\n  <text x=\"80\"  y=\"194\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.6)\" font-size=\"7.5\" font-family=\"monospace\">leaf node</text>\n  <rect x=\"170\" y=\"170\" width=\"70\" height=\"30\" fill=\"rgba(245,87,108,0.2)\" stroke=\"#f5576c\" stroke-width=\"1.5\" rx=\"6\"/>\n  <text x=\"205\" y=\"183\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">REJECT</text>\n  <text x=\"205\" y=\"194\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.6)\" font-size=\"7.5\" font-family=\"monospace\">leaf node</text>\n  <rect x=\"265\" y=\"170\" width=\"70\" height=\"30\" fill=\"rgba(67,233,123,0.2)\" stroke=\"#43e97b\" stroke-width=\"1.5\" rx=\"6\"/>\n  <text x=\"300\" y=\"183\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">APPROVE</text>\n  <text x=\"300\" y=\"194\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.6)\" font-size=\"7.5\" font-family=\"monospace\">leaf node</text>\n  <rect x=\"390\" y=\"170\" width=\"70\" height=\"30\" fill=\"rgba(245,87,108,0.2)\" stroke=\"#f5576c\" stroke-width=\"1.5\" rx=\"6\"/>\n  <text x=\"425\" y=\"183\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">REJECT</text>\n  <text x=\"425\" y=\"194\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.6)\" font-size=\"7.5\" font-family=\"monospace\">leaf node</text>\n  <!-- Annotations -->\n  <text x=\"250\" y=\"222\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9.5\" font-family=\"monospace\">Each split asks a Yes/No question that best separates the classes</text>\n  <text x=\"250\" y=\"237\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9.5\" font-family=\"monospace\">The algorithm picks the feature+threshold that reduces impurity the most (Gini / Entropy)</text>\n  <!-- Overfitting warning -->\n  <rect x=\"60\" y=\"248\" width=\"380\" height=\"30\" fill=\"rgba(245,87,108,0.08)\" stroke=\"rgba(245,87,108,0.3)\" rx=\"6\"/>\n  <text x=\"250\" y=\"261\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">⚠️ Problem: Deep trees memorise training data (overfit)</text>\n  <text x=\"250\" y=\"274\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.7)\" font-size=\"9\" font-family=\"monospace\">Fix: max_depth, min_samples_split — or use Random Forest instead</text>\n</svg><div class=\"code-wrap\" style=\"margin-top:6px;\"><div class=\"code-header\"><span>decision_tree.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">interpretable classification — when you need to explain every decision</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">visualise the exact logic as a flowchart — great for stakeholders</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">change max_depth=4 to 10 — watch the tree get deeper and the accuracy gap between train/test grow</span></span></div><pre><span class=\"kw\">from</span> sklearn.tree <span class=\"kw\">import</span> DecisionTreeClassifier, plot_tree\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> train_test_split\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> classification_report, ConfusionMatrixDisplay\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\n<span class=\"cm\"># 1. Fetch dataset</span>\ndf = pd.read_csv(<span class=\"st\">\"loan_applications.csv\"</span>)\nX = df.drop(columns=[<span class=\"st\">\"approved\"</span>])\ny = df[<span class=\"st\">\"approved\"</span>]\n\n<span class=\"cm\"># 2. Train/test split</span>\nX_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=<span class=\"nm\">0.2</span>, stratify=y, random_state=<span class=\"nm\">42</span>\n)\n\n<span class=\"cm\"># 3. Train the algorithm</span>\ndt = DecisionTreeClassifier(max_depth=<span class=\"nm\">4</span>, min_samples_leaf=<span class=\"nm\">10</span>, random_state=<span class=\"nm\">42</span>)\ndt.fit(X_train, y_train)\n\n<span class=\"cm\"># 4. Visualise — the tree itself</span>\nplt.figure(figsize=(<span class=\"nm\">14</span>, <span class=\"nm\">6</span>))\nplot_tree(dt, feature_names=X.columns, class_names=[<span class=\"st\">\"Reject\"</span>,<span class=\"st\">\"Approve\"</span>], filled=<span class=\"kw\">True</span>, rounded=<span class=\"kw\">True</span>)\nplt.tight_layout(); plt.show()\n\n<span class=\"cm\"># 5. Evaluate</span>\n<span class=\"fn\">print</span>(classification_report(y_test, dt.predict(X_test)))\nConfusionMatrixDisplay.from_estimator(dt, X_test, y_test)\nplt.show()</pre><div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Loads a real loan dataset, trains a Decision Tree, plots the tree, then evaluates it.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">read_csv()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ loads the loan-applications data from a CSV file into a DataFrame</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">train_test_split()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ randomly splits X and y into training and test sets; stratify=y keeps the approve/reject ratio equal in both</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">fit()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ trains the model — it learns patterns from your X_train and y_train data</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">plot_tree()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ draws the full decision flowchart so you can see exactly which rule fired</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">classification_report()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ prints precision, recall, and F1-score for every class — tells you where the model fails</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">ConfusionMatrixDisplay.from_estimator()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ trains the eval on X_test/y_test directly and plots the TP/FP/FN/TN grid</span></div></div></div></div>"}, {"label": "Random Forest", "html": "<div class=\"section-tag\">Model 3</div><div class=\"slide-heading\">Random Forest — Why 500 Bad Trees Beat 1 Good One 🌲🌲🌲</div><div class=\"two-col\" style=\"margin-bottom:8px;\"><div><strong>The insight:</strong> One deep tree overfits. But if you train <em>many</em> shallow trees on <strong>random subsets of data and features</strong>, each makes different errors. When they vote together, the errors cancel out → much better generalisation.<br><br><strong>Two sources of randomness:</strong><br>• Bootstrap: each tree trains on a random 63% of rows (sampled with replacement)<br>• Feature subset: each split only considers √(n_features) features</div><div><strong>Strengths:</strong> Hard to overfit. No scaling needed. Built-in feature importance. Handles outliers well.<br><br><strong>Key parameters:</strong><br>• <code>n_estimators</code> — number of trees (100–500)<br>• <code>max_depth</code> — keep None or 10–20<br>• <code>max_features</code> — features per split<br>• <code>class_weight=\"balanced\"</code> — for imbalanced data<br>• <code>n_jobs=-1</code> — use all CPU cores<br>• <code>oob_score=True</code> — free validation score from the ~37% of rows each tree never saw<br><br><strong>Where it's used:</strong> Fraud detection, credit risk, churn prediction — anywhere you want strong accuracy with minimal tuning.</div></div><svg viewBox=\"0 0 540 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:540px;display:block;margin:4px auto;\">\n  <rect width=\"540\" height=\"250\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"270\" y=\"18\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Random Forest — Many Trees Vote, Majority Wins</text>\n  <!-- Full dataset box -->\n  <rect x=\"195\" y=\"26\" width=\"150\" height=\"26\" fill=\"rgba(79,172,254,0.15)\" stroke=\"rgba(79,172,254,0.4)\" rx=\"6\"/>\n  <text x=\"270\" y=\"41\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Full Dataset (N rows)</text>\n  <!-- Bootstrap sample arrows -->\n  <line x1=\"220\" y1=\"52\" x2=\"100\" y2=\"80\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <line x1=\"260\" y1=\"52\" x2=\"270\" y2=\"80\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <line x1=\"320\" y1=\"52\" x2=\"440\" y2=\"80\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\" stroke-dasharray=\"4,3\"/>\n  <text x=\"152\" y=\"68\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">random</text>\n  <text x=\"152\" y=\"78\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">bootstrap</text>\n  <text x=\"350\" y=\"68\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">random</text>\n  <text x=\"350\" y=\"78\" fill=\"rgba(255,255,255,0.4)\" font-size=\"8.5\" font-family=\"monospace\">bootstrap</text>\n  <!-- Tree 1 -->\n  <rect x=\"48\" y=\"80\" width=\"104\" height=\"70\" fill=\"rgba(67,233,123,0.07)\" stroke=\"rgba(67,233,123,0.3)\" rx=\"7\"/>\n  <text x=\"100\" y=\"97\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Tree 1</text>\n  <text x=\"100\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">random subset</text>\n  <text x=\"100\" y=\"121\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">of features too</text>\n  <rect x=\"60\" y=\"128\" width=\"76\" height=\"16\" fill=\"rgba(67,233,123,0.2)\" stroke=\"rgba(67,233,123,0.4)\" rx=\"4\"/>\n  <text x=\"98\" y=\"139\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">→ SPAM ✓</text>\n  <!-- Tree 2 -->\n  <rect x=\"218\" y=\"80\" width=\"104\" height=\"70\" fill=\"rgba(255,209,102,0.07)\" stroke=\"rgba(255,209,102,0.3)\" rx=\"7\"/>\n  <text x=\"270\" y=\"97\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Tree 2</text>\n  <text x=\"270\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">different sample</text>\n  <text x=\"270\" y=\"121\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">different features</text>\n  <rect x=\"232\" y=\"128\" width=\"76\" height=\"16\" fill=\"rgba(67,233,123,0.2)\" stroke=\"rgba(67,233,123,0.4)\" rx=\"4\"/>\n  <text x=\"270\" y=\"139\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">→ SPAM ✓</text>\n  <!-- Tree 3 -->\n  <rect x=\"388\" y=\"80\" width=\"104\" height=\"70\" fill=\"rgba(139,92,246,0.07)\" stroke=\"rgba(139,92,246,0.3)\" rx=\"7\"/>\n  <text x=\"440\" y=\"97\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">Tree 500</text>\n  <text x=\"440\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">yet another</text>\n  <text x=\"440\" y=\"121\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">bootstrap sample</text>\n  <rect x=\"402\" y=\"128\" width=\"76\" height=\"16\" fill=\"rgba(245,87,108,0.2)\" stroke=\"rgba(245,87,108,0.4)\" rx=\"4\"/>\n  <text x=\"440\" y=\"139\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"9\" font-weight=\"bold\" font-family=\"monospace\">→ NOT SPAM ✗</text>\n  <!-- Arrows down to vote box -->\n  <line x1=\"100\" y1=\"150\" x2=\"180\" y2=\"180\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <line x1=\"270\" y1=\"150\" x2=\"270\" y2=\"180\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <line x1=\"440\" y1=\"150\" x2=\"360\" y2=\"180\" stroke=\"rgba(255,255,255,0.3)\" stroke-width=\"1.5\"/>\n  <!-- Vote box -->\n  <rect x=\"165\" y=\"180\" width=\"210\" height=\"40\" fill=\"rgba(79,172,254,0.15)\" stroke=\"#4facfe\" stroke-width=\"2\" rx=\"8\"/>\n  <text x=\"270\" y=\"196\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">🗳️  Majority Vote</text>\n  <text x=\"270\" y=\"212\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">SPAM wins (498/500 trees)</text>\n  <!-- Bottom stats -->\n  <text x=\"270\" y=\"236\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.5)\" font-size=\"9\" font-family=\"monospace\">Random Forest = Bagging (parallel) + random feature subsets → much lower variance than 1 tree</text>\n</svg><div class=\"code-wrap\" style=\"margin-top:6px;\"><div class=\"code-header\"><span>random_forest.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">high-accuracy classification without much tuning</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">100+ trees vote → much lower variance than 1 tree</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">change n_estimators=300 to 10 — accuracy drops, speed increases</span></span></div><pre><span class=\"kw\">from</span> sklearn.ensemble <span class=\"kw\">import</span> RandomForestClassifier\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> train_test_split\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> classification_report, ConfusionMatrixDisplay\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\n<span class=\"cm\"># 1. Fetch dataset</span>\ndf = pd.read_csv(<span class=\"st\">\"email_spam.csv\"</span>)\nX = df.drop(columns=[<span class=\"st\">\"is_spam\"</span>])\ny = df[<span class=\"st\">\"is_spam\"</span>]\n\n<span class=\"cm\"># 2. Train/test split</span>\nX_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=<span class=\"nm\">0.2</span>, stratify=y, random_state=<span class=\"nm\">42</span>\n)\n\n<span class=\"cm\"># 3. Train the algorithm</span>\nrf = RandomForestClassifier(\n    n_estimators=<span class=\"nm\">300</span>,\n    max_depth=<span class=\"nm\">12</span>,\n    min_samples_leaf=<span class=\"nm\">5</span>,\n    class_weight=<span class=\"st\">\"balanced\"</span>,  <span class=\"cm\"># handles class imbalance</span>\n    n_jobs=-<span class=\"nm\">1</span>,\n    random_state=<span class=\"nm\">42</span>\n)\nrf.fit(X_train, y_train)\n\n<span class=\"cm\"># 4. Visualise — feature importance</span>\nfeat_imp = pd.Series(rf.feature_importances_, index=X.columns).sort_values(ascending=<span class=\"kw\">False</span>)\nfeat_imp.head(<span class=\"nm\">10</span>).plot(kind=<span class=\"st\">\"bar\"</span>, title=<span class=\"st\">\"Top 10 Important Features\"</span>)\nplt.tight_layout(); plt.show()\n\n<span class=\"cm\"># 5. Evaluate</span>\n<span class=\"fn\">print</span>(classification_report(y_test, rf.predict(X_test)))\nConfusionMatrixDisplay.from_estimator(rf, X_test, y_test)\nplt.show()</pre><div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Loads a real spam dataset, trains RandomForest, plots feature importance, then evaluates it.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">read_csv()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ loads the labelled email dataset (features + is_spam) into a DataFrame</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">train_test_split()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ randomly splits X and y into training and test sets; stratify=y keeps the spam ratio equal in both</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">fit()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ trains the model — it learns patterns from your X_train and y_train data</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">feature_importances_</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ ranks which features the forest actually relied on to make its splits</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">classification_report()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ prints precision, recall, and F1-score for every class — tells you where the model fails</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">ConfusionMatrixDisplay.from_estimator()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ trains the eval directly on X_test/y_test and plots the TP/FP/FN/TN grid</span></div></div></div></div>"}, {"label": "Confusion Matrix", "html": "<div class=\"section-tag\">Evaluation</div>\n<h2 class=\"slide-heading\"></h2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0;overflow:hidden;margin-top:6px;\">\n  <div style=\"display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden;\">\n    \n    <div style=\"flex:1;overflow:hidden;display:flex;align-items:center;\">\n      <svg viewBox=\"0 0 500 270\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;max-height:220px;\">\n  <rect width=\"500\" height=\"270\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"250\" y=\"18\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">Confusion Matrix — What Did the Model Actually Get Right?</text>\n  <!-- Column headers -->\n  <text x=\"240\" y=\"36\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"10\" font-family=\"monospace\">Predicted</text>\n  <text x=\"188\" y=\"54\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"10\" font-family=\"monospace\">SPAM</text>\n  <text x=\"300\" y=\"54\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"10\" font-family=\"monospace\">NOT SPAM</text>\n  <!-- Row header -->\n  <text x=\"55\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"10\" font-family=\"monospace\" transform=\"rotate(-90,55,110)\">Actual</text>\n  <text x=\"90\" y=\"95\" fill=\"#43e97b\" font-size=\"10\" font-family=\"monospace\">SPAM</text>\n  <text x=\"90\" y=\"140\" fill=\"#f5576c\" font-size=\"10\" font-family=\"monospace\">NOT</text>\n  <text x=\"90\" y=\"153\" fill=\"#f5576c\" font-size=\"10\" font-family=\"monospace\">SPAM</text>\n  <!-- TP cell -->\n  <rect x=\"118\" y=\"60\" width=\"130\" height=\"75\" fill=\"rgba(67,233,123,0.25)\" stroke=\"#43e97b\" stroke-width=\"2.5\" rx=\"5\"/>\n  <text x=\"183\" y=\"88\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"26\" font-weight=\"bold\" font-family=\"monospace\">85</text>\n  <text x=\"183\" y=\"104\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">TP</text>\n  <text x=\"183\" y=\"118\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.7)\" font-size=\"8.5\" font-family=\"monospace\">True Positive</text>\n  <text x=\"183\" y=\"129\" text-anchor=\"middle\" fill=\"rgba(67,233,123,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Spam caught ✅</text>\n  <!-- FN cell -->\n  <rect x=\"258\" y=\"60\" width=\"130\" height=\"75\" fill=\"rgba(245,87,108,0.12)\" stroke=\"rgba(245,87,108,0.4)\" stroke-width=\"1.5\" rx=\"5\"/>\n  <text x=\"323\" y=\"88\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"26\" font-weight=\"bold\" font-family=\"monospace\">15</text>\n  <text x=\"323\" y=\"104\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">FN</text>\n  <text x=\"323\" y=\"118\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.7)\" font-size=\"8.5\" font-family=\"monospace\">False Negative</text>\n  <text x=\"323\" y=\"129\" text-anchor=\"middle\" fill=\"rgba(245,87,108,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Spam missed ❌</text>\n  <!-- FP cell -->\n  <rect x=\"118\" y=\"143\" width=\"130\" height=\"75\" fill=\"rgba(255,209,102,0.12)\" stroke=\"rgba(255,209,102,0.4)\" stroke-width=\"1.5\" rx=\"5\"/>\n  <text x=\"183\" y=\"171\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"26\" font-weight=\"bold\" font-family=\"monospace\">5</text>\n  <text x=\"183\" y=\"187\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">FP</text>\n  <text x=\"183\" y=\"201\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.7)\" font-size=\"8.5\" font-family=\"monospace\">False Positive</text>\n  <text x=\"183\" y=\"212\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Legit flagged ⚠️</text>\n  <!-- TN cell -->\n  <rect x=\"258\" y=\"143\" width=\"130\" height=\"75\" fill=\"rgba(79,172,254,0.15)\" stroke=\"rgba(79,172,254,0.35)\" stroke-width=\"1.5\" rx=\"5\"/>\n  <text x=\"323\" y=\"171\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"26\" font-weight=\"bold\" font-family=\"monospace\">95</text>\n  <text x=\"323\" y=\"187\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"11\" font-weight=\"bold\" font-family=\"monospace\">TN</text>\n  <text x=\"323\" y=\"201\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.7)\" font-size=\"8.5\" font-family=\"monospace\">True Negative</text>\n  <text x=\"323\" y=\"212\" text-anchor=\"middle\" fill=\"rgba(79,172,254,0.7)\" font-size=\"8.5\" font-family=\"monospace\">Legit left alone ✅</text>\n  <!-- Metrics bottom row -->\n  <text x=\"250\" y=\"237\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9.5\" font-family=\"monospace\">Accuracy = (TP+TN)/(All) = 90%   Precision = TP/(TP+FP) = 94%   Recall = TP/(TP+FN) = 85%</text>\n  <text x=\"250\" y=\"252\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"9.5\" font-family=\"monospace\">F1 = 2 × Precision × Recall / (Precision + Recall) — balances both</text>\n  <text x=\"250\" y=\"266\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"9.5\" font-family=\"monospace\">Medical/fraud: minimise FN (recall matters).  Spam filter: minimise FP (precision matters).</text>\n</svg>\n    </div>\n  </div>\n  <div style=\"display:flex;flex-direction:column;min-height:0;overflow:hidden;\">\n    <div class=\"code-wrap\" style=\"flex:1;overflow:auto;min-height:0;\"><div class=\"code-header\"><span>confusion_matrix.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">after every classification model — accuracy alone is misleading</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">shows TP/FP/TN/FN — crucial for imbalanced or high-stakes problems</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">for medical data: prioritise recall (miss fewer positives) over precision</span></span></div><pre><span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> confusion_matrix, classification_report, ConfusionMatrixDisplay, roc_auc_score, RocCurveDisplay\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\npred = rf.predict(X_test)\nproba = rf.predict_proba(X_test)[:, <span class=\"nm\">1</span>]\n\n<span class=\"cm\"># Numeric confusion matrix</span>\ncm = confusion_matrix(y_test, pred)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"TP={cm[1,1]}  FP={cm[0,1]}  FN={cm[1,0]}  TN={cm[0,0]}\"</span>)\n\n<span class=\"cm\"># Visual confusion matrix</span>\nfig, ax = plt.subplots(figsize=(<span class=\"nm\">5</span>, <span class=\"nm\">4</span>))\nConfusionMatrixDisplay.from_predictions(\n    y_test, pred,\n    display_labels=[<span class=\"st\">\"Not Spam\"</span>, <span class=\"st\">\"Spam\"</span>],\n    colorbar=<span class=\"kw\">False</span>,\n    ax=ax\n)\nplt.tight_layout(); plt.show()\n\n<span class=\"cm\"># Full report: precision, recall, f1 per class</span>\n<span class=\"fn\">print</span>(classification_report(y_test, pred, target_names=[<span class=\"st\">\"Not Spam\"</span>, <span class=\"st\">\"Spam\"</span>]))\n\n<span class=\"cm\"># Tune threshold: if recall matters more than precision</span>\npred_aggressive = (proba >= <span class=\"nm\">0.3</span>).astype(<span class=\"nm\">int</span>)   <span class=\"cm\"># catch more spam, more FP</span>\n<span class=\"fn\">print</span>(classification_report(y_test, pred_aggressive))\n\n<span class=\"cm\"># ROC-AUC — ranks predictions regardless of threshold</span>\nauc = roc_auc_score(y_test, proba)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"ROC-AUC: {auc:.3f}\"</span>)\nRocCurveDisplay.from_predictions(y_test, proba); plt.show()</pre><div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Computes and displays the confusion matrix and full classification report, tunes the decision threshold, then adds ROC-AUC — the single number analysts quote when comparing models regardless of threshold.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">predict()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ uses the trained model to make predictions on new data (X_test) — never seen during training</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">predict_proba()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ returns a 0-1 probability per row instead of just the predicted label</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">confusion_matrix()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ 2×2 (or n×n) table: rows=actual, cols=predicted — TP/FP/FN/TN in one view</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">ConfusionMatrixDisplay.from_predictions()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ plots the confusion matrix directly from already-computed predictions</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">classification_report()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ prints precision, recall, and F1-score for every class — tells you where the model fails</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">roc_auc_score()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ single number summarising how well the model ranks positives above negatives across every threshold</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">RocCurveDisplay.from_predictions()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ plots the ROC curve so you can see the trade-off at every possible threshold, not just one</span></div></div></div></div>\n  </div>\n</div>"}, {"label": "Metrics Explained", "html": "<div class=\"section-tag\">Evaluation Deep Dive</div><div class=\"slide-heading\">Classification Metrics Explained 📊</div><div class=\"cards cards-3\" style=\"margin-top:6px;\"><div class=\"card card-accent\"><div class=\"card-icon\">🎯</div><h3>Accuracy</h3><p><strong>(TP+TN) / Total.</strong> \"What % of all predictions were right?\" Use on <em>balanced</em> data. Trap: 99% accuracy can still mean 0% of fraud/disease cases caught.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🔍</div><h3>Precision</h3><p><strong>TP / (TP+FP).</strong> \"Of everything I flagged positive, how many really were?\" Use when false alarms are costly — e.g. flagging a real user as a bot, or a real email as spam.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🕸️</div><h3>Recall (Sensitivity)</h3><p><strong>TP / (TP+FN).</strong> \"Of all the real positives, how many did I catch?\" Use when missing a positive is costly — cancer detection, fraud, letting a bot slip past a CAPTCHA.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">⚖️</div><h3>F1-Score</h3><p><strong>2 × (P×R) / (P+R).</strong> The harmonic mean of Precision and Recall — punishes a model that's great at one and terrible at the other. Best single number for imbalanced data.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">📈</div><h3>ROC-AUC</h3><p>Measures how well the model <em>ranks</em> positives above negatives across <strong>every possible threshold</strong> at once — not just the one you picked. Great for comparing models before you've chosen a cutoff.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🧮</div><h3>Support</h3><p>Not a performance metric — it's the actual row count per class in <code>classification_report()</code>. Always check it: a great score on 3 rows means nothing.</p></div></div><div class=\"highlight\" style=\"margin-top:8px;\"><strong>Quick decision guide:</strong> Balanced classes, no side more important → <strong>Accuracy</strong>. False alarms are the expensive mistake (spam, wrongly blocking a real user) → <strong>Precision</strong>. Missing a positive is the expensive mistake (cancer, fraud, a bot slipping past a CAPTCHA) → <strong>Recall</strong>. Need one number on imbalanced data → <strong>F1</strong>. Comparing models before fixing a threshold → <strong>ROC-AUC</strong>.</div><div class=\"tip\">🤖 <strong>CAPTCHA in metric terms:</strong> a CAPTCHA system that is too strict optimises for <em>Precision</em> (few bots slip through) at the cost of <em>Recall</em> on humans (annoying real users with repeated challenges) — exactly the precision/recall trade-off in this slide, just applied to telling humans and bots apart.</div>"}, {"label": "Handling Imbalanced Data", "html": "<div class=\"section-tag\">Real-World Problem</div><div class=\"slide-heading\">Handling Imbalanced Classes ⚖️</div><div class=\"highlight\">Real datasets are often imbalanced: 99% normal transactions, 1% fraud. A model that always predicts \"normal\" gets 99% accuracy but catches 0% of fraud.</div><div class=\"code-wrap\" style=\"margin-top:6px;\"><div class=\"code-header\"><span>imbalanced.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">fraud, churn, rare disease — when minority class < 20% of data</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">without SMOTE model predicts majority only and calls it 95% accurate</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">compare classification_report before and after SMOTE — watch the F1 for class 1 change</span></span></div><pre><span class=\"kw\">from</span> sklearn.ensemble <span class=\"kw\">import</span> RandomForestClassifier\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> train_test_split\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> classification_report, ConfusionMatrixDisplay\n<span class=\"kw\">from</span> imblearn.over_sampling <span class=\"kw\">import</span> SMOTE\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\n<span class=\"cm\"># 1. Fetch dataset</span>\ndf = pd.read_csv(<span class=\"st\">\"transactions.csv\"</span>)\nX = df.drop(columns=[<span class=\"st\">\"is_fraud\"</span>])\ny = df[<span class=\"st\">\"is_fraud\"</span>]\n<span class=\"fn\">print</span>(y.value_counts())\n<span class=\"cm\"># class 0: 9800   class 1: 200  ← severely imbalanced!</span>\n\n<span class=\"cm\"># 2. Train/test split</span>\nX_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=<span class=\"nm\">0.2</span>, stratify=y, random_state=<span class=\"nm\">42</span>\n)\n\n<span class=\"cm\"># 3. Train the algorithm — SMOTE the training set first</span>\nsmote = SMOTE(random_state=<span class=\"nm\">42</span>)\nX_res, y_res = smote.fit_resample(X_train, y_train)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"After SMOTE: {pd.Series(y_res).value_counts().to_dict()}\"</span>)\n\nrf = RandomForestClassifier(class_weight=<span class=\"st\">\"balanced\"</span>, random_state=<span class=\"nm\">42</span>)\nrf.fit(X_res, y_res)\n\n<span class=\"cm\"># 4. Visualise — class balance, before vs after</span>\nfig, axes = plt.subplots(<span class=\"nm\">1</span>, <span class=\"nm\">2</span>, figsize=(<span class=\"nm\">8</span>, <span class=\"nm\">3</span>))\npd.Series(y_train).value_counts().plot(kind=<span class=\"st\">\"bar\"</span>, ax=axes[<span class=\"nm\">0</span>], title=<span class=\"st\">\"Before SMOTE\"</span>)\npd.Series(y_res).value_counts().plot(kind=<span class=\"st\">\"bar\"</span>, ax=axes[<span class=\"nm\">1</span>], title=<span class=\"st\">\"After SMOTE\"</span>)\nplt.tight_layout(); plt.show()\n\n<span class=\"cm\"># 5. Evaluate</span>\n<span class=\"fn\">print</span>(classification_report(y_test, rf.predict(X_test)))\nConfusionMatrixDisplay.from_estimator(rf, X_test, y_test)\nplt.show()</pre><div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Loads a real fraud dataset, applies SMOTE to the training set only, retrains, and compares class balance before/after.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">read_csv()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ loads the labelled transaction data (features + is_fraud) into a DataFrame</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">value_counts()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ counts how many times each unique value appears — great for checking class balance</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">train_test_split()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ splits X and y into training/test sets; stratify=y keeps the same tiny fraud ratio in both</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">SMOTE()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ creates synthetic minority-class examples on the TRAINING set only — fixes class imbalance</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">fit()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ trains the model — it learns patterns from your (now-balanced) X_res and y_res data</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">classification_report()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ prints precision, recall, and F1-score for every class — tells you where the model fails</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">ConfusionMatrixDisplay.from_estimator()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ trains the eval directly on the untouched X_test/y_test and plots TP/FP/FN/TN</span></div></div></div></div><div class=\"tip\">💡 <strong>Always use F1 or ROC-AUC</strong> for imbalanced data — never accuracy. <code>class_weight=\"balanced\"</code> is the easiest first step.</div><div class=\"tip\">🔎 <strong>Real example:</strong> a bot-detection dataset might be 99.5% human clicks and 0.5% bots — exactly like fraud. The same class_weight/SMOTE/threshold tricks apply whether you're catching fraud, churn, or bots trying to slip past a CAPTCHA.</div>"}, {"label": "SVM Classifier", "html": "<div class=\"section-tag\">Model 4</div><div class=\"slide-heading\">Support Vector Machine (SVM) — Finding the Widest Boundary 🧩</div><div class=\"two-col\" style=\"margin-bottom:8px;\"><div><strong>How it works:</strong> SVM finds the hyperplane (line, in 2D) that separates classes with the <em>widest possible margin</em>. Only the closest points on each side — the <strong>support vectors</strong> — determine where that boundary sits; the rest of the data doesn't matter.<br><br><strong>Kernel trick:</strong> a <code>linear</code> kernel draws a straight boundary. An <code>rbf</code> kernel projects data into higher dimensions so a curved, non-linear boundary becomes possible — without ever explicitly computing that transform.<br><br><strong>Strengths:</strong> Excellent in high-dimensional spaces (more features than rows) — e.g. pixel grids, text vectors. Effective when classes have a clear margin of separation.</div><div><strong>Weaknesses:</strong> Slow to train on large datasets (thousands+ rows). <strong>Needs feature scaling</strong> — it's distance-based, so unscaled features distort the boundary. Less interpretable than a tree. Performance is sensitive to <code>C</code>/<code>gamma</code>/kernel choice.<br><br><strong>Key parameters:</strong><br>• <code>C</code> — regularisation; high C fits training data tightly (risk overfit), low C keeps a wider, more tolerant margin<br>• <code>kernel</code> — \"linear\", \"rbf\", \"poly\"<br>• <code>gamma</code> — how far one point's influence reaches (rbf kernel)<br>• <code>class_weight=\"balanced\"</code> — for imbalanced classes</div></div><svg viewBox=\"0 0 500 250\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:500px;display:block;margin:4px auto;\">\n  <rect width=\"500\" height=\"250\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"250\" y=\"18\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" font-family=\"monospace\">SVM — Widest Street Between the Two Classes</text>\n  <!-- Class A points (circles) -->\n  <circle cx=\"110\" cy=\"70\" r=\"7\" fill=\"rgba(67,233,123,0.8)\" stroke=\"#43e97b\" stroke-width=\"1.5\"/>\n  <circle cx=\"150\" cy=\"95\" r=\"7\" fill=\"rgba(67,233,123,0.8)\" stroke=\"#43e97b\" stroke-width=\"1.5\"/>\n  <circle cx=\"95\" cy=\"120\" r=\"7\" fill=\"rgba(67,233,123,0.8)\" stroke=\"#43e97b\" stroke-width=\"1.5\"/>\n  <circle cx=\"170\" cy=\"60\" r=\"7\" fill=\"rgba(67,233,123,0.8)\" stroke=\"#43e97b\" stroke-width=\"1.5\"/>\n  <circle cx=\"200\" cy=\"110\" r=\"7\" fill=\"rgba(67,233,123,0.35)\" stroke=\"#43e97b\" stroke-width=\"2.5\"/>\n  <!-- Class B points (squares) -->\n  <rect x=\"330\" y=\"80\" width=\"14\" height=\"14\" fill=\"rgba(245,87,108,0.8)\" stroke=\"#f5576c\" stroke-width=\"1.5\"/>\n  <rect x=\"370\" y=\"120\" width=\"14\" height=\"14\" fill=\"rgba(245,87,108,0.8)\" stroke=\"#f5576c\" stroke-width=\"1.5\"/>\n  <rect x=\"400\" y=\"70\" width=\"14\" height=\"14\" fill=\"rgba(245,87,108,0.8)\" stroke=\"#f5576c\" stroke-width=\"1.5\"/>\n  <rect x=\"340\" y=\"150\" width=\"14\" height=\"14\" fill=\"rgba(245,87,108,0.8)\" stroke=\"#f5576c\" stroke-width=\"1.5\"/>\n  <rect x=\"248\" y=\"103\" width=\"14\" height=\"14\" fill=\"rgba(245,87,108,0.35)\" stroke=\"#f5576c\" stroke-width=\"2.5\"/>\n  <!-- Margin lines -->\n  <line x1=\"215\" y1=\"20\" x2=\"235\" y2=\"230\" stroke=\"rgba(79,172,254,0.35)\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/>\n  <line x1=\"255\" y1=\"20\" x2=\"275\" y2=\"230\" stroke=\"rgba(79,172,254,0.35)\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\"/>\n  <!-- Hyperplane -->\n  <line x1=\"235\" y1=\"20\" x2=\"255\" y2=\"230\" stroke=\"#4facfe\" stroke-width=\"2.5\"/>\n  <text x=\"245\" y=\"16\" text-anchor=\"middle\" fill=\"#4facfe\" font-size=\"9\" font-family=\"monospace\">hyperplane</text>\n  <text x=\"150\" y=\"200\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Class A (letter \"A\")</text>\n  <text x=\"365\" y=\"200\" text-anchor=\"middle\" fill=\"#f5576c\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Class B (letter \"B\")</text>\n  <text x=\"250\" y=\"235\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.55)\" font-size=\"9\" font-family=\"monospace\">Highlighted points = support vectors — only these decide the boundary</text>\n</svg><div class=\"highlight\" style=\"margin-top:6px;\"><strong>Real-world example — CAPTCHA:</strong> classic CAPTCHA-breaking research extracted pixel/edge features from each distorted character, then trained an SVM to classify which letter or digit it was. SVMs were a go-to model for this precisely because character images have huge feature counts (every pixel) relative to how many training examples you have — SVM's strength. It's also why modern CAPTCHAs (reCAPTCHA v2/v3) deliberately added distortion, overlapping strokes, and behavioural checks: to defeat exactly this style of classifier.<div style=\"margin-top:8px;text-align:center;\"><img src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Captcha_early.JPG\" alt=\"Classic distorted-text CAPTCHA example\" style=\"max-width:220px;width:100%;border-radius:6px;border:1px solid rgba(255,255,255,0.15);\"><div style=\"font-size:9px;color:var(--muted);margin-top:3px;\">Classic distorted-text CAPTCHA — the kind SVMs were trained to classify letter-by-letter · Wikimedia Commons, CC BY-SA</div></div></div><div class=\"code-wrap\" style=\"margin-top:6px;\"><div class=\"code-header\"><span>svm_classifier.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:18px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">high-dimensional data (images, text) with a clear margin between classes</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">maximises the margin → tends to generalise well even with modest training data</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">switch kernel=\"linear\" to kernel=\"rbf\" — watch which letters stop being confused</span></span></div><pre><span class=\"kw\">from</span> sklearn.svm <span class=\"kw\">import</span> SVC\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> train_test_split, GridSearchCV\n<span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler\n<span class=\"kw\">from</span> sklearn.pipeline <span class=\"kw\">import</span> make_pipeline\n<span class=\"kw\">from</span> sklearn.metrics <span class=\"kw\">import</span> classification_report, ConfusionMatrixDisplay\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> matplotlib.pyplot <span class=\"kw\">as</span> plt\n\n<span class=\"cm\"># 1. Fetch dataset — pixel/HOG features extracted per CAPTCHA character</span>\ndf = pd.read_csv(<span class=\"st\">\"captcha_characters.csv\"</span>)\nX = df.drop(columns=[<span class=\"st\">\"letter\"</span>])\ny = df[<span class=\"st\">\"letter\"</span>]\n\n<span class=\"cm\"># 2. Train/test split</span>\nX_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=<span class=\"nm\">0.2</span>, stratify=y, random_state=<span class=\"nm\">42</span>\n)\n\n<span class=\"cm\"># 3. Train the algorithm — SVM is distance-based, ALWAYS scale first</span>\nsvm_pipe = make_pipeline(\n    StandardScaler(),\n    SVC(kernel=<span class=\"st\">\"rbf\"</span>, C=<span class=\"nm\">1.0</span>, gamma=<span class=\"st\">\"scale\"</span>,\n        class_weight=<span class=\"st\">\"balanced\"</span>, probability=<span class=\"kw\">True</span>, random_state=<span class=\"nm\">42</span>)\n)\nsvm_pipe.fit(X_train, y_train)\n\n<span class=\"cm\"># 4. Visualise — which letters get confused for which</span>\nConfusionMatrixDisplay.from_estimator(svm_pipe, X_test, y_test, xticks_rotation=<span class=\"nm\">90</span>)\nplt.title(<span class=\"st\">\"CAPTCHA Character Confusion\"</span>); plt.show()\n\n<span class=\"cm\"># 5. Evaluate</span>\n<span class=\"fn\">print</span>(classification_report(y_test, svm_pipe.predict(X_test)))\n\n<span class=\"cm\"># ── Bonus: tune C, gamma, and kernel together ─────────────</span>\nparam_grid = {\n    <span class=\"st\">\"svc__C\"</span>: [<span class=\"nm\">0.1</span>, <span class=\"nm\">1</span>, <span class=\"nm\">10</span>],\n    <span class=\"st\">\"svc__gamma\"</span>: [<span class=\"st\">\"scale\"</span>, <span class=\"nm\">0.01</span>, <span class=\"nm\">0.1</span>],\n    <span class=\"st\">\"svc__kernel\"</span>: [<span class=\"st\">\"linear\"</span>, <span class=\"st\">\"rbf\"</span>]\n}\ngrid = GridSearchCV(svm_pipe, param_grid, cv=<span class=\"nm\">5</span>, scoring=<span class=\"st\">\"f1_macro\"</span>, n_jobs=-<span class=\"nm\">1</span>)\ngrid.fit(X_train, y_train)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Best: {grid.best_params_}, F1={grid.best_score_:.3f}\"</span>)</pre><div style=\"background:rgba(255,255,255,0.04);border-top:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Loads a real CAPTCHA-character feature dataset, trains an SVM, visualises the confusion matrix, evaluates, then tunes hyperparameters.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">read_csv()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ loads the per-character pixel/HOG feature dataset extracted from CAPTCHA images</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">train_test_split()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ splits X and y into training/test sets; stratify=y keeps every letter equally represented in both</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">StandardScaler()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ rescales every feature to mean 0, variance 1 — essential before any distance-based model</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">SVC()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ finds the maximum-margin boundary between classes; kernel=\"rbf\" allows curved boundaries</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">ConfusionMatrixDisplay.from_estimator()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ shows exactly which letters the model mixes up with which — not just a single accuracy number</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">classification_report()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ prints precision, recall, and F1-score for every letter class</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">GridSearchCV()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ tries every combination of hyperparameters with cross-validation and keeps the best one</span></div></div></div></div>"}, {"label": "Session Recap", "html": "<div class=\"section-tag\">Session Recap</div><div class=\"slide-heading\">What You've Learned 🎉</div><div class=\"recap-grid\"><div class=\"recap-item\"><div class=\"recap-icon\">📈</div><div class=\"recap-text\"><h4>Logistic Regression</h4><p>Sigmoid turns a weighted score into a 0-1 probability. Fast, interpretable baseline. Assumes a roughly linear boundary.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🌳</div><div class=\"recap-text\"><h4>Decision Trees</h4><p>Interpretable, learns IF-THEN rules. max_depth prevents overfitting. Always visualise the tree to understand decisions.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🌲</div><div class=\"recap-text\"><h4>Random Forest</h4><p>Ensemble of 100–500 trees. Much better than single tree. n_estimators, max_depth, min_samples_leaf are key params.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🧩</div><div class=\"recap-text\"><h4>SVM</h4><p>Finds the widest-margin boundary between classes. Needs feature scaling. Great for high-dimensional data like CAPTCHA character images.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📊</div><div class=\"recap-text\"><h4>Confusion Matrix</h4><p>TP/FP/FN/TN. Precision = no false alarms. Recall = catch everything. F1 = balance. ROC-AUC = overall ranking.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">⚖️</div><div class=\"recap-text\"><h4>Imbalanced Data</h4><p>class_weight=\"balanced\" (easiest). SMOTE (synthesise minority samples). Lower decision threshold. Never use accuracy alone.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📏</div><div class=\"recap-text\"><h4>Metrics Cheat Sheet</h4><p>Accuracy = overall correctness. Precision = trust your positives. Recall = catch every positive. F1 = balance both. ROC-AUC = ranking across all thresholds.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🎯</div><div class=\"recap-text\"><h4>Which Metric?</h4><p>Spam filter → Precision. Cancer detection → Recall. General imbalanced → F1. Probability ranking → ROC-AUC. Bot/CAPTCHA detection → treat like fraud: F1 + threshold tuning.</p></div></div></div><div class=\"highlight\" style=\"margin-top:auto;\">🚀 <strong>Next:</strong> Session 12 — Neural Networks: build deep learning models with Keras</div>"}];







let cur=0;
const wrap=document.getElementById('slides-wrap');
const dotsEl=document.getElementById('dots');
function renderSlides(){
  wrap.innerHTML='';dotsEl.innerHTML='';
  SLIDES_DATA.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===0?' active':'');
    div.innerHTML=s.html;
    wrap.appendChild(div);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>jump(i);
    dotsEl.appendChild(dot);
  });
  updateUI();
}
function updateUI(){
  const t=SLIDES_DATA.length;
  document.getElementById('counter').textContent=(cur+1)+' / '+t;
  document.getElementById('progress-bar').style.width=((cur+1)/t*100)+'%';
  document.getElementById('slide-title-bar').textContent=SLIDES_DATA[cur].label||'';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===t-1;
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===cur));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===cur));
}
function go(d){jump(cur+d);}
function jump(i){if(i<0||i>=SLIDES_DATA.length)return;cur=i;updateUI();document.querySelectorAll('.slide')[cur].scrollTop=0;}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='Home')jump(0);
  if(e.key==='End')jump(SLIDES_DATA.length-1);
});
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

let _tx=0;
document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>50){go(dx<0?1:-1);}
},{passive:true});
renderSlides();
</script></body></html>
