<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Session 08 — Feature Engineering</title><style>
:root{--accent:#f97583;--bg:#0f0f1a;--text:#e8e8f0;--muted:#8888aa;--code-bg:#0d1117;--card:#1e2240;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;}
#deck{width:100%;height:100vh;display:flex;flex-direction:column;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;gap:12px;}
#session-label{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent);text-transform:uppercase;white-space:nowrap;}
#slide-title-bar{font-size:12px;color:var(--muted);flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topbar-right{display:flex;gap:8px;align-items:center;flex-shrink:0;}
#counter{font-size:12px;color:var(--muted);white-space:nowrap;}
.btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:var(--text);border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all 0.15s;}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#000;}
#progress-wrap{height:3px;background:rgba(255,255,255,0.05);flex-shrink:0;}
#progress-bar{height:100%;background:var(--accent);transition:width 0.3s ease;}
#slides-wrap{flex:1;position:relative;overflow:hidden;}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:14px 26px 10px;overflow-y:auto;animation:fadeIn 0.25s ease;}
.slide.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
#nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 24px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.06);}
.nav-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:var(--text);padding:7px 26px;border-radius:8px;font-size:14px;cursor:pointer;transition:all 0.15s;}
.nav-btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#000;}
.nav-btn:disabled{opacity:0.3;cursor:default;}
#dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:600px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.2s;}
.dot.active{background:var(--accent);transform:scale(1.5);}
.slide-title{align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1e2a4a 0%,#0f0f1a 70%);}
.session-badge{font-size:11px;font-weight:800;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:10px;padding:3px 12px;border:1px solid var(--accent);border-radius:20px;display:inline-block;}
.slide-title h1{font-size:clamp(26px,3.4vw,46px);font-weight:800;line-height:1.15;margin-bottom:10px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:pre-line;}
.slide-title .sub{font-size:14px;color:var(--muted);max-width:580px;line-height:1.6;margin-bottom:14px;}
.academy-tag{font-size:12px;color:var(--muted);letter-spacing:1px;}
.section-tag{font-size:10px;font-weight:700;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;margin-bottom:6px;}
.slide-heading{font-size:clamp(17px,2.2vw,28px);font-weight:700;margin-bottom:8px;line-height:1.2;}
.cards{display:grid;gap:7px;}
.cards-2{grid-template-columns:1fr 1fr;}
.cards-3{grid-template-columns:1fr 1fr 1fr;}
.cards-4{grid-template-columns:1fr 1fr 1fr 1fr;}
.card{background:var(--card);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:9px 12px;}
.card-accent{border-left:3px solid var(--accent);}
.card-icon{font-size:18px;margin-bottom:3px;}
.card h3{font-size:13px;font-weight:700;margin-bottom:4px;color:#fff;}
.card p{font-size:11.5px;color:var(--muted);line-height:1.55;}
.steps{display:flex;flex-direction:column;gap:6px;}
.step{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:10px;padding:11px 14px;border:1px solid rgba(255,255,255,0.06);}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#000;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-body h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.step-body p{font-size:12px;color:var(--muted);line-height:1.5;}
.code-wrap{flex:1;display:flex;flex-direction:column;min-height:70px;background:var(--code-bg);border-radius:10px;border:1px solid rgba(255,255,255,0.08);overflow:hidden;margin:4px 0;}
.code-header{background:rgba(255,255,255,0.05);padding:5px 13px;font-size:11px;color:var(--muted);font-family:monospace;display:flex;justify-content:space-between;align-items:center;}
pre{padding:9px 13px;overflow-x:auto;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:13.5px;line-height:1.75;color:#c9d1d9;}
.kw{color:#ff7b72;}.fn{color:#d2a8ff;}.st{color:#a5d6ff;}.cm{color:#8b949e;font-style:italic;}.nm{color:#79c0ff;}.op{color:#ff9e64;}
.highlight{background:rgba(255,255,255,0.04);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0;font-size:13px;line-height:1.6;}
.highlight strong{color:var(--accent);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;}
.warn{background:rgba(255,100,50,0.1);border:1px solid rgba(255,100,50,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.tip{background:rgba(80,220,100,0.1);border:1px solid rgba(80,220,100,0.3);border-radius:8px;padding:9px 13px;font-size:12px;margin:6px 0;}
.roadmap{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1;}
.roadmap-item{background:var(--card);border-radius:12px;padding:8px;border:1px solid rgba(255,255,255,0.06);display:flex;gap:7px;align-items:flex-start;}
.rm-num{font-size:18px;font-weight:900;color:var(--accent);opacity:0.4;line-height:1;flex-shrink:0;width:22px;}
.rm-icon{font-size:17px;flex-shrink:0;}
.rm-text h4{font-size:12px;font-weight:700;margin-bottom:2px;}
.rm-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.recap-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1;}
.recap-item{background:var(--card);border-radius:10px;padding:8px;border-left:3px solid var(--accent);display:flex;gap:7px;align-items:flex-start;}
.recap-icon{font-size:17px;flex-shrink:0;}
.recap-text h4{font-size:13px;font-weight:700;margin-bottom:2px;}
.recap-text p{font-size:11px;color:var(--muted);line-height:1.5;}
.e-list{display:flex;flex-direction:column;gap:5px;}
.e-item{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.55;}
.e-icon{font-size:15px;flex-shrink:0;}
table{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0;}
th{background:rgba(255,255,255,0.06);padding:7px 10px;text-align:left;font-weight:700;color:var(--accent);}
td{padding:6px 10px;border-top:1px solid rgba(255,255,255,0.05);color:var(--muted);}
.slide::-webkit-scrollbar{width:4px;}
.slide::-webkit-scrollbar-track{background:transparent;}
.slide::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:2px;}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:700;margin:2px;}
.tag-green{background:rgba(80,200,80,0.2);color:#50c850;border:1px solid rgba(80,200,80,0.3);}
.tag-blue{background:rgba(80,150,255,0.2);color:#79c0ff;border:1px solid rgba(80,150,255,0.3);}
.tag-orange{background:rgba(255,150,50,0.2);color:#ff9e64;border:1px solid rgba(255,150,50,0.3);}
.big-concept{background:linear-gradient(135deg,#1e2a4a,#1e2240);border:1px solid rgba(249,117,131,0.3);border-radius:14px;padding:10px 16px;margin:4px 0;text-align:center;}
.big-concept .bc-emoji{font-size:26px;margin-bottom:3px;}
.big-concept h2{font-size:17px;font-weight:800;color:#fff;margin-bottom:3px;}
.big-concept p{font-size:13px;color:var(--muted);line-height:1.6;}

@media(max-width:768px){
  body{overflow:auto;}
  #deck{height:auto;min-height:100vh;}
  #slides-wrap{height:auto;min-height:50vh;}
  .slide{position:relative;inset:auto;display:none;padding:12px 14px 10px;overflow-y:auto;}
  .slide.active{display:flex;}

  /* ── Force ALL inline CSS grids to single column ── */
  div[style*="grid-template-columns"]{grid-template-columns:1fr !important;}
  div[style*="display:grid"]{grid-template-columns:1fr !important;}

  /* ── Stack all named grid layouts ── */
  .cards-2,.cards-3,.cards-4,.two-col,.roadmap,.recap-grid{grid-template-columns:1fr !important;}

  /* ── Code blocks — readable, scrollable ── */
  pre{font-size:11.5px !important;line-height:1.65 !important;overflow-x:auto;white-space:pre;}
  .code-wrap{max-height:320px;overflow:auto !important;}
  .code-header{font-size:10px;}

  /* ── Context strip & breakdown — wrap cleanly ── */
  div[style*="color:#4facfe"]{flex-direction:column !important;gap:5px !important;}
  div[style*="🔍 What this block"]{font-size:10.5px !important;}
  div[style*="color:#d2a8ff"]{font-size:10px !important;}

  /* ── Slide text ── */
  .slide-heading{font-size:17px !important;margin-bottom:8px;}
  .section-tag{font-size:9px;}
  .card h3{font-size:12px;}
  .card p,.card-p,.card{font-size:11px;}
  .highlight,.tip,.warn{font-size:11px;padding:8px 10px;}
  .step-body h4{font-size:12px;}
  .step-body p{font-size:11px;}
  table{font-size:10px;}
  th,td{padding:4px 6px;}

  /* ── SVGs — cap height so they don't eat the screen ── */
  svg{max-height:220px !important;width:100% !important;}

  /* ── Navigation ── */
  #topbar{padding:8px 10px;gap:6px;}
  #session-label{display:none;}
  #slide-title-bar{font-size:10px;}
  #nav{padding:8px 10px;gap:8px;}
  .nav-btn{padding:8px 18px;font-size:14px;}
  #dots{max-width:100%;flex-wrap:wrap;}
  .dot{width:5px;height:5px;}

  /* ── Remove flex constraints that cause clipping ── */
  .code-wrap{min-height:unset !important;flex:unset !important;}
  pre{flex:unset !important;}

  /* ── Inline style overrides for padding/margin ── */
  div[style*="padding:32px"]{padding:12px 14px !important;}
  div[style*="padding:20px 44px"]{padding:10px 12px !important;}
  div[style*="padding:16px 44px"]{padding:10px 12px !important;}
  div[style*="padding:14px 40px"]{padding:10px 12px !important;}
}
.code-wrap pre{flex:1;overflow:auto;} .code-wrap *,.code-wrap *,.code-wrap{user-select:text !important;-webkit-user-select:text !important;}
</style>
  <style>
    .code-header { position: relative; }
    .copy-btn {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6); font-size: 10px; padding: 2px 8px;
      border-radius: 4px; cursor: pointer; font-family: monospace;
      transition: all 0.15s;
    }
    .copy-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .copy-btn.copied { color: #43e97b; border-color: #43e97b; }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.code-header').forEach(function(header) {
        var wrap = header.closest('.code-wrap');
        if (!wrap) return;
        var pre = wrap.querySelector('pre');
        if (!pre) return;
        var btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.textContent = 'Copy';
        btn.addEventListener('click', function() {
          navigator.clipboard.writeText(pre.innerText).then(function() {
            btn.textContent = 'Copied!';
            btn.classList.add('copied');
            setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
          });
        });
        header.style.position = 'relative';
        header.appendChild(btn);
      });
    });
  </script>
</head><body>

<div id="topbar"><div id="session-label">Session 08 · codencode Academy</div><div id="slide-title-bar"></div><div id="topbar-right"><span id="counter"></span><button class="btn" onclick="toggleFS()">⛶ Fullscreen</button></div></div>
<div id="progress-wrap"><div id="progress-bar"></div></div>
<div id="slides-wrap"></div>
<div id="nav"><button class="nav-btn" id="prev-btn" onclick="go(-1)">← Prev</button><div id="dots"></div><button class="nav-btn" id="next-btn" onclick="go(1)">Next →</button></div>
</div><script>
const SLIDES_DATA = [{"label": "Title", "html": "<div class=\"slide-title\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;\"><div class=\"session-badge\">Session 08 of 15</div><div style=\"font-size:48px;margin-bottom:6px;\">⚙️</div><h1>Feature Engineering</h1><p class=\"sub\">The most impactful skill in ML — better features beat better algorithms every time</p><div style=\"display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap;\"><span class=\"tag tag-blue\">Cleaning</span><span class=\"tag tag-green\">Encoding</span><span class=\"tag tag-orange\">Scaling</span><span class=\"tag tag-blue\">New Features</span><span class=\"tag tag-green\">Selection</span></div><div class=\"academy-tag\" style=\"margin-top:10px;\">codencode Academy · Python + Data Science</div></div>"}, {"label": "Today's Roadmap", "html": "<div class=\"section-tag\">Roadmap</div><div class=\"slide-heading\">What We'll Cover Today 🗺️</div><div class=\"roadmap\"><div class=\"roadmap-item\"><div class=\"rm-num\">01</div><div class=\"rm-icon\">🎯</div><div class=\"rm-text\"><h4>What Are Features?</h4><p>Inputs to ML models — raw data is rarely in the right format</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">02</div><div class=\"rm-icon\">🧹</div><div class=\"rm-text\"><h4>Data Cleaning</h4><p>Handle missing values, fix data types, remove duplicates, outlier treatment</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">03</div><div class=\"rm-icon\">🔤</div><div class=\"rm-text\"><h4>Encoding Categoricals</h4><p>One-hot encoding, label encoding — when to use which</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">04</div><div class=\"rm-icon\">📏</div><div class=\"rm-text\"><h4>Scaling Numerics</h4><p>StandardScaler vs MinMaxScaler — why models care about scale</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">05</div><div class=\"rm-icon\">✨</div><div class=\"rm-text\"><h4>Creating New Features</h4><p>Interactions, date parts, log transform, domain-specific features</p></div></div><div class=\"roadmap-item\"><div class=\"rm-num\">06</div><div class=\"rm-icon\">📊</div><div class=\"rm-text\"><h4>Feature Selection</h4><p>Correlation, feature importance, removing redundant features</p></div></div></div>"}, {"label": "What Are Features?", "html": "<div class=\"section-tag\">Fundamentals</div><div class=\"slide-heading\">What Are Features? Why Do They Matter? 🎯</div><div class=\"big-concept\"><div class=\"bc-emoji\">🏆</div><h2>\"Garbage in, garbage out\" — the quality of features determines model performance</h2><p>A feature is any measurable property used as input to a model. Raw data is rarely ML-ready. Feature engineering transforms raw columns into signals that models can learn from.</p></div><div class=\"cards cards-3\" style=\"margin-top:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">📋</div><h3>Raw Feature</h3><p>Date of birth: \"1990-05-15\"<br>Category: \"Electronics\"<br>Address: \"123 Orchard Rd\"</p></div><div class=\"card card-accent\"><div class=\"card-icon\">✨</div><h3>Engineered Feature</h3><p>Age: 34<br>One-hot: [0,1,0,0,0]<br>Postal district: 9</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🚀</div><h3>Created Feature</h3><p>price_per_sqm = price/area<br>days_since_purchase<br>rolling_30d_avg_spend</p></div></div><div class=\"tip\">💡 <strong>Rule:</strong> Spend more time on feature engineering than on trying different algorithms. A simple logistic regression with great features beats a neural network with bad features.</div>"}, {"label": "Feature Engineering Defined", "html": "<div class=\"section-tag\">Definition</div><div class=\"slide-heading\">Feature Engineering — The Core Definition 🛢️</div><div class=\"big-concept\"><div class=\"bc-emoji\">🛢️</div><h2>Process of transforming raw data into meaningful input variables (features) to help ML models learn patterns more effectively</h2><p>Like refining crude oil into fuel — raw data in its original state can't power a model. Feature engineering extracts the signal hidden inside it.</p></div><div style=\"display:flex;align-items:stretch;gap:4px;margin:12px 0;justify-content:center;\"><div style=\"background:rgba(249,117,131,0.15);border:1px solid rgba(249,117,131,0.5);border-radius:8px;padding:10px 8px;text-align:center;flex:1;\"><div style=\"font-size:20px;\">🗂️</div><div style=\"font-size:11px;font-weight:700;color:#f97583;margin-top:4px;\">Raw</div><div style=\"font-size:10px;color:rgba(255,255,255,0.5);\">Data</div></div><div style=\"display:flex;align-items:center;padding:0 4px;color:rgba(255,255,255,0.4);font-size:18px;\">→</div><div style=\"background:rgba(79,172,254,0.15);border:1px solid rgba(79,172,254,0.5);border-radius:8px;padding:10px 8px;text-align:center;flex:1;\"><div style=\"font-size:20px;\">✨</div><div style=\"font-size:11px;font-weight:700;color:#4facfe;margin-top:4px;\">Trans-</div><div style=\"font-size:10px;color:#4facfe;\">formed</div></div><div style=\"display:flex;align-items:center;padding:0 4px;color:rgba(255,255,255,0.4);font-size:18px;\">→</div><div style=\"background:rgba(210,168,255,0.15);border:1px solid rgba(210,168,255,0.5);border-radius:8px;padding:10px 8px;text-align:center;flex:1;\"><div style=\"font-size:20px;\">🤖</div><div style=\"font-size:11px;font-weight:700;color:#d2a8ff;margin-top:4px;\">AI Model</div></div><div style=\"display:flex;align-items:center;padding:0 4px;color:rgba(255,255,255,0.4);font-size:18px;\">→</div><div style=\"background:rgba(255,159,64,0.15);border:1px solid rgba(255,159,64,0.5);border-radius:8px;padding:10px 8px;text-align:center;flex:1;\"><div style=\"font-size:20px;\">🚀</div><div style=\"font-size:11px;font-weight:700;color:#ff9e40;margin-top:4px;\">Deploy</div></div><div style=\"display:flex;align-items:center;padding:0 4px;color:rgba(255,255,255,0.4);font-size:18px;\">→</div><div style=\"background:rgba(67,233,123,0.15);border:1px solid rgba(67,233,123,0.5);border-radius:8px;padding:10px 8px;text-align:center;flex:1;\"><div style=\"font-size:18px;\">💡</div><div style=\"font-size:10px;font-weight:700;color:#43e97b;margin-top:4px;\">Actionable</div><div style=\"font-size:10px;color:#43e97b;\">Insight</div></div></div><div class=\"tip\">💡 <strong>Feature Engineering happens in the Raw → Transformed step</strong> — it determines whether your model receives signal or noise.</div>"}, {"label": "The 5 Types of Feature Engineering", "html": "<div class=\"section-tag\">Overview</div><div class=\"slide-heading\">The 5 Types of Feature Engineering 🔧</div><div class=\"cards cards-2\" style=\"flex:1;\"><div class=\"card card-accent\"><div class=\"card-icon\">➕</div><h3>1. Feature Creation</h3><p>Combining existing variables into more informative ones. E.g.: multiply height × weight to calculate BMI. Creates new signal not directly in the raw data.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🔄</div><h3>2. Feature Transformation</h3><p>Modifying values to make them readable or mathematically stable for algorithms. E.g.: one-hot encoding converts \"City\" text into 0/1 columns; z-score scaling puts all numeric features on the same scale.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🗜️</div><h3>3. Feature Extraction</h3><p>Compressing large amounts of data into a simplified, lower-dimensional format. E.g.: PCA reduces 90 correlated columns → 10 principal components retaining 95% of variance.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🎯</div><h3>4. Feature Selection</h3><p>Filtering out redundant, irrelevant or highly correlated columns to keep the model fast and prevent overfitting.</p></div></div><div class=\"card card-accent\" style=\"margin-top:9px;border-left:3px solid var(--accent);\"><div class=\"card-icon\">🩹</div><h3>5. Handling Missing Values &amp; Outliers</h3><p>Imputing empty cells and treating extreme values so they don't distort model learning — because most sklearn models crash on NaN inputs.</p></div>"}, {"label": "Feature Creation", "html": "<div class=\"section-tag\">Type 1</div><div class=\"slide-heading\">Feature Creation — Building New Signal ➕</div><div class=\"highlight\"><strong>Definition:</strong> Combining or mathematically transforming existing variables to produce more informative features. Captures relationships that individual raw columns can't express alone.</div><div class=\"cards cards-2\" style=\"margin-top:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">⚖️</div><h3>Classic Example: BMI</h3><p>Raw: height = 175 cm, weight = 80 kg<br>Created: <strong>BMI = weight / height²  = 26.1</strong><br><br>BMI predicts health outcomes far better than either height or weight separately — the combination carries more signal.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🏠</div><h3>Housing Example: Price/sqm</h3><p>Raw: price = $800,000 | area = 80 sqm<br>Created: <strong>price_per_sqm = $10,000</strong><br><br>Directly comparable across properties of different sizes — exactly what the model needs to learn value.</p></div></div><div class=\"code-wrap\" style=\"margin-top:10px;\"><div class=\"code-header\"><span>feature_creation.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">after loading data — apply domain knowledge to build ratios and interactions</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">combined features capture relationships individual columns miss</span></span></div><pre><span class=\"cm\"># BMI — health / fitness domain</span>\ndf[<span class=\"st\">\"bmi\"</span>] = df[<span class=\"st\">\"weight_kg\"</span>] / (df[<span class=\"st\">\"height_m\"</span>] ** <span class=\"nm\">2</span>)\n\n<span class=\"cm\"># Price per square metre — real estate</span>\ndf[<span class=\"st\">\"price_per_sqm\"</span>] = df[<span class=\"st\">\"price\"</span>] / df[<span class=\"st\">\"area_sqm\"</span>]\n\n<span class=\"cm\"># Family size (Titanic)</span>\ndf[<span class=\"st\">\"family_size\"</span>] = df[<span class=\"st\">\"sibsp\"</span>] + df[<span class=\"st\">\"parch\"</span>] + <span class=\"nm\">1</span>\n\n<span class=\"cm\"># Debt-to-income ratio — credit / finance</span>\ndf[<span class=\"st\">\"dti_ratio\"</span>] = df[<span class=\"st\">\"total_debt\"</span>] / df[<span class=\"st\">\"annual_income\"</span>]</pre><div style=\"background:rgba(255,255,255,0.05);border-bottom:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:4px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;line-height:1.55;\">Creates new columns by combining existing ones — ratios, sums, and products often carry more predictive signal than any raw value alone.</div></div></div>"}, {"label": "Feature Transformation", "html": "<div class=\"section-tag\">Type 2</div><div class=\"slide-heading\">Feature Transformation — Making Data Algorithm-Ready 🔄</div><div class=\"highlight\"><strong>Definition:</strong> Modifying values to make them readable or mathematically stable for algorithms — without creating entirely new variables from scratch.</div><div class=\"cards cards-3\" style=\"margin-top:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">🔢</div><h3>One-Hot Encoding</h3><p>\"Singapore\" → [1, 0, 0]<br>\"Malaysia\"  → [0, 1, 0]<br>\"Thailand\"  → [0, 0, 1]<br><br>Converts text categories into numbers algorithms can use — no ordering implied.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">📏</div><h3>Z-Score Scaling</h3><p>Salary 55,000 → z = 0.12<br>Age 35 → z = −0.08<br><br>Centres all features at mean=0, std=1 so no single large-magnitude feature dominates the model.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">📊</div><h3>Log Transform</h3><p>price = 1,000,000 → log(1M+1) ≈ 13.8<br><br>Compresses right-skewed distributions (house prices, incomes) into a more normal shape — improves linear model performance.</p></div></div><div class=\"code-wrap\" style=\"margin-top:10px;\"><div class=\"code-header\"><span>transformation.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">any column that has skew, wrong scale, or is text — transform before fitting</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">algorithms assume numeric, comparable inputs — transformation satisfies that assumption</span></span></div><pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler\n\n<span class=\"cm\"># 1. Log transform — fix right-skewed distributions</span>\ndf[<span class=\"st\">\"log_price\"</span>] = np.log1p(df[<span class=\"st\">\"price\"</span>])     <span class=\"cm\"># log(x+1) avoids log(0)</span>\n\n<span class=\"cm\"># 2. Z-score scaling — put all numeric features on same scale</span>\nscaler = StandardScaler()\ndf[[<span class=\"st\">\"age_z\"</span>, <span class=\"st\">\"salary_z\"</span>]] = scaler.fit_transform(df[[<span class=\"st\">\"age\"</span>, <span class=\"st\">\"salary\"</span>]])\n\n<span class=\"cm\"># 3. One-hot encoding — convert text categories to numbers</span>\ndf = pd.get_dummies(df, columns=[<span class=\"st\">\"city\"</span>])  <span class=\"cm\"># → city_SG, city_MY, city_TH</span></pre><div style=\"background:rgba(255,255,255,0.05);border-bottom:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:4px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;line-height:1.55;\">Applies the three most common transformations: log (fixes skew), StandardScaler (fixes scale), get_dummies (encodes categories into numbers).</div></div></div>"}, {"label": "Feature Selection", "html": "<div class=\"section-tag\">Type 4</div><div class=\"slide-heading\">Feature Selection — Keeping Only What Matters 🎯</div><div class=\"highlight\"><strong>Definition:</strong> Filtering out redundant, irrelevant or highly correlated data columns to keep the model fast and prevent overfitting.</div><div class=\"cards cards-3\" style=\"margin-top:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">📊</div><h3>Correlation Filter</h3><p>If two columns correlate > 0.95, they carry the same information. Drop one — keeping both adds noise and slows training without improving accuracy.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🌲</div><h3>Feature Importance</h3><p>Tree models (Random Forest, XGBoost) score each feature by how much it reduces error. Drop features scoring near zero — they're just noise to the model.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">⚡</div><h3>Variance Threshold</h3><p>A column that's 99% the same value carries almost no signal. Remove near-constant features before training starts.</p></div></div><div class=\"code-wrap\" style=\"margin-top:10px;\"><div class=\"code-header\"><span>feature_selection.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">after cleaning — remove redundant features before training</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">fewer, better features reduce overfitting and speed up training significantly</span></span></div><pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">from</span> sklearn.ensemble <span class=\"kw\">import</span> RandomForestClassifier\n\n<span class=\"cm\"># 1. Drop highly correlated columns (correlation > 0.95)</span>\ncorr = df.corr().abs()\nmask = np.triu(np.ones(corr.shape, dtype=bool), k=<span class=\"nm\">1</span>)\nhigh_corr = corr.where(mask)\ndrop_cols = [c <span class=\"kw\">for</span> c <span class=\"kw\">in</span> high_corr.columns <span class=\"kw\">if</span> any(high_corr[c] > <span class=\"nm\">0.95</span>)]\ndf_clean = df.drop(columns=drop_cols)\n\n<span class=\"cm\"># 2. Keep top-10 features by Random Forest importance</span>\nrf = RandomForestClassifier(n_estimators=<span class=\"nm\">100</span>).fit(X_train, y_train)\nscores = pd.Series(rf.feature_importances_, index=X_train.columns)\ntop10 = scores.nlargest(<span class=\"nm\">10</span>).index\nX_selected = X_train[top10]</pre><div style=\"background:rgba(255,255,255,0.05);border-bottom:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:4px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;line-height:1.55;\">Removes columns where correlation > 0.95 (redundant info). Then trains a Random Forest to score importance and keeps only the top 10 most predictive features.</div></div></div>"}, {"label": "Missing Values & Outliers", "html": "<div class=\"section-tag\">Type 5</div><div class=\"slide-heading\">Handling Missing Values &amp; Outliers 🩹</div><div class=\"highlight\"><strong>Definition:</strong> Imputing (filling) empty cells and treating extreme values so they don't distort model learning — most sklearn models crash on NaN inputs.</div><div class=\"cards cards-2\" style=\"margin-top:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">🕳️</div><h3>Missing Values — Imputation Rules</h3><p><strong>Numeric column:</strong> fill with median (robust to outliers)<br><strong>Category column:</strong> fill with mode or \"Unknown\"<br><strong>Time series:</strong> forward-fill (last known value carries forward)<br><strong>Target column:</strong> always drop the row — never impute the label</p></div><div class=\"card card-accent\"><div class=\"card-icon\">📈</div><h3>Outliers — Treatment Methods</h3><p><strong>IQR cap:</strong> clip values below Q1−1.5×IQR or above Q3+1.5×IQR<br><strong>Z-score filter:</strong> remove rows where |z| > 3 standard deviations<br><strong>Log transform:</strong> compresses extreme values naturally<br><strong>Quantile clip:</strong> hard cap at 1st / 99th percentile</p></div></div><div class=\"code-wrap\" style=\"margin-top:10px;\"><div class=\"code-header\"><span>missing_outliers.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">immediately after loading data — always before fitting any model</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">NaN crashes sklearn; outliers skew the mean and distort linear models</span></span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\n<span class=\"cm\"># ── Impute missing values by column type ──────────────────</span>\ndf[<span class=\"st\">\"age\"</span>]   = df[<span class=\"st\">\"age\"</span>].fillna(df[<span class=\"st\">\"age\"</span>].median())      <span class=\"cm\"># numeric → median</span>\ndf[<span class=\"st\">\"city\"</span>]  = df[<span class=\"st\">\"city\"</span>].fillna(<span class=\"st\">\"Unknown\"</span>)               <span class=\"cm\"># category → Unknown</span>\ndf[<span class=\"st\">\"price\"</span>] = df[<span class=\"st\">\"price\"</span>].ffill()                         <span class=\"cm\"># time series → forward-fill</span>\ndf = df.dropna(subset=[<span class=\"st\">\"target\"</span>])                          <span class=\"cm\"># target → drop rows!</span>\n\n<span class=\"cm\"># ── Cap outliers using the IQR method ─────────────────────</span>\nQ1 = df[<span class=\"st\">\"salary\"</span>].quantile(<span class=\"nm\">0.25</span>)\nQ3 = df[<span class=\"st\">\"salary\"</span>].quantile(<span class=\"nm\">0.75</span>)\nIQR = Q3 - Q1\ndf[<span class=\"st\">\"salary\"</span>] = df[<span class=\"st\">\"salary\"</span>].clip(Q1 - <span class=\"nm\">1.5</span> * IQR, Q3 + <span class=\"nm\">1.5</span> * IQR)\n\n<span class=\"cm\"># ── Remove rows beyond 3 standard deviations ──────────────</span>\nz = (df[<span class=\"st\">\"salary\"</span>] - df[<span class=\"st\">\"salary\"</span>].mean()) / df[<span class=\"st\">\"salary\"</span>].std()\ndf = df[z.abs() < <span class=\"nm\">3</span>]</pre><div style=\"background:rgba(255,255,255,0.05);border-bottom:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:4px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;line-height:1.55;\">Fills missing values by column type (median for numeric, Unknown for text, ffill for time series). Then caps salary outliers with IQR and removes rows beyond 3 standard deviations.</div></div></div>"}, {"label": "Why Features Matter", "html": "<div class=\"section-tag\">Impact</div><div class=\"slide-heading\">Why Feature Engineering Dominates 🏆</div><div class=\"two-col\"><div><div class=\"highlight\"><strong>Kaggle winning insight:</strong><br>In most competitions, the top solutions use essentially the same algorithms (XGBoost, LightGBM). What separates winners is <strong>which features they created</strong>.</div><div class=\"cards\" style=\"margin-top:10px;gap:8px;\"><div class=\"card card-accent\"><h3>Scales / Distances</h3><p>Most distance-based algorithms (KNN, SVM, linear regression) treat all features as equal. Salary (50000) dominates Age (30) without scaling.</p></div><div class=\"card card-accent\"><h3>Categorical Encoding</h3><p>ML models need numbers. \"Singapore\", \"Malaysia\", \"Thailand\" must become numerical before any model can use them.</p></div><div class=\"card card-accent\"><h3>Missing Data</h3><p>Most sklearn models raise errors on NaN values. You MUST handle missing data before fitting any model.</p></div></div></div><div><div class=\"code-wrap\"><div class=\"code-header\"><span>impact_example.py</span><span>python</span></div><div style=\"background:rgba(255,255,255,0.05);border-bottom:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Trains the same model with raw vs engineered features — shows accuracy jump.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">get_dummies()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ one-hot encodes categorical columns — creates one binary column per category</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">cross_val_score()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ trains and evaluates the model k times on different splits — more reliable than a single test score</span></div></div></div><div style=\"padding:5px 14px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">every ML project — features are the most impactful improvement</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">better features beat better models — this is the data scientist's edge</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">remove one feature, rerun cross_val_score, watch score drop</span></span></div><pre><span class=\"kw\">from</span> sklearn.linear_model <span class=\"kw\">import</span> LogisticRegression\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> cross_val_score\n\n<span class=\"cm\"># Without feature engineering</span>\nX_raw = df[[<span class=\"st\">\"age\"</span>, <span class=\"st\">\"salary\"</span>, <span class=\"st\">\"category\"</span>]]\n<span class=\"cm\"># Error: can't use strings in sklearn!</span>\n\n<span class=\"cm\"># With feature engineering</span>\nX_eng = df.copy()\nX_eng = pd.get_dummies(X_eng, columns=[<span class=\"st\">\"category\"</span>])\nX_eng[<span class=\"st\">\"salary_scaled\"</span>] = (X_eng[<span class=\"st\">\"salary\"</span>] - X_eng[<span class=\"st\">\"salary\"</span>].mean()) / X_eng[<span class=\"st\">\"salary\"</span>].std()\n\nscores = cross_val_score(LogisticRegression(), X_eng, y, cv=<span class=\"nm\">5</span>)\n<span class=\"fn\">print</span>(<span class=\"st\">f\"Accuracy: {scores.mean():.3f}\"</span>)</pre>\n</div></div></div>"}, {"label": "Feature Types", "html": "<div class=\"section-tag\">Concept 1</div><div class=\"slide-heading\">Feature Types — Know What You're Working With 🗂️</div><div class=\"cards cards-2\" style=\"margin-bottom:10px;\"><div class=\"card card-accent\"><div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px;\"><div style=\"font-size:22px;\">📈</div><div><h3 style=\"margin:0;\">Continuous</h3><div style=\"font-size:10px;color:var(--muted);\">Any value in a range — infinite decimals possible</div></div></div><div style=\"background:rgba(255,255,255,0.04);border-radius:8px;padding:8px 10px;font-size:11px;\"><div style=\"display:flex;align-items:center;gap:4px;margin-bottom:6px;\"><div style=\"flex:1;height:4px;background:linear-gradient(90deg,#4facfe,#f97583);border-radius:2px;position:relative;\"><div style=\"position:absolute;top:-8px;left:20%;font-size:9px;color:#4facfe;\">23.1°</div><div style=\"position:absolute;top:-8px;left:50%;font-size:9px;color:#fff;\">36.6°</div><div style=\"position:absolute;top:-8px;left:80%;font-size:9px;color:#f97583;\">98.7°</div><div style=\"position:absolute;bottom:-8px;left:0;font-size:9px;color:var(--muted);\">min</div><div style=\"position:absolute;bottom:-8px;right:0;font-size:9px;color:var(--muted);\">max</div></div></div><div style=\"margin-top:10px;color:var(--muted);font-size:11px;\">Examples: <strong style=\"color:#fff;\">temperature, weight, salary, price, height</strong></div><div style=\"color:var(--muted);font-size:11px;\">How to handle: scale, check distribution, log transform if skewed</div></div></div><div class=\"card card-accent\"><div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px;\"><div style=\"font-size:22px;\">🔢</div><div><h3 style=\"margin:0;\">Discrete</h3><div style=\"font-size:10px;color:var(--muted);\">Countable whole numbers only — no decimals between them</div></div></div><div style=\"background:rgba(255,255,255,0.04);border-radius:8px;padding:8px 10px;font-size:11px;\"><div style=\"display:flex;align-items:flex-end;gap:6px;height:40px;margin-bottom:6px;\"><div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;\"><div style=\"width:18px;height:8px;background:#4facfe;border-radius:2px;\"></div><div style=\"font-size:9px;color:var(--muted);\">0</div></div><div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;\"><div style=\"width:18px;height:16px;background:#4facfe;border-radius:2px;\"></div><div style=\"font-size:9px;color:var(--muted);\">1</div></div><div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;\"><div style=\"width:18px;height:24px;background:#4facfe;border-radius:2px;\"></div><div style=\"font-size:9px;color:var(--muted);\">2</div></div><div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;\"><div style=\"width:18px;height:32px;background:#4facfe;border-radius:2px;\"></div><div style=\"font-size:9px;color:var(--muted);\">3</div></div><div style=\"display:flex;flex-direction:column;align-items:center;gap:2px;\"><div style=\"width:18px;height:40px;background:#4facfe;border-radius:2px;\"></div><div style=\"font-size:9px;color:var(--muted);\">4</div></div><div style=\"font-size:10px;color:var(--muted);align-self:center;padding-left:4px;\">no 1.5 or 2.7 allowed</div></div><div style=\"color:var(--muted);font-size:11px;\">Examples: <strong style=\"color:#fff;\">num_rooms, order count, clicks, family size</strong></div><div style=\"color:var(--muted);font-size:11px;\">How to handle: treat as numeric or encode as category if low cardinality</div></div></div><div class=\"card card-accent\"><div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px;\"><div style=\"font-size:22px;\">🏷️</div><div><h3 style=\"margin:0;\">Nominal</h3><div style=\"font-size:10px;color:var(--muted);\">Categories with NO natural order — just different labels</div></div></div><div style=\"background:rgba(255,255,255,0.04);border-radius:8px;padding:8px 10px;font-size:11px;\"><div style=\"display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;\"><div style=\"background:rgba(79,172,254,0.2);border:1px solid #4facfe;border-radius:6px;padding:4px 10px;font-size:11px;color:#4facfe;\">🇸🇬 SG</div><div style=\"display:flex;align-items:center;color:var(--muted);font-size:14px;\">≠</div><div style=\"background:rgba(67,233,123,0.2);border:1px solid #43e97b;border-radius:6px;padding:4px 10px;font-size:11px;color:#43e97b;\">🇲🇾 MY</div><div style=\"display:flex;align-items:center;color:var(--muted);font-size:14px;\">≠</div><div style=\"background:rgba(249,117,131,0.2);border:1px solid #f97583;border-radius:6px;padding:4px 10px;font-size:11px;color:#f97583;\">🇹🇭 TH</div></div><div style=\"font-size:10px;color:#ff9e64;margin-bottom:4px;\">⚠️ SG is NOT greater than MY — they are just different!</div><div style=\"color:var(--muted);font-size:11px;\">Examples: <strong style=\"color:#fff;\">city, product type, colour, gender, country</strong></div><div style=\"color:var(--muted);font-size:11px;\">How to handle: <strong style=\"color:var(--accent);\">One-hot encode</strong> — never label encode (would imply order)</div></div></div><div class=\"card card-accent\"><div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px;\"><div style=\"font-size:22px;\">📊</div><div><h3 style=\"margin:0;\">Ordinal</h3><div style=\"font-size:10px;color:var(--muted);\">Categories WITH a natural order — ranks matter</div></div></div><div style=\"background:rgba(255,255,255,0.04);border-radius:8px;padding:8px 10px;font-size:11px;\"><div style=\"display:flex;gap:4px;align-items:center;margin-bottom:6px;\"><div style=\"background:rgba(255,255,255,0.06);border-radius:4px;padding:4px 8px;font-size:12px;text-align:center;\">S<br><span style=\"color:var(--accent);font-size:10px;\">0</span></div><div style=\"color:var(--muted);\">﹤</div><div style=\"background:rgba(255,255,255,0.08);border-radius:4px;padding:4px 8px;font-size:12px;text-align:center;\">M<br><span style=\"color:var(--accent);font-size:10px;\">1</span></div><div style=\"color:var(--muted);\">﹤</div><div style=\"background:rgba(255,255,255,0.10);border-radius:4px;padding:4px 8px;font-size:12px;text-align:center;\">L<br><span style=\"color:var(--accent);font-size:10px;\">2</span></div><div style=\"color:var(--muted);\">﹤</div><div style=\"background:rgba(255,255,255,0.13);border-radius:4px;padding:4px 8px;font-size:12px;text-align:center;\">XL<br><span style=\"color:var(--accent);font-size:10px;\">3</span></div><div style=\"font-size:10px;color:var(--muted);padding-left:6px;\">label encode → preserves order</div></div><div style=\"color:var(--muted);font-size:11px;\">Examples: <strong style=\"color:#fff;\">size (S/M/L/XL), rating (1–5★), education level, satisfaction</strong></div><div style=\"color:var(--muted);font-size:11px;\">How to handle: <strong style=\"color:var(--accent);\">label encode with a map</strong> — order is meaningful here</div></div></div></div><div class=\"tip\">💡 First step for any new dataset: run <code>df.dtypes</code> and categorise every column — this decides your entire preprocessing pipeline.</div>"}, {"label": "Cleaning Data", "html": "<div class=\"section-tag\">Concept 2</div><div class=\"slide-heading\">Data Cleaning Pipeline 🧹</div><div class=\"code-wrap\"><div class=\"code-header\"><span>cleaning.py</span><span>python</span></div><div style=\"background:rgba(255,255,255,0.05);border-bottom:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Fixes column names, fills nulls, removes duplicates, and corrects dtypes — the full cleaning pipeline.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">fillna()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ replaces every NaN (missing) cell with the value you specify — e.g. 0, \"Unknown\", or df.mean()</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">dropna()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ removes any row that contains at least one NaN; use subset=[\"col\"] to only check specific columns</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">pdto_datetime()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ converts a string column (\"2023-01-15\") into proper datetime objects you can sort and diff</span></div></div></div><div style=\"padding:5px 14px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">first step of every single project — always before analysis</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">dirty data → wrong models → wrong decisions</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">print(df.shape) before and after cleaning to see rows removed</span></span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\ndf = pd.read_csv(<span class=\"st\">\"raw_data.csv\"</span>)\n\n<span class=\"cm\"># ── 1. Fix column names ────────────────────────────────────</span>\ndf.columns = df.columns.str.strip().str.lower().str.replace(<span class=\"st\">\" \"</span>, <span class=\"st\">\"_\"</span>)\n\n<span class=\"cm\"># ── 2. Fix data types ─────────────────────────────────────</span>\ndf[<span class=\"st\">\"price\"</span>] = pd.to_numeric(df[<span class=\"st\">\"price\"</span>], errors=<span class=\"st\">\"coerce\"</span>)  <span class=\"cm\"># \"$1,200\" → NaN</span>\ndf[<span class=\"st\">\"date\"</span>] = pd.to_datetime(df[<span class=\"st\">\"date\"</span>], errors=<span class=\"st\">\"coerce\"</span>)\n\n<span class=\"cm\"># ── 3. Handle missing values ──────────────────────────────</span>\ndf[<span class=\"st\">\"age\"</span>] = df[<span class=\"st\">\"age\"</span>].fillna(df[<span class=\"st\">\"age\"</span>].median())\ndf[<span class=\"st\">\"category\"</span>] = df[<span class=\"st\">\"category\"</span>].fillna(<span class=\"st\">\"Unknown\"</span>)\ndf = df.dropna(subset=[<span class=\"st\">\"target\"</span>])  <span class=\"cm\"># must have target</span>\n\n<span class=\"cm\"># ── 4. Remove duplicates ──────────────────────────────────</span>\ndf = df.drop_duplicates()\n\n<span class=\"cm\"># ── 5. Cap outliers (IQR method) ──────────────────────────</span>\nQ1 = df[<span class=\"st\">\"price\"</span>].quantile(<span class=\"nm\">0.25</span>)\nQ3 = df[<span class=\"st\">\"price\"</span>].quantile(<span class=\"nm\">0.75</span>)\nIQR = Q3 - Q1\nlower, upper = Q1 - <span class=\"nm\">1.5</span> * IQR, Q3 + <span class=\"nm\">1.5</span> * IQR\ndf[<span class=\"st\">\"price\"</span>] = df[<span class=\"st\">\"price\"</span>].clip(lower, upper)</pre>\n</div>"}, {"label": "Why Cleaning Matters", "html": "<div class=\"section-tag\">Real Consequences</div><div class=\"slide-heading\">What Happens If You Don't Clean? 💥</div><svg viewBox=\"0 0 560 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:560px;display:block;margin:6px auto;\">\n  <rect width=\"560\" height=\"260\" fill=\"rgba(0,0,0,0.45)\" rx=\"10\"/>\n  <text x=\"280\" y=\"22\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" font-family=\"monospace\">What Happens If You Don't Clean Your Data?</text>\n  <!-- 4 consequence cards -->\n  <!-- Card 1: NaN -->\n  <rect x=\"12\" y=\"34\" width=\"124\" height=\"110\" fill=\"rgba(239,68,68,0.1)\" stroke=\"rgba(239,68,68,0.3)\" rx=\"8\"/>\n  <text x=\"74\" y=\"52\" text-anchor=\"middle\" fill=\"#EF4444\" font-size=\"18\">💥</text>\n  <text x=\"74\" y=\"68\" text-anchor=\"middle\" fill=\"#EF4444\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">NaN values</text>\n  <text x=\"74\" y=\"84\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">sklearn crashes</text>\n  <text x=\"74\" y=\"97\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">with ValueError:</text>\n  <text x=\"74\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(239,68,68,0.8)\" font-size=\"8.5\" font-family=\"monospace\">\"Input contains NaN\"</text>\n  <text x=\"74\" y=\"135\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">Fix: fillna() or dropna()</text>\n  <!-- Card 2: Wrong types -->\n  <rect x=\"144\" y=\"34\" width=\"124\" height=\"110\" fill=\"rgba(249,115,22,0.1)\" stroke=\"rgba(249,115,22,0.3)\" rx=\"8\"/>\n  <text x=\"206\" y=\"52\" text-anchor=\"middle\" fill=\"#F97316\" font-size=\"18\">⚠️</text>\n  <text x=\"206\" y=\"68\" text-anchor=\"middle\" fill=\"#F97316\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Wrong dtypes</text>\n  <text x=\"206\" y=\"84\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">salary = \"50,000\"</text>\n  <text x=\"206\" y=\"97\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">(string not int)</text>\n  <text x=\"206\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(249,115,22,0.8)\" font-size=\"8.5\" font-family=\"monospace\">mean() returns NaN</text>\n  <text x=\"206\" y=\"135\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">Fix: astype(), pd.to_numeric()</text>\n  <!-- Card 3: Outliers -->\n  <rect x=\"276\" y=\"34\" width=\"124\" height=\"110\" fill=\"rgba(255,209,102,0.08)\" stroke=\"rgba(255,209,102,0.28)\" rx=\"8\"/>\n  <text x=\"338\" y=\"52\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"18\">📊</text>\n  <text x=\"338\" y=\"68\" text-anchor=\"middle\" fill=\"#FFD166\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Outliers</text>\n  <text x=\"338\" y=\"84\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">One fare = $512</text>\n  <text x=\"338\" y=\"97\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">pulls mean from</text>\n  <text x=\"338\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(255,209,102,0.8)\" font-size=\"8.5\" font-family=\"monospace\">$15 to $32 (2×!)</text>\n  <text x=\"338\" y=\"135\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">Fix: clip, IQR filter</text>\n  <!-- Card 4: Duplicates -->\n  <rect x=\"408\" y=\"34\" width=\"140\" height=\"110\" fill=\"rgba(139,92,246,0.1)\" stroke=\"rgba(139,92,246,0.28)\" rx=\"8\"/>\n  <text x=\"478\" y=\"52\" text-anchor=\"middle\" fill=\"#8B5CF6\" font-size=\"18\">🔁</text>\n  <text x=\"478\" y=\"68\" text-anchor=\"middle\" fill=\"#C4B5FD\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Duplicates</text>\n  <text x=\"478\" y=\"84\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">Model sees same</text>\n  <text x=\"478\" y=\"97\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.6)\" font-size=\"9\" font-family=\"monospace\">row 3× → biased</text>\n  <text x=\"478\" y=\"110\" text-anchor=\"middle\" fill=\"rgba(196,181,253,0.8)\" font-size=\"8.5\" font-family=\"monospace\">Falsely high accuracy</text>\n  <text x=\"478\" y=\"135\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"8\" font-family=\"monospace\">Fix: drop_duplicates()</text>\n  <!-- Real example bar chart comparison -->\n  <text x=\"280\" y=\"166\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.65)\" font-size=\"10.5\" font-family=\"monospace\">Real impact: model trained on dirty data vs clean data</text>\n  <!-- Dirty bar -->\n  <rect x=\"80\" y=\"178\" width=\"120\" height=\"24\" fill=\"rgba(239,68,68,0.6)\" rx=\"4\"/>\n  <text x=\"140\" y=\"194\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Dirty Data — RMSE: $42,000</text>\n  <!-- Clean bar -->\n  <rect x=\"80\" y=\"210\" width=\"68\" height=\"24\" fill=\"rgba(67,233,123,0.6)\" rx=\"4\"/>\n  <text x=\"280\" y=\"226\" text-anchor=\"middle\" fill=\"#43e97b\" font-size=\"10\" font-weight=\"bold\" font-family=\"monospace\">Clean Data — RMSE: $24,000  (43% better!)</text>\n  <text x=\"280\" y=\"252\" text-anchor=\"middle\" fill=\"rgba(255,255,255,0.45)\" font-size=\"9.5\" font-family=\"monospace\">Same model, same features — only difference is proper cleaning</text>\n</svg><div class=\"code-wrap\" style=\"margin-top:8px;\"><div class=\"code-header\"><span>cleaning_consequences.py</span><span>python</span></div><div style=\"padding:5px 14px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">before building any ML model — NaN crashes sklearn</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">NaN silently propagates: mean(NaN)=NaN, model.fit() raises ValueError</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">try fitting a model without cleaning and read the error message</span></span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\ndf = pd.read_csv(<span class=\"st\">\"employees.csv\"</span>)\n<span class=\"fn\">print</span>(df.isnull().sum())        <span class=\"cm\"># spot NaN per column</span>\n<span class=\"fn\">print</span>(df.dtypes)               <span class=\"cm\"># spot wrong types</span>\n<span class=\"fn\">print</span>(df.duplicated().sum())   <span class=\"cm\"># count duplicate rows</span>\n\n<span class=\"cm\"># Fix: salary stored as \"55,000\" (string)</span>\ndf[<span class=\"st\">\"salary\"</span>] = pd.to_numeric(df[<span class=\"st\">\"salary\"</span>].str.replace(<span class=\"st\">\",\"</span>, <span class=\"st\">\"\"</span>), errors=<span class=\"st\">\"coerce\"</span>)\n\n<span class=\"cm\"># Fix: outliers — cap at 99th percentile</span>\ncap = df[<span class=\"st\">\"salary\"</span>].quantile(<span class=\"nm\">0.99</span>)\ndf[<span class=\"st\">\"salary\"</span>] = df[<span class=\"st\">\"salary\"</span>].clip(upper=cap)\n\n<span class=\"cm\"># Fix: all issues in a pipeline</span>\ndf = (df\n    .drop_duplicates()\n    .fillna({<span class=\"st\">\"age\"</span>: df[<span class=\"st\">\"age\"</span>].median(), <span class=\"st\">\"salary\"</span>: df[<span class=\"st\">\"salary\"</span>].median()})\n)</pre>\n<div style=\"background:rgba(255,255,255,0.05);border-bottom:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Fixes column names, fills nulls, removes duplicates, and corrects dtypes — the full cleaning pipeline.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">fillna()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ replaces every NaN (missing) cell with the value you specify — e.g. 0, \"Unknown\", or df.mean()</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">isnull()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ returns True/False for each cell; .sum() after it counts missing values per column</span></div></div></div></div><div class=\"warn\">⚠️ <strong>Garbage in = Garbage out.</strong> A perfect model trained on dirty data will still produce wrong predictions. Cleaning is not optional — it is the foundation.</div>"}, {"label": "Encoding Categoricals", "html": "<div class=\"section-tag\">Concept 3</div><div class=\"slide-heading\">Encoding Categorical Variables 🔤</div><div class=\"warn\" style=\"margin-bottom:10px;\">⚠️ <strong>ML models only understand numbers.</strong> You cannot pass \"Singapore\" or \"Phone\" into sklearn — it raises a TypeError. Every text/category column MUST be converted to numbers before training.</div><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;\"><div><div style=\"font-size:11px;font-weight:700;color:#ef4444;margin-bottom:5px;\">❌ BEFORE Encoding — breaks sklearn</div><table><tr><th>city</th><th>product</th><th>price</th></tr><tr><td style=\"color:#f97583;font-weight:700;\">SG</td><td>Phone</td><td>499</td></tr><tr><td style=\"color:#f97583;font-weight:700;\">MY</td><td>Laptop</td><td>1200</td></tr><tr><td style=\"color:#f97583;font-weight:700;\">TH</td><td>Tablet</td><td>699</td></tr></table><div class=\"warn\" style=\"margin-top:6px;font-size:10.5px;padding:6px 10px;\">TypeError: could not convert string to float: 'SG'<br><span style=\"color:rgba(255,255,255,0.5);\">sklearn sees text → crashes immediately</span></div></div><div><div style=\"font-size:11px;font-weight:700;color:#43e97b;margin-bottom:5px;\">✅ AFTER One-Hot Encoding — sklearn ready</div><table><tr><th>city_MY</th><th>city_SG</th><th>city_TH</th><th>price</th></tr><tr><td>0</td><td style=\"color:#43e97b;font-weight:700;\">1</td><td>0</td><td>499</td></tr><tr><td style=\"color:#43e97b;font-weight:700;\">1</td><td>0</td><td>0</td><td>1200</td></tr><tr><td>0</td><td>0</td><td style=\"color:#43e97b;font-weight:700;\">1</td><td>699</td></tr></table><div class=\"tip\" style=\"margin-top:6px;font-size:10.5px;padding:6px 10px;\">All numbers now — model can compute weights, distances, predictions.<br><span style=\"color:rgba(255,255,255,0.5);\">Each category gets its own 0/1 column</span></div></div></div><div class=\"code-wrap\"><div class=\"code-header\"><span>encoding.py</span><span>python</span></div><div style=\"background:rgba(255,255,255,0.05);border-bottom:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Shows all three encoding strategies side by side — one-hot for nominal categories (no order), label/map for ordinal categories (has order), and frequency encoding for very high cardinality columns.</div><div style=\"display:flex;flex-direction:column;gap:3px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">get_dummies()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ creates one 0/1 binary column per unique value — \"SG\" becomes city_SG=1, all others=0</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">.map(dict)</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ replaces each value using a lookup dictionary — use when categories have a meaningful order (S=0, M=1, L=2, XL=3)</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">value_counts()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ counts occurrences of each unique value — dividing by len(df) converts counts to frequency ratios (0.0–1.0)</span></div></div></div><div style=\"padding:5px 14px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">any ML model with text/category columns — models only accept numbers</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">Label Encoding for ordinal (S&lt;M&lt;L&lt;XL); One-Hot for nominal (city names)</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">pd.get_dummies(df, drop_first=True) — avoids dummy variable trap</span></span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\nfrom sklearn.preprocessing <span class=\"kw\">import</span> LabelEncoder\n\ndf = pd.DataFrame({<span class=\"st\">\"size\"</span>:[<span class=\"st\">\"S\"</span>,<span class=\"st\">\"L\"</span>,<span class=\"st\">\"M\"</span>,<span class=\"st\">\"XL\"</span>],\n                   <span class=\"st\">\"city\"</span>:[<span class=\"st\">\"SG\"</span>,<span class=\"st\">\"MY\"</span>,<span class=\"st\">\"SG\"</span>,<span class=\"st\">\"TH\"</span>]})\n\n<span class=\"cm\"># ── One-hot encoding (NOMINAL — no order) ─────────────────</span>\n<span class=\"cm\"># Use when: categories have no natural ordering</span>\ndf_ohe = pd.get_dummies(df, columns=[<span class=\"st\">\"city\"</span>])\n<span class=\"cm\"># Creates: city_MY, city_SG, city_TH  (each row has exactly one 1)</span>\n\n<span class=\"cm\"># ── Label encoding (ORDINAL — has order) ──────────────────</span>\n<span class=\"cm\"># Use when: categories have a meaningful order</span>\nsize_map = {<span class=\"st\">\"S\"</span>: <span class=\"nm\">0</span>, <span class=\"st\">\"M\"</span>: <span class=\"nm\">1</span>, <span class=\"st\">\"L\"</span>: <span class=\"nm\">2</span>, <span class=\"st\">\"XL\"</span>: <span class=\"nm\">3</span>}\ndf[<span class=\"st\">\"size_encoded\"</span>] = df[<span class=\"st\">\"size\"</span>].map(size_map)\n\n<span class=\"cm\"># ── Frequency encoding (HIGH CARDINALITY) ─────────────────</span>\n<span class=\"cm\"># Use when: too many unique values for OHE (e.g. 500 zip codes)</span>\nfreq = df[<span class=\"st\">\"city\"</span>].value_counts() / len(df)\ndf[<span class=\"st\">\"city_freq\"</span>] = df[<span class=\"st\">\"city\"</span>].map(freq)</pre></div><table style=\"margin-top:8px;\"><tr><th>Method</th><th>When to Use</th><th>Drawback</th></tr><tr><td>One-Hot</td><td>Nominal, &lt;20 unique values</td><td>Many columns with high cardinality</td></tr><tr><td>Label / Map</td><td>Ordinal (ordered) categories</td><td>Implies order if used on nominal data</td></tr><tr><td>Frequency</td><td>High cardinality (&gt;50 unique)</td><td>Different categories might share same frequency</td></tr></table>"}, {"label": "One-Hot Encoding — Deep Dive", "html": "<div class=\"section-tag\">Deep Dive</div><div class=\"slide-heading\">One-Hot Encoding — How It Actually Works 🔢</div><div class=\"big-concept\" style=\"padding:14px 20px;margin-bottom:10px;\"><div style=\"font-size:16px;font-weight:700;color:#fff;margin-bottom:4px;\">1 text column with N unique values → N binary (0/1) columns</div><div style=\"font-size:12px;color:var(--muted);\">Each row gets exactly one 1 across all new columns — the rest are 0</div></div><div class=\"cards cards-3\" style=\"margin-bottom:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">1️⃣</div><h3>Find Unique Values</h3><p>city column has 3 unique values:<br>\"SG\", \"MY\", \"TH\"<br><br>Each unique value becomes a new column:<br><strong>city_SG · city_MY · city_TH</strong></p></div><div class=\"card card-accent\"><div class=\"card-icon\">2️⃣</div><h3>Binary Assignment</h3><p>For each row, put 1 in the matching column, 0 everywhere else:<br><br>\"SG\" → [<strong style=\"color:#43e97b;\">1</strong>, 0, 0]<br>\"MY\" → [0, <strong style=\"color:#43e97b;\">1</strong>, 0]<br>\"TH\" → [0, 0, <strong style=\"color:#43e97b;\">1</strong>]<br><br>Exactly one 1 per row — always.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">3️⃣</div><h3>Replace Original</h3><p>Drop the original \"city\" text column, use the new binary columns instead.<br><br>1 text column → 3 numeric columns → sklearn can now learn from it.</p></div></div><div class=\"code-wrap\"><div class=\"code-header\"><span>one_hot_encoding.py</span><span>python</span></div><div style=\"background:rgba(255,255,255,0.05);border-bottom:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Prints the DataFrame BEFORE encoding (raw text), applies get_dummies(), then prints AFTER — so you can see exactly how each column transforms.</div><div style=\"display:flex;flex-direction:column;gap:3px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">get_dummies()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ scans unique values in the column, creates one 0/1 column per unique value, drops the original text column automatically</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">drop_first=True</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ removes one redundant column — if city_MY=0 and city_SG=0, the model already knows it's city_TH (avoids dummy variable trap)</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">astype(int)</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ converts True/False boolean output into 1/0 integers — some sklearn models require int, not bool</span></div></div></div><div style=\"padding:5px 14px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">nominal categories with no natural ordering — city, colour, product type</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">if you label-encoded (SG=0,MY=1,TH=2), the model would wrongly assume TH &gt; MY &gt; SG</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">print(df_encoded.head()) — inspect the new 0/1 columns created</span></span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n\n<span class=\"cm\"># ── BEFORE: raw text column — sklearn will crash ──────────</span>\ndf = pd.DataFrame({\n    <span class=\"st\">\"city\"</span>  : [<span class=\"st\">\"SG\"</span>, <span class=\"st\">\"MY\"</span>, <span class=\"st\">\"SG\"</span>, <span class=\"st\">\"TH\"</span>],\n    <span class=\"st\">\"price\"</span> : [<span class=\"nm\">499</span>, <span class=\"nm\">1200</span>, <span class=\"nm\">699</span>, <span class=\"nm\">350</span>]\n})\n<span class=\"fn\">print</span>(<span class=\"st\">\"BEFORE:\\n\"</span>, df)\n<span class=\"cm\">#   city  price</span>\n<span class=\"cm\"># 0   SG    499   ← sklearn cannot use \"SG\"</span>\n<span class=\"cm\"># 1   MY   1200</span>\n\n<span class=\"cm\"># ── AFTER: one-hot encode the city column ─────────────────</span>\ndf_encoded = pd.get_dummies(df, columns=[<span class=\"st\">\"city\"</span>])\n<span class=\"fn\">print</span>(<span class=\"st\">\"\\nAFTER:\\n\"</span>, df_encoded)\n<span class=\"cm\">#    price  city_MY  city_SG  city_TH</span>\n<span class=\"cm\"># 0    499        0        1        0   ← SG=1, rest=0</span>\n<span class=\"cm\"># 1   1200        1        0        0   ← MY=1, rest=0</span>\n<span class=\"cm\"># 2    699        0        1        0</span>\n<span class=\"cm\"># 3    350        0        0        1   ← TH=1, rest=0</span>\n\n<span class=\"cm\"># ── Drop one column to avoid dummy variable trap ──────────</span>\ndf_clean = pd.get_dummies(df, columns=[<span class=\"st\">\"city\"</span>], drop_first=<span class=\"kw\">True</span>)\n<span class=\"cm\"># Keeps city_SG, city_TH only — city_MY is implied when both are 0</span></pre></div><div class=\"cards cards-3\" style=\"margin-top:9px;\"><div class=\"card card-accent\"><div class=\"card-icon\">✅</div><h3>Advantages</h3><p><strong>No false ordering:</strong> model cannot wrongly rank categories against each other.<br><br><strong>Universal:</strong> works with every sklearn algorithm — linear, tree-based, and neural.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">⚠️</div><h3>Limitations</h3><p><strong>High cardinality:</strong> 500 unique zip codes → 500 new columns (use frequency encoding instead).<br><br><strong>Dummy trap:</strong> perfectly correlated columns confuse linear models — always use drop_first=True.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🎯</div><h3>When to Use</h3><p>Nominal categories — city, colour, product type, country — with no natural ordering.<br><br>Best when fewer than ~20 unique values. For 20+ unique values, use frequency or target encoding.</p></div></div>"}, {"label": "Scaling Features", "html": "<div class=\"section-tag\">Concept 4</div><div class=\"slide-heading\">Scaling Features — Why Models Care About Scale 📏</div><div class=\"code-wrap\"><div class=\"code-header\"><span>scaling.py</span><span>python</span></div><div style=\"background:rgba(255,255,255,0.05);border-bottom:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Applies StandardScaler and MinMaxScaler to age and salary — shows the scaled output.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">train_test_split()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ randomly splits X and y into training and test sets; test_size=0.2 → 20% held out for evaluation</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">fit_transform()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ fits the scaler on the data AND transforms it in one step — only use on training data</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">transform()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ applies an already-fitted scaler to new data; fit only on train, transform both train and test</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">StandardScaler()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ scales each feature to mean=0 and std=1 — required for Ridge, Lasso, SVM, KNN, Neural Nets</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">MinMaxScaler()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ scales values to [0,1] — essential for LSTM; raw prices cause gradient issues</span></div></div></div><div style=\"padding:5px 14px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">Ridge, Lasso, SVM, KNN, Neural Networks — distance/gradient-based models</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">salary=50000 vs age=30 — salary dominates without scaling</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">print(X_scaled.mean(axis=0)) — should be ~0 after StandardScaler</span></span></div><pre><span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler, MinMaxScaler\n<span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n\nX = pd.DataFrame({\n    <span class=\"st\">\"age\"</span>: [<span class=\"nm\">25</span>, <span class=\"nm\">35</span>, <span class=\"nm\">45</span>, <span class=\"nm\">55</span>],\n    <span class=\"st\">\"salary\"</span>: [<span class=\"nm\">30000</span>, <span class=\"nm\">50000</span>, <span class=\"nm\">70000</span>, <span class=\"nm\">90000</span>],\n})\n\n<span class=\"cm\"># ── StandardScaler: mean=0, std=1 (Z-score) ──────────────</span>\n<span class=\"cm\"># Use when: normal-ish distribution, no hard bounds</span>\n<span class=\"cm\"># Works with: linear models, SVM, neural networks, PCA</span>\nscaler_std = StandardScaler()\nX_std = scaler_std.fit_transform(X)\n\n<span class=\"cm\"># ── MinMaxScaler: all values → [0, 1] ────────────────────</span>\n<span class=\"cm\"># Use when: bounded range needed, no extreme outliers</span>\n<span class=\"cm\"># Works with: neural networks (pixel values), KNN</span>\nscaler_mm = MinMaxScaler()\nX_mm = scaler_mm.fit_transform(X)\n\n<span class=\"cm\"># CRITICAL: fit on TRAIN, transform both train and test</span>\nfrom sklearn.model_selection <span class=\"kw\">import</span> train_test_split\nX_train, X_test, y_train, y_test = train_test_split(X, y)\nscaler = StandardScaler()\nX_train_s = scaler.fit_transform(X_train)   <span class=\"cm\"># fit + transform train</span>\nX_test_s  = scaler.transform(X_test)        <span class=\"cm\"># transform only (no fit!)</span></pre>\n</div><div class=\"warn\">⚠️ <strong>Data leakage:</strong> Never fit the scaler on all data before the split — that leaks test set statistics into training. Always: fit on train, transform both.</div>"}, {"label": "Min-Max Scaler — Deep Dive", "html": "<div class=\"section-tag\">Deep Dive</div><div class=\"slide-heading\">Min-Max Scaler — How It Actually Works 📏</div><div class=\"big-concept\" style=\"padding:14px 20px;margin-bottom:10px;\"><div style=\"font-size:16px;font-weight:700;color:#fff;margin-bottom:
