4px;\">Takes every value and squeezes it into a range of 0 → 1</div><div style=\"font-size:12px;color:var(--muted);\">The smallest value becomes 0, the largest becomes 1 — everything else lands proportionally in between</div></div><div class=\"cards cards-3\" style=\"margin-bottom:10px;\"><div class=\"card card-accent\"><div class=\"card-icon\">1️⃣</div><h3>Find Min &amp; Max</h3><p>Look at all values in the column and record the smallest and largest.<br><br>Salaries: 30k, 50k, 70k, 90k<br><strong>Min = 30k &nbsp;·&nbsp; Max = 90k</strong><br><br>These two anchor points define the new scale.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">2️⃣</div><h3>Apply the Formula</h3><p style=\"font-family:monospace;color:#4facfe;font-size:12px;margin-bottom:6px;\">X_scaled = (X − X_min) / (X_max − X_min)</p><p>30k → (30−30)/(90−30) = <strong style=\"color:#43e97b;\">0.00</strong><br>50k → (50−30)/(90−30) = <strong style=\"color:#43e97b;\">0.33</strong><br>70k → (70−30)/(90−30) = <strong style=\"color:#43e97b;\">0.67</strong><br>90k → (90−30)/(90−30) = <strong style=\"color:#43e97b;\">1.00</strong></p></div><div class=\"card card-accent\"><div class=\"card-icon\">3️⃣</div><h3>Result: Always [0, 1]</h3><p>Every value is now between 0 and 1 — no feature dominates another.<br><br>Age (25–55) and Salary (30k–90k) are now on the exact same scale so the model treats them equally.<br><br>Shape of the distribution is <strong>preserved</strong>.</p></div></div><div class=\"code-wrap\"><div class=\"code-header\"><span>min_max_scaler.py</span><span>python</span></div><div style=\"background:rgba(255,255,255,0.05);border-bottom:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Shows the min-max formula manually with numpy, then applies sklearn MinMaxScaler — confirms both produce identical output.</div><div style=\"display:flex;flex-direction:column;gap:3px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">MinMaxScaler()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ finds min and max from training data during fit(), then applies (X−min)/(max−min) during transform()</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">feature_range=(0,1)</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ default range; change to (−1, 1) for tanh activations or any custom range you need</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">scaler.data_min_</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ inspect what min/max the scaler learned from training data — useful for debugging</span></div></div></div><div style=\"padding:5px 14px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">neural networks, image pixels (0–255 → 0–1), KNN, K-Means — bounded range needed</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">salary=90,000 vs age=55 — without scaling, salary drowns out age in every distance calculation</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">print(scaler.data_min_, scaler.data_max_) — see what the scaler learned</span></span></div><pre><span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\n<span class=\"kw\">from</span> sklearn.preprocessing <span class=\"kw\">import</span> MinMaxScaler\n\nsalaries = np.array([<span class=\"nm\">30000</span>, <span class=\"nm\">50000</span>, <span class=\"nm\">70000</span>, <span class=\"nm\">90000</span>], dtype=float)\n\n<span class=\"cm\"># ── Manual formula — so you see exactly what sklearn does ─</span>\nx_min, x_max = salaries.min(), salaries.max()\nmanual = (salaries - x_min) / (x_max - x_min)\n<span class=\"fn\">print</span>(<span class=\"st\">\"Manual:\"</span>, manual)\n<span class=\"cm\"># [0.    0.333  0.667  1.0]</span>\n\n<span class=\"cm\"># ── sklearn MinMaxScaler — same result ────────────────────</span>\nscaler = MinMaxScaler()\nscaled = scaler.fit_transform(salaries.reshape(<span class=\"nm\">-1</span>, <span class=\"nm\">1</span>)).flatten()\n<span class=\"fn\">print</span>(<span class=\"st\">\"sklearn:\"</span>, scaled)\n<span class=\"cm\"># [0.    0.333  0.667  1.0]  ← identical</span>\n\n<span class=\"cm\"># CRITICAL: fit on TRAIN only, transform both ─────────────</span>\n<span class=\"kw\">from</span> sklearn.model_selection <span class=\"kw\">import</span> train_test_split\nX_train, X_test = train_test_split(salaries.reshape(<span class=\"nm\">-1</span>,<span class=\"nm\">1</span>), test_size=<span class=\"nm\">0.25</span>)\nscaler2 = MinMaxScaler()\nX_train_s = scaler2.fit_transform(X_train)  <span class=\"cm\"># fit + transform train</span>\nX_test_s  = scaler2.transform(X_test)       <span class=\"cm\"># transform only — no fit!</span>\n<span class=\"fn\">print</span>(<span class=\"st\">\"Min learned:\"</span>, scaler2.data_min_)</pre></div><div class=\"cards cards-3\" style=\"margin-top:9px;\"><div class=\"card card-accent\"><div class=\"card-icon\">✅</div><h3>Advantages</h3><p><strong>Bounded output:</strong> always [0, 1] — perfect for neural net inputs and image pixels.<br><br><strong>Preserves shape:</strong> distribution stays the same, just rescaled.</p></div><div class=\"card card-accent\"><div class=\"card-icon\">⚠️</div><h3>Limitations</h3><p><strong>Outlier sensitive:</strong> one value of 900,000 squishes everything else near 0.<br><br><strong>Test leakage risk:</strong> test values outside train min/max fall outside [0,1].</p></div><div class=\"card card-accent\"><div class=\"card-icon\">🎯</div><h3>When to Use</h3><p>Neural networks, image pixel values (0–255 → 0–1), KNN, K-Means.<br><br>Use <strong>StandardScaler</strong> instead when data has outliers or a roughly normal distribution.</p></div></div>"}, {"label": "Code Lab", "html": "<div class=\"section-tag\">Hands-On</div><div class=\"slide-heading\">Code Lab — Full Feature Engineering Pipeline 💻</div><div class=\"code-wrap\"><div class=\"code-header\"><span>lab_08_features.py</span><span>python</span></div><div style=\"background:rgba(255,255,255,0.05);border-bottom:2px solid rgba(255,255,255,0.08);padding:9px 14px;font-size:11px;\"><div style=\"color:#fff;font-weight:700;margin-bottom:6px;font-size:11.5px;\">🔍 What this block does</div><div style=\"color:#ccc;font-size:11.5px;margin-bottom:7px;line-height:1.55;\">Full pipeline: Titanic data → clean → encode → scale → split → train.</div><div style=\"display:flex;flex-direction:column;gap:1px;\"><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">fillna()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ replaces every NaN (missing) cell with the value you specify — e.g. 0, \"Unknown\", or df.mean()</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">train_test_split()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ randomly splits X and y into training and test sets; test_size=0.2 → 20% held out for evaluation</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">fit_transform()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ fits the scaler on the data AND transforms it in one step — only use on training data</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">transform()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ applies an already-fitted scaler to new data; fit only on train, transform both train and test</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">StandardScaler()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ scales each feature to mean=0 and std=1 — required for Ridge, Lasso, SVM, KNN, Neural Nets</span></div><div style=\"display:flex;gap:6px;align-items:flex-start;padding:2px 0;\"><code style=\"color:#d2a8ff;font-family:'Cascadia Code',monospace;font-size:11px;white-space:nowrap;flex-shrink:0;\">get_dummies()</code><span style=\"color:#8b949e;font-size:11px;line-height:1.5;\">→ one-hot encodes categorical columns — creates one binary column per category</span></div></div></div><div style=\"padding:5px 14px;display:flex;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.07);font-size:10.5px;\"><span><span style=\"color:#4facfe;font-weight:700;\">📅 When: </span><span style=\"color:#8b949e;\">full feature engineering pipeline from raw → model-ready</span></span><span><span style=\"color:#43e97b;font-weight:700;\">💡 Why: </span><span style=\"color:#8b949e;\">cleaning → encoding → scaling → split → train — the real workflow</span></span><span><span style=\"color:#FFD166;font-weight:700;\">✏️ Try: </span><span style=\"color:#8b949e;\">add 2 engineered features (e.g. fare_per_person, family_size)</span></span></div><pre><span class=\"kw\">import</span> pandas <span class=\"kw\">as</span> pd\n<span class=\"kw\">import</span> numpy <span class=\"kw\">as</span> np\nfrom sklearn.preprocessing <span class=\"kw\">import</span> StandardScaler\nfrom sklearn.model_selection <span class=\"kw\">import</span> train_test_split\n\ndf = sns.load_dataset(<span class=\"st\">\"titanic\"</span>)\n\n<span class=\"cm\"># Step 1: Clean</span>\ndf[<span class=\"st\">\"age\"</span>] = df[<span class=\"st\">\"age\"</span>].fillna(df[<span class=\"st\">\"age\"</span>].median())\ndf[<span class=\"st\">\"embarked\"</span>] = df[<span class=\"st\">\"embarked\"</span>].fillna(<span class=\"st\">\"S\"</span>)\ndf = df.drop(columns=[<span class=\"st\">\"cabin\"</span>,<span class=\"st\">\"name\"</span>,<span class=\"st\">\"ticket\"</span>])\n\n<span class=\"cm\"># Step 2: Engineer new features</span>\ndf[<span class=\"st\">\"family_size\"</span>] = df[<span class=\"st\">\"sibsp\"</span>] + df[<span class=\"st\">\"parch\"</span>] + <span class=\"nm\">1</span>\ndf[<span class=\"st\">\"is_alone\"</span>]    = (df[<span class=\"st\">\"family_size\"</span>] == <span class=\"nm\">1</span>).astype(<span class=\"nm\">int</span>)\ndf[<span class=\"st\">\"fare_per_person\"</span>] = df[<span class=\"st\">\"fare\"</span>] / df[<span class=\"st\">\"family_size\"</span>]\ndf[<span class=\"st\">\"log_fare\"</span>] = np.log1p(df[<span class=\"st\">\"fare\"</span>])\n\n<span class=\"cm\"># Step 3: Encode categoricals</span>\ndf = pd.get_dummies(df, columns=[<span class=\"st\">\"sex\"</span>,<span class=\"st\">\"embarked\"</span>])\n\n<span class=\"cm\"># Step 4: Scale numerics</span>\nfeature_cols = [<span class=\"st\">\"age\"</span>,<span class=\"st\">\"fare\"</span>,<span class=\"st\">\"family_size\"</span>,<span class=\"st\">\"log_fare\"</span>]\nX, y = df[feature_cols + [c <span class=\"kw\">for</span> c <span class=\"kw\">in</span> df.columns <span class=\"kw\">if</span> c.startswith((<span class=\"st\">\"sex_\"</span>,<span class=\"st\">\"emb\"</span>))]], df[<span class=\"st\">\"survived\"</span>]\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=<span class=\"nm\">0.2</span>)\nscaler = StandardScaler()\nX_train = scaler.fit_transform(X_train)\nX_test  = scaler.transform(X_test)</pre>\n</div>"}, {"label": "Common Mistakes", "html": "<div class=\"section-tag\">Watch Out!</div><div class=\"slide-heading\">Feature Engineering Mistakes ⚠️</div><div class=\"e-list\"><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Data leakage — fitting scaler on full dataset</strong><br><code>scaler.fit_transform(X)</code> before the train/test split leaks test statistics into training.<br>✅ Fix: Split FIRST, then <code>scaler.fit(X_train)</code>, <code>scaler.transform(X_test)</code>.</div></div><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Label encoding nominal categories</strong><br><code>LabelEncoder</code> on \"City\" makes model think Singapore(2) > Malaysia(1). Nonsense ordering.<br>✅ Fix: Use <code>pd.get_dummies()</code> (one-hot) for unordered categories.</div></div><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Scaling before encoding</strong><br>You can't scale strings. Always encode → then scale.<br>✅ Fix: Clean → Encode categoricals → Split → Scale numerics.</div></div><div class=\"e-item\"><div class=\"e-icon\">❌</div><div><strong>Not handling NaN before model training</strong><br>Most sklearn models raise ValueError on NaN inputs.<br>✅ Fix: <code>df.isnull().sum()</code> → fillna/dropna → then model.</div></div></div>"}, {"label": "Session Recap", "html": "<div class=\"section-tag\">Session Recap</div><div class=\"slide-heading\">What You've Learned 🎉</div><div class=\"recap-grid\"><div class=\"recap-item\"><div class=\"recap-icon\">🧹</div><div class=\"recap-text\"><h4>Data Cleaning</h4><p>Fix column names, data types, missing values (median/fillna), remove duplicates, cap outliers with IQR.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🔤</div><div class=\"recap-text\"><h4>Encoding</h4><p>One-hot for nominal (no order). Label/map for ordinal (has order). Frequency encoding for high cardinality.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📏</div><div class=\"recap-text\"><h4>Scaling</h4><p>StandardScaler (z-score) for linear models/SVMs. MinMaxScaler for neural nets/KNN. ALWAYS fit on train only.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">✨</div><div class=\"recap-text\"><h4>Feature Creation</h4><p>Ratios, date parts, log transform (skewed data), rolling averages, binning with pd.cut().</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">📊</div><div class=\"recap-text\"><h4>Order Matters</h4><p>Pipeline: Clean → Engineer → Encode → Split → Scale → Model. Never scale before split.</p></div></div><div class=\"recap-item\"><div class=\"recap-icon\">🔥</div><div class=\"recap-text\"><h4>Finance Features</h4><p>Moving averages, pct_change returns, Bollinger Bands, rolling volatility — the vocabulary of quant finance.</p></div></div></div><div class=\"highlight\" style=\"margin-top:auto;\">🚀 <strong>Next:</strong> Session 9 — Intro to Machine Learning: plug your engineered features into real models</div>"}];




let cur=0;
const wrap=document.getElementById('slides-wrap');
const dotsEl=document.getElementById('dots');
function renderSlides(){
  wrap.innerHTML='';dotsEl.innerHTML='';
  SLIDES_DATA.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===0?' active':'');
    div.innerHTML=s.html;
    wrap.appendChild(div);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' active':'');
    dot.onclick=()=>jump(i);
    dotsEl.appendChild(dot);
  });
  updateUI();
}
function updateUI(){
  const t=SLIDES_DATA.length;
  document.getElementById('counter').textContent=(cur+1)+' / '+t;
  document.getElementById('progress-bar').style.width=((cur+1)/t*100)+'%';
  document.getElementById('slide-title-bar').textContent=SLIDES_DATA[cur].label||'';
  document.getElementById('prev-btn').disabled=cur===0;
  document.getElementById('next-btn').disabled=cur===t-1;
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===cur));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===cur));
}
function go(d){jump(cur+d);}
function jump(i){if(i<0||i>=SLIDES_DATA.length)return;cur=i;updateUI();document.querySelectorAll('.slide')[cur].scrollTop=0;}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  if(e.key==='f'||e.key==='F')toggleFS();
  if(e.key==='Home')jump(0);
  if(e.key==='End')jump(SLIDES_DATA.length-1);
});
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}

let _tx=0;
document.addEventListener('touchstart',e=>{_tx=e.changedTouches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-_tx;
  if(Math.abs(dx)>50){go(dx<0?1:-1);}
},{passive:true});
renderSlides();
</script></body></html>
